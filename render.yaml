services:
  - type: web
    name: oneira-workbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oneira-db
          property: connectionString
databases:
  - name: oneira-db
    plan: free
