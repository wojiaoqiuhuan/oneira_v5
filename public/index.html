<script>
const $=s=>document.querySelector(s);const icon=(name)=>{const p={store:'<path d="M3 10h18l-2-6H5z"/><path d="M4 10v10h16V10M9 20v-6h6v6"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/>',report:'<path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 8h10M7 12h10M7 16h6"/>',issue:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.2 9.2 0 0 1-3.7-.8L3 21l1.9-4A8.2 8.2 0 0 1 3 11.5a8.5 8.5 0 0 1 18 0Z"/><path d="M12 8v4M12 15h.01"/>',settings:'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1-1.7 3-2-.8a8 8 0 0 1-1.5.9l-.3 2.1h-3.5l-.3-2.1a8 8 0 0 1-1.5-.9l-2 .8-1.7-3 .1-.1 1.7-1.3a8 8 0 0 1 0-1.8L5 10.6l1.7-3 2 .8a8 8 0 0 1 1.5-.9l.3-2.1H14l.3 2.1a8 8 0 0 1 1.5.9l2-.8 1.7 3-1.7 1.3a8 8 0 0 1 0 1.8Z"/>',money:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M17 15h.01M12 9v6M9.5 11h5"/>',orders:'<path d="M5 4h14l1 16H4L5 4Z"/><path d="M9 8a3 3 0 0 0 6 0"/>',waste:'<path d="M4 7h16M10 11v5M14 11v5M6 7l1 14h10l1-14M9 7V4h6v3"/>',member:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M16 14a5 5 0 0 1 5 5"/>',trend:'<path d="M4 17 9 12l4 3 7-8"/><path d="M16 7h4v4"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',filter:'<path d="M4 5h16M7 12h10M10 19h4"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};return '<span class="icon"><svg viewBox="0 0 24 24">'+(p[name]||p.chart)+'</svg></span>'};
const api=async(u,o={})=>{const r=await fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.token||''),...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'请求失败');return d};
let state={user:null,tab:'home',month:new Date().toISOString().slice(0,7),stores:[],fields:[],reports:[],tasks:[],issues:[],goals:[],users:[],accounts:[],audit:[],reviews:[],annotations:[],analytics:null,analyticsFrom:'',analyticsTo:'',analyticsStore:'all',metric:'revenue',rankingMetrics:[],aiSettings:null,aiAnalysis:{status:'idle',content:'',error:'',from:'',to:'',startedAt:null},calendarStore:'all',reportDraftDate:'',reportDraft:null,reportStoreId:null,adminReports:[],reportColumns:{date:true,time:true,store:true,submitter:true,revenue:true,received:true,orders:true,trialRatio:true,wasteRatio:true}};
const standardFields=[['totalRevenue','总营业额','元',true],['discounts','优惠/折扣券合计','元',false],['received','实收金额（实际到账）','元',false],['onlineMeituanGroup','美团团购','元',false],['onlineMeituanDelivery','美团外卖','元',false],['onlineDouyinGroup','抖音团购','元',false],['onlineTaobaoFlash','淘宝闪购','元',false],['platformTotal','合计平台收入','元',false],['memberCardConsumption','会员卡消费','元',false],['memberCardRecharge','会员卡充值','元',false],['cash','现金','元',false],['onsiteDigital','微信/支付宝/云闪付到店','元',false],['trialCount','试吃数量','个',false],['wasteCount','报损数量','个',false],['trialAmount','试吃金额','元',false],['trialRatio','试吃占比','%',false],['wasteAmount','报损金额','元',false],['wasteRatio','报损占比','%',false],['physicalCardBalance','会员实体卡余量','张',false],['eggTartGiftCount','蛋挞抖音赠送','个',false],['eggTartGiftAmount','蛋挞赠送金额','元',false],['orders','订单量','单',false],['members','会员新增','人',false]];
function templateFields(){const map=new Map(state.fields.map(f=>[f.key,f]));const canonical=state.fields.some(f=>standardFields.some(x=>x[0]===f.key));const standard=standardFields.filter(([key])=>!canonical||map.has(key)).map(([key,label,unit,required],i)=>{const f=map.get(key)||map.get(key==='totalRevenue'?'revenue':key==='wasteRatio'?'wasteRate':'');return {...(f||{}),key,label:f?.label||label,unit:f?.unit||unit,field_type:f?.field_type||'number',required:f?.required??required,sort_order:i+1}});return standard.concat(state.fields.filter(f=>!standardFields.some(x=>x[0]===f.key)&&!['revenue','wasteRate'].includes(f.key)))}
function fieldMeta(key,label,unit){const canonical=state.fields.some(f=>standardFields.some(x=>x[0]===f.key));if(canonical&&!state.fields.some(f=>f.key===key))return {disabled:true,label,unit};const f=state.fields.find(x=>x.key===key)||state.fields.find(x=>key==='totalRevenue'&&x.key==='revenue')||state.fields.find(x=>key==='wasteRatio'&&x.key==='wasteRate');return {disabled:false,label:f?.label||label,unit:f?.unit||unit}}
const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const money=x=>'¥'+Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:0});const num=x=>Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:1});const today=()=>new Date().toISOString().slice(0,10);const monthStart=()=>today().slice(0,7)+'-01';
function busy(button,label){if(!button)return ()=>{};const old=button.innerHTML;button.disabled=true;button.dataset.busyOld=old;button.textContent=label;button.style.opacity='.7';return ()=>{button.disabled=false;button.innerHTML=button.dataset.busyOld||old;button.style.opacity='1'}}function toast(text){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=text;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2200)}function closeModal(){$('#modal')?.classList.remove('show')}function modal(html){$('#modalbox').innerHTML=html;$('#modal').classList.add('show')}
async function load(){try{state.user=(await api('/me')).user;const calendarScope=state.user.role!=='store'&&state.calendarStore!=='all'?`&storeId=${encodeURIComponent(state.calendarStore)}`:'';const adminCalls=state.user.role==='admin'?[api('/users'),api('/audit'),api('/reports'),api('/admin/accounts'),api('/ai/settings')]:[Promise.resolve([]),Promise.resolve([]),Promise.resolve([]),Promise.resolve([]),Promise.resolve(null)];const [fields,stores,reports,tasks,issues,goals,reviews,annotations,users,audit,adminReports,accounts,aiSettings]=await Promise.all([api('/report-fields'),state.user.role==='store'?Promise.resolve([]):api('/stores'),api('/reports?month='+state.month+calendarScope),api('/tasks?month='+state.month+calendarScope),api('/issues'),api('/goals?month='+state.month+calendarScope),api('/reviews'),api('/annotations?month='+state.month+calendarScope),...adminCalls]);state.fields=fields;state.stores=stores;state.reports=reports;state.tasks=tasks;state.issues=issues;state.goals=goals;state.reviews=reviews;state.annotations=annotations;state.users=users;state.audit=audit;state.adminReports=adminReports;state.accounts=accounts;state.aiSettings=aiSettings;state.rankingMetrics=await api('/ranking-metrics');render();if(true){loadAnalytics().then(()=>state.user&&render()).catch(e=>toast('经营分析后台加载失败：'+e.message))}}catch(e){localStorage.removeItem('token');login();toast(e.message)}}
async function loadAnalytics(){const from=state.analyticsFrom||monthStart(),to=state.analyticsTo||today();state.analytics=await api(`/analytics?from=${from}&to=${to}&storeId=${encodeURIComponent(state.analyticsStore)}&metric=${state.metric}`);state.analyticsFrom=from;state.analyticsTo=to}
function login(){document.body.innerHTML=`<main class="login"><section class="loginbox"><div class="logoMark"><span class="logoIcon">${icon('store')}</span>ONEIRA</div><div class="eyebrow" style="margin-top:12px">OPERATIONS OS · V5.2</div><h1>让每一家门店<br><span style="color:var(--orange)">经营得更清楚。</span></h1><div class="tabs"><button class="on" id="ts">店长</button><button id="to">运营</button><button id="ta">管理员</button></div><div id="lf" class="form"></div><div id="loginNotice" class="loginNotice" role="status" aria-live="polite"></div></section></main>`;let mode='store';const draw=()=>{$('#lf').innerHTML=mode==='store'?`<select class="input" id="store"><option value="">正在加载门店…</option></select><input class="input" id="name" placeholder="本次提交姓名（可任意填写）"><input class="input" id="code" placeholder="门店口令"><button id="loginBtn" class="btn orange" onclick="doLogin('store')">进入工作台 ${icon('arrow')}</button>`:`<input class="input" id="name" placeholder="账号"><input class="input" id="password" type="password" placeholder="密码"><button id="loginBtn" class="btn orange" onclick="doLogin('${mode}')">登录 ${icon('arrow')}</button>`};api('/public/stores').then(stores=>{const select=$('#store');if(select)select.innerHTML='<option value="">请选择门店</option>'+stores.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}).catch(()=>{const select=$('#store');if(select)select.innerHTML='<option value="">门店列表加载失败，请刷新</option>'});[['ts','store'],['to','ops'],['ta','admin']].forEach(([id,m])=>{$('#'+id).onclick=()=>{mode=m;['ts','to','ta'].forEach(x=>$('#'+x).classList.remove('on'));$('#'+id).classList.add('on');draw()}});draw()}
window.doLogin=async role=>{const notice=$('#loginNotice'),button=$('#loginBtn');if(button?.disabled)return;if(notice){notice.className='loginNotice';notice.textContent='正在验证登录信息…'}if(button){button.disabled=true;button.style.opacity='.65'}try{const body=role==='store'?{storeName:$('#store').value,name:$('#name').value,code:$('#code').value}:{name:$('#name').value,password:$('#password').value,role};const d=await api('/auth/'+(role==='store'?'store-login':'staff-login'),{method:'POST',body:JSON.stringify(body)});if(notice){notice.className='loginNotice success';notice.textContent='登录成功，正在进入工作台…'}localStorage.token=d.token;await new Promise(r=>setTimeout(r,350));await load()}catch(e){if(notice){notice.className='loginNotice error';notice.textContent='登录失败：'+(e.message||'账号或密码错误')}if(button){button.disabled=false;button.style.opacity='1'}}};

window.openAIAnalysis=()=>{const job=state.aiAnalysis||{};modal(`<div class="sectionTitle"><div><h2>AI 经营分析</h2><span class="templateHint">关闭弹窗后仍会在后台运行，完成后可在分析页复制</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><textarea class="input" id="aiPrompt" rows="3" placeholder="例如：重点找出营业额下降、损耗偏高和需要跟进的门店">请分析经营趋势、异常指标、门店差异和下一步行动建议。</textarea>${job.status==='running'?'<div class="aiProgress">分析任务正在后台运行，可关闭此弹窗。</div>':job.status==='done'?'<div class="aiAnswer">'+esc(job.content).replaceAll('\n','<br>')+'</div><button class="btn light small" onclick="copyAIResult()">一键复制分析</button>':job.status==='error'?'<div class="aiError">'+esc(job.error)+'</div>':''}<button class="btn orange" onclick="runAIAnalysis(this)" ${job.status==='running'?'disabled':''}>${job.status==='running'?'后台分析中…':'开始分析'}</button></div>`)};

window.runAIAnalysis=button=>{if(state.aiAnalysis?.status==='running')return;const a=state.analytics||{};const prompt=$('#aiPrompt')?.value||'请分析经营趋势、异常指标、门店差异和下一步行动建议。';state.aiAnalysis={status:'running',content:'',error:'',from:a.from||'',to:a.to||'',startedAt:Date.now()};toast('AI 分析已开始，关闭弹窗也会继续运行');closeModal();analytics($('#content'));api('/ai/analyze',{method:'POST',body:JSON.stringify({from:a.from,to:a.to,storeId:state.analyticsStore,prompt})}).then(d=>{state.aiAnalysis={status:'done',content:d.content||'',error:'',from:a.from||'',to:a.to||'',startedAt:state.aiAnalysis.startedAt};toast('AI 分析已完成，可一键复制');if(state.tab==='analytics')analytics($('#content'))}).catch(e=>{state.aiAnalysis={status:'error',content:'',error:e.message||'AI 分析失败',from:a.from||'',to:a.to||'',startedAt:state.aiAnalysis.startedAt};toast(e.message||'AI 分析失败');if(state.tab==='analytics')analytics($('#content'))})};

function view(){const c=$('#content');if(state.tab==='home')home(c);else if(state.tab==='report'&&['store','admin'].includes(state.user.role))report(c);else if(state.tab==='analytics'&&['store','ops','admin'].includes(state.user.role))analytics(c);else if(state.tab==='review'&&state.user.role!=='admin')reviews(c);else if(state.tab==='calendar')calendar(c);else if(state.tab==='issues')issues(c);else if(state.tab==='admin'&&state.user.role==='admin')admin(c);else{state.tab='home';home(c)}}

function stat(label,value,sub,ico,theme=''){return `<div class="card stat"><span class="statIcon ${theme}">${icon(ico)}</span><div><label>${label}</label><b>${value}</b><small>${sub||''}</small></div></div>`}
function home(c){const rev=state.reports.reduce((s,r)=>s+Number(r.payload?.totalRevenue??r.payload?.revenue??0),0),done=state.tasks.filter(x=>x.status==='done').length,pending=state.issues.filter(x=>x.status==='pending').length;const ops=state.user.role!=='store';const a=state.analytics||{totals:{revenue:0,orders:0,wasteRate:0,members:0},byStore:[],byDay:[],from:'',to:''};const top=a.byStore[0];c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}</div><h1>${ops?'今天，先看变化。':'今天，先把日报填好。'}</h1><p>${ops?'看哪家门店需要支援，再把目标落到每天。':'日报、目标和反馈，在一个工作台里保持一致。'}</p></div><div class="headActions"><button class="btn orange" onclick="tab('${ops?'analytics':'report'}')">${icon(ops?'trend':'report')}${ops?'查看经营分析':'填写今日日报'}</button></div></section><section class="grid">${ops&&a?stat('分析期营业额',money(a.totals.revenue),`${a.from} 至 ${a.to}`,'money'):stat(state.month+' 营业额',money(rev),'来自已提交日报','money')}${ops&&a?stat('订单数',num(a.totals.orders),'全部门店合计','orders','blue'):stat('任务完成',`${done}/${state.tasks.length}`,'日报自动回填','trend','blue')}${ops&&a?stat('平均损耗率',num(a.totals.wasteRate)+'%','按门店平均','waste','red'):stat('待处理反馈',pending,'运营处理中心','issue','red')}${ops&&a?stat('会员新增',num(a.totals.members),'分析期合计','member','green'):stat('覆盖门店','1','当前门店数据','store','green')}</section>${ops?`<div class="split"><section class="card"><div class="sectionTitle"><h2>${icon('trend')} 门店营业额排行</h2><button class="btn light small" onclick="tab('analytics')">查看明细 ${icon('arrow')}</button></div>${ranking(a.byStore,'revenue')}</section><section class="card"><div class="sectionTitle"><h2>${icon('issue')} 待处理反馈</h2></div>${state.issues.filter(x=>x.status==='pending').slice(0,4).map(i=>`<div class="rankRow"><span class="rankNo">!</span><span class="rankName">${esc(i.store_name)}</span><span class="rankName">${esc(i.content)}</span><span class="pill red">待处理</span></div>`).join('')||'<div class="empty">当前没有待处理反馈</div>'}</section></div>`:`<section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('report')} 近期日报</h2><span class="muted">${state.month}</span></div><div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>提交时间</th><th>提交人</th><th>营业额</th><th>客单量</th><th>状态</th></tr></thead><tbody>${state.reports.slice(0,12).map(r=>`<tr><td>${r.report_date}</td><td>${esc(String(r.updated_at||r.created_at||'').slice(0,19))}</td><td>${esc(r.submitter_name||r.submitted_by_name||'未记录')}</td><td>${money(r.payload?.totalRevenue??r.payload?.revenue)}</td><td>${num(r.payload?.orders)} 单</td><td><span class="pill">已提交</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">本月还没有日报</td></tr>'}</tbody></table></div></section>`}`}
function metricValue(row,metric){if(row.metricValues&&row.metricValues[metric]!==undefined)return Number(row.metricValues[metric]||0);return metric==='orders'?Number(row.orders||0):metric==='wasteRate'?Number(row.wasteRate||0):metric==='members'?Number(row.members||0):metric==='avgOrderValue'?Number(row.avgOrderValue||0):Number(row.revenue||0)}function metricLabel(metric){return metric==='orders'?'订单量':metric==='wasteRate'?'损耗率':metric==='members'?'会员新增':metric==='avgOrderValue'?'平均客单价':'营业额'}function metricDisplay(v,metric){return metric==='revenue'||metric==='avgOrderValue'?money(v):metric==='wasteRate'?num(v)+'%':num(v)+(metric==='orders'?' 单':' 人')}
function ranking(rows,metric){if(!rows?.length)return '<div class="empty">当前筛选范围暂无数据</div>';const max=Math.max(...rows.map(x=>metricValue(x,metric)),1);return `<div class="ranking">${rows.slice(0,8).map((r,i)=>{const v=metricValue(r,metric);return `<div class="rankRow"><span class="rankNo">${i+1}</span><span class="rankName">${esc(r.storeName)}</span><span class="rankTrack"><i style="width:${Math.round(v/max*100)}%"></i></span><span class="rankValue">${metricDisplay(v,metric)}</span></div>`}).join('')}</div>`}
function bars(rows,metric){if(!rows?.length)return '<div class="empty">当前时段暂无日报数据</div>';const max=Math.max(...rows.map(x=>metricValue(x,metric)),1);const short=rows.length>14?rows.filter((_,i)=>i%Math.ceil(rows.length/14)===0):rows;return `<div class="bars">${short.map(r=>{const v=metricValue(r,metric);return `<div class="barItem"><em>${r.day.slice(5)}</em><div class="barTrack"><i class="barFill" style="height:${Math.max(3,Math.round(v/max*100))}%"></i></div><small>${metricDisplay(v,metric)}</small></div>`}).join('')}</div>`}
const reportColumnDefs=[['date','日期'],['time','提交时间'],['store','门店'],['submitter','提交人'],['revenue','营业额'],['received','实收'],['orders','订单量'],['trialRatio','试吃占比'],['wasteRatio','报损占比']];window.toggleReportColumn=(key,on)=>{state.reportColumns[key]=on;document.querySelectorAll('[data-report-col=\"'+key+'\"]')?.forEach(el=>el.classList.toggle('colHidden',!on))};function reportColumnPicker(){return '<div class="columnPicker"><span class="muted">显示字段</span>'+reportColumnDefs.map(([k,l])=>`<label><input type="checkbox" ${state.reportColumns[k]?'checked':''} onchange="toggleReportColumn(\'${k}\',this.checked)">${l}</label>`).join('')+'</div>'}
function analytics(c){const a=state.analytics||{totals:{},byStore:[],byDay:[],details:[]};const metrics=state.rankingMetrics||[];const baseMetrics=[['revenue','营业额'],['orders','订单量'],['wasteRate','损耗率'],['members','会员新增'],['avgOrderValue','平均客单价']];const metricOptions=baseMetrics.map(([k,l])=>`<option value="${k}" ${state.metric===k?'selected':''}>${l}趋势/排行</option>`).join('')+(metrics||[]).filter(m=>!baseMetrics.some(x=>x[0]===m.metric_key)).map(m=>`<option value="${esc(m.metric_key)}" ${state.metric===m.metric_key?'selected':''}>${esc(m.label)}排行</option>`).join('');c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">数据驾驶舱 · 权限范围内</div><h1>经营分析</h1><p>按门店和时段查看数据，提交时间与提交人直接可追溯。</p></div><div class="headActions"><button class="btn light" onclick="openAIAnalysis()">${icon('trend')} AI 分析</button><button class="btn light" onclick="exportCsv()">导出 CSV</button>${state.user.role==='admin'?`<button class="btn light" onclick="adminPanel('ranking')">编辑排行</button>`:''}</div></section>${state.aiAnalysis?.status==='running'?`<section class="card aiBackground"><div class="sectionTitle"><h2>${icon('trend')} AI 正在后台分析</h2><span class="muted">可继续使用其他功能，完成后自动显示</span></div></section>`:state.aiAnalysis?.status==='done'?`<section class="card aiBackground"><div class="sectionTitle"><h2>${icon('trend')} AI 分析结果</h2><div><button class="btn light small" onclick="copyAIResult()">一键复制</button><button class="btn light small" onclick="openAIAnalysis()">查看详情</button></div></div><div class="aiAnswer">${esc(state.aiAnalysis.content).replaceAll('\n','<br>')}</div></section>`:state.aiAnalysis?.status==='error'?`<section class="card aiBackground"><div class="aiError">AI 分析失败：${esc(state.aiAnalysis.error)}</div></section>`:''}<section class="filters"><input class="input" type="date" id="afrom2" value="${a.from}" onchange="applyAnalytics()"><input class="input" type="date" id="ato" value="${a.to}" onchange="applyAnalytics()"><select class="input" id="astore" onchange="applyAnalytics()"><option value="all" ${state.analyticsStore==='all'?'selected':''}>全部门店</option>${state.stores.map(s=>`<option value="${s.id}" ${String(state.analyticsStore)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select class="input" id="ametric" onchange="applyAnalytics()">${metricOptions}</select></section><section class="grid">${stat('营业额',money(a.totals.revenue),'筛选期合计','money')}${stat('订单量',num(a.totals.orders),'订单总量','orders','blue')}${stat('平均客单价',money(a.totals.avgOrderValue),'营业额 ÷ 订单量','chart','green')}${stat('会员新增',num(a.totals.members),'筛选期合计','member','orange')}</section><div class="split"><section class="card chart"><div class="sectionTitle"><h2>${icon('trend')} ${metricLabel(state.metric)}趋势</h2><span class="muted">按日汇总</span></div>${bars(a.byDay,state.metric)}</section><section class="card"><div class="sectionTitle"><h2>${icon('store')} 各店${metricLabel(state.metric)}排行</h2><span class="muted">Top 8</span></div>${ranking(a.byStore,state.metric)}</section></div><section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('chart')} 门店汇总明细</h2><span class="muted">${a.from} 至 ${a.to}</span></div><div class="tableWrap">${reportColumnPicker()}<table class="table"><thead><tr><th data-report-col="date">提交日期</th><th data-report-col="time">提交时间</th><th data-report-col="store">门店</th><th data-report-col="submitter">提交人</th><th data-report-col="revenue">营业额</th><th data-report-col="received">实收</th><th data-report-col="orders">订单量</th><th data-report-col="trialRatio">试吃占比</th><th data-report-col="wasteRatio">报损占比</th></tr></thead><tbody>${(a.details||[]).map(r=>{const p=r.payload||{};return `<tr><td data-report-col="date">${esc(r.report_date)}</td><td data-report-col="time">${esc(String(r.updated_at||r.created_at||'').slice(0,19))}</td><td data-report-col="store"><b>${esc(r.store_name)}</b></td><td data-report-col="submitter">${esc(r.submitted_by_name||'未记录')}</td><td data-report-col="revenue">${money(p.totalRevenue??p.revenue)}</td><td data-report-col="received">${money(p.received)}</td><td data-report-col="orders">${num(p.orders)}</td><td data-report-col="trialRatio">${num(p.trialRatio)}%</td><td data-report-col="wasteRatio">${num(p.wasteRatio)}%</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">当前筛选范围暂无数据</td></tr>'}</tbody></table></div></section>`}
window.applyAnalytics=async()=>{const from=$('#afrom2').value,to=$('#ato').value;if(!from||!to)return toast('请选择完整日期范围');state.analyticsFrom=from;state.analyticsTo=to;state.analyticsStore=$('#astore').value;state.metric=$('#ametric').value;try{await loadAnalytics();render()}catch(e){toast(e.message)}};
function round2(v){return Math.round(Number(v||0)*100)/100}
function nval(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(/[￥¥,%，\s]/g,''));return Number.isFinite(n)?n:null}
function calcReport(p={}){const total=nval(p.totalRevenue??p.revenue),discount=nval(p.discounts);if(total!==null){p.totalRevenue=round2(total);p.revenue=round2(total)}if(total!==null&&discount!==null){p.received=round2(total-discount)}const platformKeys=['onlineMeituanGroup','onlineMeituanDelivery','onlineDouyinGroup','onlineTaobaoFlash'];if(platformKeys.some(k=>nval(p[k])!==null))p.platformTotal=round2(platformKeys.reduce((sum,k)=>sum+(nval(p[k])||0),0));if(nval(p.trialAmount)!==null&&total>0)p.trialRatio=round2(nval(p.trialAmount)/(nval(p.trialAmount)+(nval(p.wasteAmount)||0)+total)*100);if(nval(p.wasteAmount)!==null&&total>0)p.wasteRatio=round2(nval(p.wasteAmount)/((nval(p.trialAmount)||0)+(nval(p.wasteAmount)||0)+total)*100);p.wasteRate=p.wasteRatio??p.wasteRate??0;return p}
function extractNumber(text,label){const r=new RegExp(label+'[^\\d-]*(-?[\\d,]+(?:\\.\\d+)?)','i').exec(text);return r?nval(r[1]):null}
function parseDailyTemplate(text){const raw=String(text||'').replace(/\r/g,'');const dateMatch=raw.match(/(\d{1,2})月(\d{1,2})日/);const date=dateMatch?`${new Date().getFullYear()}-${String(Number(dateMatch[1])).padStart(2,'0')}-${String(Number(dateMatch[2])).padStart(2,'0')}`:today();const p={totalRevenue:extractNumber(raw,'总营业额'),discounts:extractNumber(raw,'优惠\\s*[\\/]?\\s*折扣券合计'),received:extractNumber(raw,'实收金额(?:（实际到账）)?'),onlineMeituanGroup:extractNumber(raw,'美团团购'),onlineMeituanDelivery:extractNumber(raw,'美团外卖'),onlineDouyinGroup:extractNumber(raw,'抖音团购'),onlineTaobaoFlash:extractNumber(raw,'淘宝闪购'),memberCardConsumption:extractNumber(raw,'会员卡消费'),memberCardRecharge:extractNumber(raw,'会员卡充值'),cash:extractNumber(raw,'现金'),onsiteDigital:extractNumber(raw,'微信\\/支付宝\\/云闪付到店'),trialCount:extractNumber(raw,'试吃数量'),wasteCount:extractNumber(raw,'报损数量'),trialAmount:extractNumber(raw,'试吃金额'),wasteAmount:extractNumber(raw,'报损金额'),physicalCardBalance:extractNumber(raw,'会员实体卡余量'),orders:extractNumber(raw,'订单量'),members:extractNumber(raw,'会员新增')};const egg=/蛋挞抖音赠送[^\n]*?[:：]\s*([\d,]+)[^\n]*?金额[:：]\s*([\d,.]+)/i.exec(raw);if(egg){p.eggTartGiftCount=nval(egg[1]);p.eggTartGiftAmount=nval(egg[2])}return {date,payload:calcReport(p)}}
function reportTemplate(p={},date=today()){const d=new Date(date+'T00:00:00');const day=`${d.getMonth()+1}月${d.getDate()}日`;const v=k=>p[k]??'';return `【${state.user?.storeName||'门店'} ${day}营业日报】\n\n1.整体营收\n总营业额：${v('totalRevenue')}\n优惠/折扣券合计：${v('discounts')}\n实收金额（实际到账）：${v('received')}\n\n2.收入途径明细\n\n①线上渠道\n美团团购：${v('onlineMeituanGroup')}\n美团外卖：${v('onlineMeituanDelivery')}\n抖音团购：${v('onlineDouyinGroup')}\n淘宝闪购：${v('onlineTaobaoFlash')}\n合计平台收入：${v('platformTotal')}\n\n②储值&会员卡\n会员卡消费：${v('memberCardConsumption')}\n会员卡充值：${v('memberCardRecharge')}\n\n③线下收款\n现金：${v('cash')}\n微信/支付宝/云闪付到店：${v('onsiteDigital')}\n\n④试吃与报损\n试吃数量：${v('trialCount')}\n报损数量：${v('wasteCount')}\n试吃金额：${v('trialAmount')}\n试吃占比：${v('trialRatio')}%\n报损金额：${v('wasteAmount')}\n报损占比：${v('wasteRatio')}%\n\n会员实体卡余量：${v('physicalCardBalance')}\n蛋挞抖音赠送：${v('eggTartGiftCount')} 金额：${v('eggTartGiftAmount')}\n（附报损、试吃、结班单）`}
function copyText(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();return Promise.resolve()}

function fieldMetaInput(key,label,value,unit='',computed=false,type='number'){const m=fieldMeta(key,label,unit);return m.disabled?'':fieldInput('r_'+key,m.label,value,m.unit,computed,type,!!m.required)}
function fieldInput(id,label,value,unit='',computed=false,type='number',required=false){return `<label class="label"><span>${label}${unit?` <small class="muted">${unit}</small>`:''}${required?' <b class="requiredMark">必填</b>':''}</span><input class="input ${computed?'computed':''}" id="${id}" type="${type}" value="${esc(value??'')}" ${computed?'readonly':''} oninput="recalcReportForm()"></label>`}
function adminReportRows(){const q=($('#adminReportSearch')?.value||'').trim().toLowerCase();const store=$('#adminReportStore')?.value||'all';return (state.adminReports||[]).filter(r=>(store==='all'||String(r.store_id)===store)&&(!q||`${r.store_name} ${r.report_date} ${r.submitter_name||''}`.toLowerCase().includes(q))).map(r=>{const p=r.payload||{};return `<tr><td>${esc(r.report_date)}</td><td><b>${esc(r.store_name)}</b></td><td>${money(p.totalRevenue??p.revenue)}</td><td>${money(p.received)}</td><td>${esc(r.submitter_name||'未记录')}</td><td><div class="headActions"><button class="btn light small" onclick="editAdminReport(${r.id})">编辑</button><button class="btn danger small" onclick="deleteAdminReport(${r.id},this)">删除</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">暂无符合条件的已提交日报</td></tr>'}function adminReportHistory(){return `<section class="card reportSection" style="margin-top:12px"><div class="sectionTitle"><div><h2>${icon('report')} 已提交日报管理</h2><div class="templateHint">管理员可查看全部门店日报，并进行编辑、覆盖或删除。</div></div><button class="btn light small" onclick="load()">刷新列表</button></div><div class="filters"><input class="input wide" id="adminReportSearch" placeholder="搜索门店、日期或提交人" oninput="adminReportFilter()"><select class="input" id="adminReportStore" onchange="adminReportFilter()"><option value="all">全部门店</option>${state.stores.map(st=>`<option value="${st.id}">${esc(st.name)}</option>`).join('')}</select></div><div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>门店</th><th>营业额</th><th>实收</th><th>提交人</th><th>操作</th></tr></thead><tbody id="adminReportRows">${adminReportRows()}</tbody></table></div></section>`}window.adminReportFilter=()=>{const el=$('#adminReportRows');if(el)el.innerHTML=adminReportRows()};window.editAdminReport=id=>{const r=(state.adminReports||[]).find(x=>x.id===id);if(!r)return;state.reportStoreId=Number(r.store_id);state.reportDraftDate=r.report_date;state.reportDraft=null;state.tab='report';render()};window.deleteAdminReport=async(id,button)=>{if(!confirm('确定删除这条日报？删除后对应日期的完成数据也会清零。'))return;const restore=busy(button,'删除中…');try{await api('/reports/'+id,{method:'DELETE'});toast('日报已删除');await load()}catch(e){toast('日报删除失败：'+e.message)}finally{restore()}};
function report(c){const adminMode=state.user.role==='admin';if(adminMode&&!state.reportStoreId&&state.stores[0])state.reportStoreId=state.stores[0].id;const date=state.reportDraftDate||today();const selectedStore=adminMode?Number(state.reportStoreId):null;const old=state.reports.find(r=>r.report_date===date&&(!adminMode||Number(r.store_id)===selectedStore));const p=calcReport({...old?.payload,...(state.reportDraft||{})});const baseLabels=['试吃数量','报损数量','试吃金额','试吃占比','报损金额','报损占比','试吃率','报损率'];const standardKeys=new Set(standardFields.map(x=>x[0]));const extras=state.fields.filter(f=>!standardKeys.has(f.key)&&!['revenue','orders','wasteRate','members'].includes(f.key)&&!baseLabels.includes(f.label));c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${date}</div><h1>营业日报</h1><p>${adminMode?'选择门店和日期后，可编辑或覆盖已有营业日报。':'支持整段粘贴导入；所有派生金额和占比会自动计算。'}</p></div><div class="headActions"><button class="btn light small" onclick="openImport()">${icon('report')} 粘贴导入</button><button class="btn light small" onclick="copyReportTemplate()">复制模板</button></div></section><section class="card reportSection"><div class="sectionTitle"><h2>日报日期</h2><div class="headActions">${adminMode?`<select class="input" id="reportStore" onchange="changeReportStore(this.value)">${state.stores.map(st=>`<option value="${st.id}" ${Number(st.id)===selectedStore?'selected':''}>${esc(st.name)}</option>`).join('')}</select>`:''}<input class="input" id="reportDate" type="date" value="${date}" onchange="changeReportDate(this.value)"></div></div><div class="heroNote">自动公式：实收金额 = 总营业额 − 优惠折扣；平台收入 = 四个线上渠道之和；试吃占比 = 试吃金额 ÷（试吃金额 + 报损金额 + 营业额）；报损占比同理。</div></section><section class="card reportSection"><div class="sectionTitle"><h2>整体营收</h2><span class="pill orange">必填总营业额</span></div><div class="reportGrid">${fieldMetaInput('totalRevenue','总营业额',p.totalRevenue,'元')}${fieldMetaInput('discounts','优惠/折扣券合计',p.discounts,'元')}${fieldMetaInput('received','实收金额（实际到账）',p.received,'元',true)}</div></section><section class="card reportSection"><div class="sectionTitle"><h2>收入途径明细</h2><span class="muted">金额单位：元</span></div><div class="reportGrid">${fieldMetaInput('onlineMeituanGroup','美团团购',p.onlineMeituanGroup)}${fieldMetaInput('onlineMeituanDelivery','美团外卖',p.onlineMeituanDelivery)}${fieldMetaInput('onlineDouyinGroup','抖音团购',p.onlineDouyinGroup)}${fieldMetaInput('onlineTaobaoFlash','淘宝闪购',p.onlineTaobaoFlash)}${fieldMetaInput('platformTotal','合计平台收入',p.platformTotal,'元',true)}${fieldMetaInput('memberCardConsumption','会员卡消费',p.memberCardConsumption)}${fieldMetaInput('memberCardRecharge','会员卡充值',p.memberCardRecharge)}${fieldMetaInput('cash','现金',p.cash)}${fieldMetaInput('onsiteDigital','微信/支付宝/云闪付到店',p.onsiteDigital)}</div></section><section class="card reportSection"><div class="sectionTitle"><h2>试吃与报损</h2><span class="muted">数量、金额和占比</span></div><div class="reportGrid">${fieldMetaInput('trialCount','试吃数量',p.trialCount,'个')}${fieldMetaInput('wasteCount','报损数量',p.wasteCount,'个')}${fieldMetaInput('trialAmount','试吃金额',p.trialAmount,'元')}${fieldMetaInput('trialRatio','试吃占比',p.trialRatio,'%',true)}${fieldMetaInput('wasteAmount','报损金额',p.wasteAmount,'元')}${fieldMetaInput('wasteRatio','报损占比',p.wasteRatio,'%',true)}</div></section><section class="card reportSection"><div class="sectionTitle"><h2>会员与补充指标</h2><span class="muted">可选</span></div><div class="reportGrid">${fieldMetaInput('physicalCardBalance','会员实体卡余量',p.physicalCardBalance,'张')}${fieldMetaInput('eggTartGiftCount','蛋挞抖音赠送',p.eggTartGiftCount,'个')}${fieldMetaInput('eggTartGiftAmount','蛋挞赠送金额',p.eggTartGiftAmount,'元')}${fieldMetaInput('orders','订单量',p.orders,'单')}${fieldMetaInput('members','会员新增',p.members,'人')}</div>${extras.length?`<div class="reportGrid" style="margin-top:10px">${extras.map(f=>fieldInput('r_'+f.key,f.label,p[f.key],f.unit,false,f.field_type==='number'?'number':'text')).join('')}</div>`:''}</section><section class="card reportSection"><label class="label"><span>备注 / 附件说明</span><textarea class="input" id="r_note" rows="3" placeholder="例如：已附报损、试吃、结班单">${esc(p.note||'')}</textarea></label><div class="headActions" style="margin-top:14px"><button class="btn orange" onclick="submitReport(this)">${old?'覆盖并提交日报':'提交营业日报'}</button><button class="btn light" onclick="copyReportTemplate()">复制导出模板</button></div></section>${adminMode?adminReportHistory():''}`;collapseReportSections(c)}
function readReportForm(){const v=id=>nval($('#r_'+id)?.value);const p={totalRevenue:v('totalRevenue'),discounts:v('discounts'),received:v('received'),onlineMeituanGroup:v('onlineMeituanGroup'),onlineMeituanDelivery:v('onlineMeituanDelivery'),onlineDouyinGroup:v('onlineDouyinGroup'),onlineTaobaoFlash:v('onlineTaobaoFlash'),memberCardConsumption:v('memberCardConsumption'),memberCardRecharge:v('memberCardRecharge'),cash:v('cash'),onsiteDigital:v('onsiteDigital'),trialCount:v('trialCount'),wasteCount:v('wasteCount'),trialAmount:v('trialAmount'),trialRatio:v('trialRatio'),wasteAmount:v('wasteAmount'),wasteRatio:v('wasteRatio'),physicalCardBalance:v('physicalCardBalance'),eggTartGiftCount:v('eggTartGiftCount'),eggTartGiftAmount:v('eggTartGiftAmount'),orders:v('orders'),members:v('members'),note:$('#r_note')?.value||''};for(const f of state.fields.filter(f=>!['revenue','orders','wasteRate','members'].includes(f.key))){const el=$('#r_'+f.key);if(el)p[f.key]=f.field_type==='number'?nval(el.value):el.value}return calcReport(p)}
function collectReportForm(show=true){const p=readReportForm();const missing=state.fields.filter(f=>f.required&&!['revenue','wasteRate'].includes(f.key)).filter(f=>p[f.key]===null||p[f.key]===undefined||String(p[f.key]).trim()==='');if(show&&missing.length){toast('请填写必填项：'+missing.map(f=>f.label).join('、'));return null}if(show&&p.totalRevenue===null){toast('请填写总营业额');return null}return p}
window.recalcReportForm=()=>{const p=readReportForm();const set=(id,v)=>{const e=$('#r_'+id);if(e)e.value=v??''};set('received',p.received);set('platformTotal',p.platformTotal);set('trialRatio',p.trialRatio);set('wasteRatio',p.wasteRatio)};
window.changeReportDate=date=>{state.reportDraftDate=date;state.reportDraft=null;render()};window.changeReportStore=storeId=>{state.reportStoreId=Number(storeId);state.reportDraft=null;render()};
window.submitReport=async button=>{const date=$('#reportDate')?.value||today();const adminMode=state.user.role==='admin';const storeId=adminMode?Number($('#reportStore')?.value||state.reportStoreId):null;const old=state.reports.find(r=>r.report_date===date&&(!adminMode||Number(r.store_id)===storeId));if(old&&!confirm('该日期已有日报，是否覆盖？'))return;const payload=collectReportForm(true);if(!payload)return;const restore=busy(button,'正在提交…');try{const body={date,payload};if(adminMode)body.storeId=storeId;await api('/reports',{method:'POST',body:JSON.stringify(body)});toast('营业日报已提交，日历和运营看板已同步');state.reportDraft=null;state.reportDraftDate='';state.tab=adminMode?'report':'home';await load()}catch(e){toast('日报提交失败：'+e.message)}finally{restore()}};
function dayStats(date){const rows=state.reports.filter(r=>r.report_date===date);const total=rows.reduce((s,r)=>s+Number(r.payload?.totalRevenue??r.payload?.revenue??0),0);const received=rows.reduce((s,r)=>s+Number(r.payload?.received||0),0);const tasks=state.tasks.filter(t=>t.task_date===date);const annotations=state.annotations.filter(a=>String(a.annotation_date).slice(0,10)===date);return {submitted:rows.length,total,received,target:tasks.reduce((s,t)=>s+Number(t.target_value||0),0),actual:tasks.reduce((s,t)=>s+Number(t.actual_value||0),0),annotations}}
function money2(x){return '¥'+Number(x||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function annotationTypeLabel(type){return ({note:'标注',comment:'评论',reminder:'提醒',special:'特殊情况'})[type]||'标注'}
function annotationForm(date){const ops=state.user.role!=='store';return `<section class="annotationForm"><div class="sectionTitle"><h3>${icon('issue')} 添加当天信息</h3><span class="muted">店长和运营可协同记录</span></div><div class="reportGrid two">${ops?`<select class="input" id="annStore">${state.stores.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`:''}<select class="input" id="annType"><option value="note">标注</option><option value="comment">评论</option><option value="reminder">提醒</option><option value="special">特殊情况</option></select><input class="input" id="annTitle" placeholder="标题（例如：设备检修）"><input class="input" id="annReminder" type="datetime-local"></div><textarea class="input" id="annContent" rows="3" placeholder="记录当天的特殊情况、评论、提醒或跟进事项"></textarea><button class="btn orange small" onclick="saveAnnotation('${date}',this)">保存到 ${date}</button></section>`}
window.dayDetail=date=>{const rows=state.reports.filter(r=>r.report_date===date),x=dayStats(date);const sum=k=>rows.reduce((a,r)=>a+Number(r.payload?.[k]||0),0);const item=(label,value,unit='')=>`<div class="detailItem"><small>${label}</small><b>${value===null||value===undefined||value===''?'-':value}${unit}</b></div>`;modal(`<div class="sectionTitle"><div><div class="eyebrow">${date}</div><h2>当日经营详情</h2></div><button class="btn light small" onclick="closeModal()">关闭</button></div>${rows.length?`<div class="detailGrid">${item('总营业额',money2(x.total))}${item('实收金额',money2(x.received))}${item('平台收入',money2(sum('platformTotal')))}${item('试吃金额',money2(sum('trialAmount')))}${item('报损金额',money2(sum('wasteAmount')))}${item('标注 / 评论',x.annotations.length,' 条')}</div>`:`<div class="empty">当天还没有提交日报${x.target?`<br><span class="muted">目标 ${money2(x.target)}</span>`:''}</div>`}<section class="annotationList"><div class="sectionTitle"><h3>${icon('calendar')} 当天标注</h3><span class="pill ${x.annotations.length?'orange':''}">${x.annotations.length||'暂无'} 条</span></div>${x.annotations.map(a=>`<article class="annotationItem"><div><span class="pill ${a.annotation_type==='reminder'?'orange':a.annotation_type==='special'?'red':''}">${annotationTypeLabel(a.annotation_type)}</span><b>${esc(a.title||'未命名')}</b><small>${esc(a.author_name||'')} · ${String(a.created_at||'').slice(0,16)}</small></div><p>${esc(a.content)}</p>${a.reminder_at?`<small class="muted">提醒：${String(a.reminder_at).slice(0,16)}</small>`:''}<button class="btn light small" onclick="deleteAnnotation(${a.id},'${date}')">删除</button></article>`).join('')||'<div class="empty">还没有标注、评论或特殊情况</div>'}</section>${annotationForm(date)}</div>`)}
function calendar(c){const [y,m]=state.month.split('-').map(Number),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),goal=state.goals.reduce((s,g)=>s+Number(g.goal_value||0),0),actual=state.tasks.reduce((s,t)=>s+Number(t.actual_value||0),0),target=goal||state.tasks.reduce((s,t)=>s+Number(t.target_value||0),0),pct=target?Math.round(actual/target*100):0;const isOps=state.user.role!=='store';c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${state.month}</div><h1>目标日历</h1><p>点击任意日期，查看营业数据并添加标注、评论、提醒或特殊情况。</p></div>${isOps?'<button class="btn orange" onclick="goalModal()">下发 / 编辑月目标</button>':''}</section>${isOps?`<section class="filters"><select class="input" onchange="applyCalendarStore(this.value)"><option value="all" ${state.calendarStore==='all'?'selected':''}>全部门店合计</option>${state.stores.map(s=>`<option value="${s.id}" ${String(state.calendarStore)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select><span class="templateHint">当前筛选将联动日报、目标和日期标注</span></section>`:''}<section class="grid3">${stat('月目标',money(target),'当前范围','money')}${stat('已完成',money(actual),'日报营业额回填','trend','green')}${stat('完成率',pct+'%','目标完成进度','chart','blue')}</section><section class="card" style="margin-top:12px"><div class="sectionTitle"><button class="btn light small" onclick="changeMonth(-1)">‹</button><b style="font-size:20px">${y}年${m}月</b><button class="btn light small" onclick="changeMonth(1)">›</button></div><div class="calendar calendarEnhanced">${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{const d=`${state.month}-${String(i+1).padStart(2,'0')}`,x=dayStats(d),p=x.target?Math.min(100,Math.round(x.actual/x.target*100)):0;return `<div class="day ${d===today()?'today':''} ${x.annotations.length?'hasAnnotations '+(x.annotations.some(a=>a.annotation_type==='special')?'annotation-special':x.annotations.some(a=>a.annotation_type==='reminder')?'annotation-reminder':x.annotations.some(a=>a.annotation_type==='comment')?'annotation-comment':'annotation-note'):''}" onclick="dayDetail('${d}')"><div class="num">${i+1}</div><div class="goal ${x.submitted?'':'muted'}">${x.submitted?'营业额 '+money(x.total):'未提交'}</div>${x.submitted?`<div class="goal">实收 ${money(x.received)}</div>`:''}<div class="goal">${x.target?`目标 ${money(x.target)}`:''}</div>${x.target?`<div class="barLine"><i style="width:${p}%"></i></div>`:''}${x.annotations.length?`<div class="annotationDots"><i></i><span>${x.annotations.length}</span></div>`:''}</div>`}).join('')}</div></section>`}
window.applyCalendarStore=async store=>{state.calendarStore=store;await load()};
window.changeMonth=async d=>{let [y,m]=state.month.split('-').map(Number);m+=d;if(m===0){y--;m=12}if(m===13){y++;m=1}state.month=`${y}-${String(m).padStart(2,'0')}`;await load()};
function reviewKey(type){const d=new Date();if(type==='month')return today().slice(0,7);const first=new Date(d.getFullYear(),0,1);const week=Math.ceil((((d-first)/86400000)+first.getDay()+1)/7);return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`}
function collapseCard(card,title,hint){if(!card||card.dataset.collapsedReady)return;card.dataset.collapsedReady='1';const originalTitle=card.querySelector(':scope > .sectionTitle');const body=document.createElement('div');body.className='collapseBody';const summary=document.createElement('button');summary.type='button';summary.className='collapseSummary';summary.innerHTML=`<span><h2>${title}</h2><small class="collapseHint">${hint}</small></span><span class="collapseChevron">⌄</span>`;[...card.children].forEach(child=>{if(child!==originalTitle)body.appendChild(child)});if(originalTitle)originalTitle.remove();card.prepend(summary);card.appendChild(body);card.classList.add('is-collapsed');summary.addEventListener('click',()=>card.classList.toggle('is-collapsed'))}
function collapseReportSections(root){root.querySelectorAll('.reportSection').forEach((card,i)=>{const heading=card.querySelector(':scope > .sectionTitle h2');const title=heading?.textContent?.trim()||(['提交与附件说明','日报字段','补充指标'][i]||'日报填写');const hint=i===0?'点击展开填写本日经营数据':'点击展开填写或查看字段';collapseCard(card,title,hint)})}
function collapseReviewEditor(root){const card=root.querySelector('.reviewEditor');if(card)collapseCard(card,'填写本期复盘与总结','点击展开编辑，保存后可在历史沉淀中查看')}
function reviews(c){const ops=state.user.role!=='store',type=window.reviewType||'week',key=window.reviewPeriodKey||reviewKey(type),selected=state.reviews.find(r=>r.period_type===type&&r.period_key===key&&(!ops||!state.reviewStoreId||Number(r.store_id)===Number(state.reviewStoreId)))||{};c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${type==='week'?'周复盘':'月总结'} · ${key}</div><h1>复盘与总结</h1><p>把经营结果、现场问题和下一步动作沉淀下来，店长与运营共享同一条业务链路。</p></div><div class="headActions"><button class="btn light small" onclick="switchReviewType('week')">周复盘</button><button class="btn light small" onclick="switchReviewType('month')">月总结</button></div></section><section class="card reviewEditor"><div class="sectionTitle"><div><h2>${icon('report')} ${type==='week'?'本周复盘':'本月总结'}</h2><span class="muted">${ops?'运营可选择门店填写或复盘。':'店长填写后，运营可查看。'}</span></div>${ops?`<select class="input" id="reviewStore" onchange="reviewStoreChange(this.value)">${state.stores.filter(x=>x.status==='active').map(x=>`<option value="${x.id}" ${Number(state.reviewStoreId||state.stores[0]?.id)===Number(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div><div class="reportGrid two"><select class="input" id="reviewType" onchange="switchReviewType(this.value)"><option value="week" ${type==='week'?'selected':''}>周复盘</option><option value="month" ${type==='month'?'selected':''}>月总结</option></select><input class="input" id="reviewKey" value="${esc(key)}" placeholder="周期，例如 2026-W41 或 2026-10"></div><input class="input" id="reviewTitle" value="${esc(selected.title||'')}" placeholder="标题，例如：第41周经营复盘"><textarea class="input" id="reviewContent" rows="5" placeholder="整体经营结果、关键判断和本周期结论">${esc(selected.content||'')}</textarea><div class="reportGrid"><textarea class="input" id="reviewHighlights" rows="4" placeholder="做得好的地方 / 亮点">${esc(selected.highlights||'')}</textarea><textarea class="input" id="reviewBlockers" rows="4" placeholder="问题、阻塞和需要协同的事项">${esc(selected.blockers||'')}</textarea><textarea class="input" id="reviewNextActions" rows="4" placeholder="下一周期行动项、负责人和截止时间">${esc(selected.next_actions||'')}</textarea></div><div class="headActions"><button class="btn orange" onclick="saveReview(this)">保存${type==='week'?'周复盘':'月总结'}</button>${selected.id?`<button class="btn light" onclick="deleteReview(${selected.id})">删除这条</button>`:''}</div></section><section class="card reviewHistory"><div class="sectionTitle"><h2>${icon('trend')} 历史沉淀</h2><span class="muted">${state.reviews.length} 条</span></div>${state.reviews.map(r=>`<article class="reviewRow"><div><span class="pill ${r.period_type==='month'?'orange':''}">${r.period_type==='week'?'周复盘':'月总结'}</span><b>${esc(r.period_key)} · ${esc(r.store_name||'本店')}</b><small>${esc(r.author_user_name||r.author_role||'')} · ${String(r.updated_at||'').slice(0,16)}</small></div><p>${esc(r.title||r.content).slice(0,120)}</p><button class="btn light small" onclick="loadReview(${r.id})">查看</button></article>`).join('')||'<div class="empty">还没有复盘记录</div>'}</section>`};collapseReviewEditor(c)
window.switchReviewType=type=>{window.reviewType=type;window.reviewPeriodKey=reviewKey(type);render()};window.reviewStoreChange=id=>{state.reviewStoreId=Number(id);render()};window.loadReview=id=>{const r=state.reviews.find(x=>x.id===id);if(!r)return;window.reviewType=r.period_type;window.reviewPeriodKey=r.period_key;state.reviewStoreId=Number(r.store_id);render()};window.saveReview=async button=>{const content=$('#reviewContent').value.trim();if(!content)return toast('请填写复盘内容');const restore=busy(button,'保存中…');try{await api('/reviews',{method:'POST',body:JSON.stringify({storeId:state.user.role==='store'?undefined:Number($('#reviewStore')?.value||state.reviewStoreId||state.stores[0]?.id),periodType:$('#reviewType').value,periodKey:$('#reviewKey').value.trim(),title:$('#reviewTitle').value,content,highlights:$('#reviewHighlights').value,blockers:$('#reviewBlockers').value,nextActions:$('#reviewNextActions').value})});toast('复盘已保存，运营与店长端已同步');await load()}catch(e){toast('复盘保存失败：'+e.message)}finally{restore()}};window.deleteReview=async id=>{if(!confirm('确定删除这条复盘？'))return;try{await api('/reviews/'+id,{method:'DELETE'});toast('复盘已删除');await load()}catch(e){toast(e.message)}};
window.saveAnnotation=async(date,button)=>{const content=$('#annContent').value.trim();if(!content)return toast('请填写标注内容');const restore=busy(button,'保存中…');try{await api('/annotations',{method:'POST',body:JSON.stringify({storeId:state.user.role==='store'?undefined:Number($('#annStore')?.value||state.calendarStore),date,type:$('#annType').value,title:$('#annTitle').value,content,reminderAt:$('#annReminder').value||null})});closeModal();toast('日期标注已保存');await load()}catch(e){toast('标注保存失败：'+e.message)}finally{restore()}};window.deleteAnnotation=async(id,date)=>{if(!confirm('删除这条日期标注？'))return;try{await api('/annotations/'+id,{method:'DELETE'});toast('标注已删除');await load();dayDetail(date)}catch(e){toast(e.message)}};
function issues(c){const store=state.user.role==='store',ops=!store;const rows=state.issues.map(i=>`<tr><td>${esc(i.store_name||'本店')}</td><td>${esc(i.type)}</td><td class="issueText">${esc(i.content)}</td><td><span class="pill ${i.status==='pending'?'red':i.status==='processing'?'orange':''}">${({pending:'待处理',processing:'处理中',resolved:'已解决',closed:'已关闭'})[i.status]||i.status}</span></td><td>${esc(i.handling_note||'-')}</td><td><div class="headActions"><button class="btn light small" onclick="issueModal(${i.id})">编辑</button><button class="btn danger small" onclick="deleteIssue(${i.id},this)">删除</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无反馈</td></tr>';c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${store?'门店协同':'运营协同'}</div><h1>反馈中心</h1><p>所有角色都可以创建、查看、编辑和删除反馈；运营与管理员还可以更新处理状态。</p></div><button class="btn orange" onclick="issueModal()">${icon('issue')} 新建反馈</button></section><section class="grid3">${stat('反馈总数',state.issues.length,'当前可见范围','issue')}${stat('待处理',state.issues.filter(x=>x.status==='pending').length,'需要跟进','trend','red')}${stat('已解决',state.issues.filter(x=>['resolved','closed'].includes(x.status)).length,'已完成闭环','chart','green')}</section><section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('issue')} 反馈记录</h2><button class="btn light small" onclick="load()">刷新列表</button></div><div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>类型</th><th>内容</th><th>状态</th><th>处理结果</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
window.issueModal=id=>{const x=id?state.issues.find(i=>i.id===id):{};const ops=state.user.role!=='store';modal(`<div class="sectionTitle"><div><div class="eyebrow">${id?'编辑反馈':'新建反馈'}</div><h2>${id?'更新协同记录':'提交一条反馈'}</h2></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form">${ops?`<select class="input" id="issueStore">${state.stores.filter(s=>s.status==='active').map(s=>`<option value="${s.id}" ${String(s.id)===String(x.store_id||state.stores[0]?.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}<select class="input" id="issueType"><option ${x.type==='设备问题'?'selected':''}>设备问题</option><option ${x.type==='人员排班'?'selected':''}>人员排班</option><option ${x.type==='原料库存'?'selected':''}>原料库存</option><option ${x.type==='其他建议'?'selected':''}>其他建议</option></select><textarea class="input" id="issueContent" rows="5" placeholder="描述问题、影响和需要协同的动作">${esc(x.content||'')}</textarea>${ops?`<select class="input" id="issueStatus"><option value="pending" ${x.status==='pending'||!id?'selected':''}>待处理</option><option value="processing" ${x.status==='processing'?'selected':''}>处理中</option><option value="resolved" ${x.status==='resolved'?'selected':''}>已解决</option><option value="closed" ${x.status==='closed'?'selected':''}>已关闭</option><option value="">不变更状态</option><textarea class="input" id="issueNote" rows="3" placeholder="处理结果或跟进备注">${esc(x.handling_note||'')}</textarea>`:''}<button class="btn orange" onclick="saveIssue(${id||'null'},this)">保存反馈</button></div>`)}
window.saveIssue=async(id,button)=>{const content=$('#issueContent').value.trim();if(!content)return toast('请填写反馈内容');const restore=busy(button,'保存中…');try{const body={type:$('#issueType').value,content};if(state.user.role!=='store'){body.storeId=Number($('#issueStore').value);body.status=$('#issueStatus').value||undefined;body.note=$('#issueNote').value}await api(id?'/issues/'+id:'/issues',{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();toast(id?'反馈已更新':'反馈已提交');await load()}catch(e){toast('保存失败：'+e.message)}finally{restore()}};window.deleteIssue=async(id,button)=>{if(!confirm('确定删除这条反馈？'))return;const restore=busy(button,'删除中…');try{await api('/issues/'+id,{method:'DELETE'});toast('反馈已删除');await load()}catch(e){toast('删除失败：'+e.message)}finally{restore()}};
function admin(c){c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">ADMIN CONTROL CENTER</div><h1>系统管理</h1><p>把高频管理动作拆成清晰模块，点击进入弹窗处理，避免长页面来回滚动。</p></div><button class="btn light" onclick="load()">刷新数据</button></section><section class="adminCommandGrid"><button class="adminCommand card" onclick="adminPanel('template')"><span class="commandIcon">${icon('report')}</span><span><b>日报模板</b><small>字段、单位、必填规则与下发</small></span><i>${state.fields.length} 个字段</i></button><button class="adminCommand card" onclick="adminPanel('stores')"><span class="commandIcon">${icon('store')}</span><span><b>门店与店长</b><small>门店口令、店长和启用状态</small></span><i>${state.stores.length} 家门店</i></button><button class="adminCommand card" onclick="adminPanel('accounts')"><span class="commandIcon">${icon('settings')}</span><span><b>运营与管理员账号</b><small>编辑登录账号与口令</small></span><i>${state.accounts.length} 个账号</i></button><button class="adminCommand card" onclick="adminPanel('reports')"><span class="commandIcon">${icon('report')}</span><span><b>已提交日报</b><small>全量检索、编辑和删除</small></span><i>${state.adminReports.length} 条记录</i></button><button class="adminCommand card" onclick="adminPanel('ai')"><span class="commandIcon">${icon('trend')}</span><span><b>AI 分析配置</b><small>接口地址、模型和启用状态</small></span><i>${state.aiSettings?.enabled?'已启用':'未启用'}</i></button><button class="adminCommand card" onclick="adminPanel('audit')"><span class="commandIcon">${icon('chart')}</span><span><b>审计日志</b><small>查看关键管理操作</small></span><i>${state.audit.length} 条日志</i></button></section>`}
window.adminPanel=async type=>{if(type==='ranking'){const ms=state.rankingMetrics||[];modal(`<div class="sectionTitle"><div><h2>排行指标配置</h2><span class="templateHint">管理员可决定哪些日报指标进入排行榜</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="adminModalBody">${ms.map((m,i)=>`<div class="fieldRow"><input class="input" data-r-label="${i}" value="${esc(m.label)}"><input class="input" data-r-unit="${i}" value="${esc(m.unit||'')}" placeholder="单位"><select class="input" data-r-agg="${i}"><option value="sum" ${m.aggregation==='sum'?'selected':''}>合计</option><option value="avg" ${m.aggregation==='avg'?'selected':''}>平均</option></select><label><input type="checkbox" data-r-enabled="${i}" checked> 启用</label></div>`).join('')}</div><button class="btn blue" onclick="saveRanking(this)">保存排行配置</button>`);return}if(type==='ai'){const a=state.aiSettings||{};modal(`<div class="sectionTitle"><div><h2>AI 接口配置</h2><span class="templateHint">兼容 OpenAI Chat Completions 的接口</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><select class="input" id="aiProvider" onchange="applyAIProvider(this.value)"><option value="custom">自定义 OpenAI 兼容接口</option><option value="deepseek">DeepSeek</option><option value="doubao">豆包 / 火山方舟</option></select><input class="input" id="aiEndpoint" value="${esc(a.endpoint||'')}" placeholder="https://api.example.com/v1"><input class="input" id="aiModel" value="${esc(a.model||'')}" placeholder="模型名称，如 deepseek-chat 或方舟模型 ID"><input class="input" id="aiKey" type="password" placeholder="${a.has_key?'已配置，留空保持不变':'API Key'}"><div class="templateHint" id="aiProviderHint">DeepSeek：Endpoint 可填 https://api.deepseek.com；模型可填 deepseek-chat 或 deepseek-flash。</div><label><input type="checkbox" id="aiEnabled" ${a.enabled?'checked':''}> 启用 AI 分析</label><button class="btn orange" onclick="saveAISettings(this)">保存配置</button></div>`);return}if(type==='reports'){modal(`<div class="sectionTitle"><h2>已提交日报管理</h2><button class="btn light small" onclick="closeModal()">关闭</button></div>${adminReportHistory()}`);return}if(type==='audit'){modal(`<div class="sectionTitle"><h2>审计日志</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="tableWrap"><table class="table"><thead><tr><th>时间</th><th>用户</th><th>动作</th><th>对象</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${String(a.created_at||'').slice(0,16)}</td><td>${esc(a.user_name||'-')}</td><td>${esc(a.action)}</td><td>${esc(a.entity)} #${esc(a.entity_id)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无日志</td></tr>'}</tbody></table></div>`);return}if(type==='template'){const fields=templateFields();modal(`<div class="sectionTitle"><div><h2>日报模板</h2><span class="templateHint">保存后同步至店长端</span></div><div class="headActions"><button class="btn orange small" onclick="addField()">新增字段</button><button class="btn light small" onclick="closeModal()">关闭</button></div></div><div class="adminModalBody">${fields.map((f,i)=>`<div class="fieldRow"><input class="input" data-label="${i}" value="${esc(f.label)}"><input class="input" data-unit="${i}" value="${esc(f.unit)}" placeholder="单位"><select class="input" data-type="${i}"><option value="number" ${f.field_type==='number'?'selected':''}>数字</option><option value="text" ${f.field_type==='text'?'selected':''}>文字</option></select><label><input type="checkbox" data-req="${i}" ${f.required?'checked':''}> 必填</label><button class="btn light small" onclick="removeField('${esc(f.key)}')">删除</button></div>`).join('')}</div><button class="btn blue" onclick="saveFields(this)">保存并下发</button>`);return}if(type==='stores'){modal(`<div class="sectionTitle"><div><h2>门店与店长</h2><span class="templateHint">门店登录口令也在这里维护</span></div><div class="headActions"><button class="btn orange small" onclick="addStore()">新增门店</button><button class="btn light small" onclick="closeModal()">关闭</button></div></div>${storeTable()}`);return}if(type==='accounts'){modal(`<div class="sectionTitle"><div><h2>运营与管理员账号</h2><span class="templateHint">口令修改后立即生效，至少 6 位</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="accountList">${state.accounts.map(a=>`<article class="accountRow"><div><b>${esc(a.name)}</b><span class="pill">${a.role==='ops'?'运营':'管理员'}</span><small>${String(a.created_at||'').slice(0,10)}</small></div><div class="accountEdit"><input class="input" id="accountName${a.id}" value="${esc(a.name)}"><input class="input" id="accountPassword${a.id}" type="password" placeholder="输入新口令（不改则留空）"><button class="btn orange small" onclick="saveAccount(${a.id},this)">保存</button></div></article>`).join('')||'<div class="empty">暂无可管理账号</div>'}</div>`)}}
function storeTable(){return `<div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>地址</th><th>店长</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.stores.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.address)}</td><td>${esc(s.manager_name)}</td><td>${esc(s.status)}</td><td><button class="btn light small" onclick="editStore(${s.id})">编辑</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无门店</td></tr>'}</tbody></table></div>`}
window.saveAccount=async(id,button)=>{const name=$('#accountName'+id).value.trim(),password=$('#accountPassword'+id).value;if(!name)return toast('账号名称不能为空');if(password&&password.length<6)return toast('口令至少需要6位');const restore=busy(button,'保存中…');try{await api('/admin/accounts/'+id,{method:'PATCH',body:JSON.stringify({name,password:password||undefined})});toast('账号与口令已更新');await load();adminPanel('accounts')}catch(e){toast('保存失败：'+e.message)}finally{restore()}};
window.saveRanking=async button=>{const restore=busy(button,'保存中…');try{const metrics=(state.rankingMetrics||[]).map((m,i)=>({...m,label:document.querySelector(`[data-r-label=\"${i}\"]`).value,unit:document.querySelector(`[data-r-unit=\"${i}\"]`).value,aggregation:document.querySelector(`[data-r-agg=\"${i}\"]`).value,enabled:document.querySelector(`[data-r-enabled=\"${i}\"]`).checked}));state.rankingMetrics=await api('/ranking-metrics',{method:'PUT',body:JSON.stringify({metrics})});toast('排行配置已保存');closeModal();render()}catch(e){toast('保存失败：'+e.message)}finally{restore()}};window.applyAIProvider=provider=>{const e=$('#aiEndpoint'),m=$('#aiModel'),h=$('#aiProviderHint');if(!e||!m)return;if(provider==='deepseek'){e.value='https://api.deepseek.com';if(!m.value||m.value==='gpt-4o-mini')m.value='deepseek-chat';if(h)h.textContent='DeepSeek 官方兼容接口：https://api.deepseek.com；请在 DeepSeek 控制台创建 API Key。'}else if(provider==='doubao'){e.value='https://ark.cn-beijing.volces.com/api/v3';if(!m.value||m.value==='gpt-4o-mini')m.value='请填写方舟模型 ID';if(h)h.textContent='豆包/火山方舟官方兼容接口：https://ark.cn-beijing.volces.com/api/v3；模型填写方舟控制台中的模型 ID。'}else if(h)h.textContent='填写任意兼容 OpenAI Chat Completions 的服务根地址。'};
window.saveAISettings=async button=>{const restore=busy(button,'保存中…');try{state.aiSettings=await api('/ai/settings',{method:'PUT',body:JSON.stringify({endpoint:$('#aiEndpoint').value.trim(),model:$('#aiModel').value.trim(),apiKey:$('#aiKey').value||undefined,enabled:$('#aiEnabled').checked})});toast('AI 配置已保存');closeModal();render()}catch(e){toast('保存失败：'+e.message)}finally{restore()}};
window.addField=()=>{state.fields.push({label:'新字段',key:'field_'+Date.now(),field_type:'number',unit:'',required:false});render()};window.removeField=key=>{if(!confirm('确定删除字段“'+key+'”？保存并下发后，店长端将不再显示该字段。'))return;state.fields=state.fields.filter(f=>f.key!==key);render()};window.saveFields=async button=>{const restore=busy(button,'正在保存并下发…');try{const fields=templateFields().map((f,i)=>({...f,label:document.querySelector(`[data-label="${i}"]`).value,unit:document.querySelector(`[data-unit="${i}"]`).value,field_type:document.querySelector(`[data-type="${i}"]`).value,required:document.querySelector(`[data-req="${i}"]`).checked}));await api('/report-fields',{method:'PUT',body:JSON.stringify({fields})});toast('日报模板已保存并下发到店长端');await load()}catch(e){toast('模板保存失败：'+e.message)}finally{restore()}};
window.addStore=()=>modal(`<div class="sectionTitle"><h2>新增门店</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="s_name" placeholder="门店名称"><input class="input" id="s_addr" placeholder="地址"><input class="input" id="s_manager" placeholder="负责人（可选）"><input class="input" id="s_code" placeholder="门店口令"><button class="btn orange" onclick="createStore(this)">创建</button></div>`);window.createStore=async button=>{const restore=busy(button,'正在创建…');try{await api('/stores',{method:'POST',body:JSON.stringify({name:$('#s_name').value,address:$('#s_addr').value,managerName:$('#s_manager').value,code:$('#s_code').value})});closeModal();toast('门店已创建');await load()}catch(e){toast('门店创建失败：'+e.message)}finally{restore()}};window.editStore=id=>{const s=state.stores.find(x=>x.id===id);modal(`<div class="sectionTitle"><h2>编辑 ${esc(s.name)}</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="e_name" value="${esc(s.name)}"><input class="input" id="e_addr" value="${esc(s.address)}"><input class="input" id="e_manager" value="${esc(s.manager_name)}"><input class="input" id="e_code" placeholder="输入新口令则修改"><button class="btn orange" onclick="updateStore(${id},this)">保存</button></div>`)};window.updateStore=async(id,button)=>{const restore=busy(button,'正在保存…');const body={name:$('#e_name').value,address:$('#e_addr').value,managerName:$('#e_manager').value};if($('#e_code').value)body.code=$('#e_code').value;try{await api('/stores/'+id,{method:'PATCH',body:JSON.stringify(body)});closeModal();toast('门店已更新');await load()}catch(e){toast('门店保存失败：'+e.message)}finally{restore()}};
function goalModal(){const stores=state.stores.filter(s=>s.status==='active');modal(`<div class="sectionTitle"><h2>下发月目标</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><select class="input" id="g_store">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input class="input" id="g_month" value="${state.month}"><input class="input" id="g_value" type="number" value="300000" placeholder="月目标营业额"><select class="input" id="g_rule"><option value="average">按天平均</option><option value="weekendWeight">周末权重</option></select><button class="btn orange" onclick="saveGoal()">保存并下发</button></div>`)}window.goalModal=goalModal;window.saveGoal=async()=>{try{await api('/goals',{method:'POST',body:JSON.stringify({storeId:Number($('#g_store').value),month:$('#g_month').value,goalValue:Number($('#g_value').value),rule:$('#g_rule').value})});closeModal();toast('月目标已下发');await load()}catch(e){toast(e.message)}};
function exportCsv(){location.href='/api/export/reports.csv?month='+state.month+'&token='+encodeURIComponent(localStorage.token)}
const socket=io();socket.on('data:changed',()=>{if(localStorage.token)load().catch(()=>{})});if(localStorage.token)load().catch(e=>{localStorage.removeItem('token');try{login();toast(e.message||'登录已失效，请重新登录')}catch(_){location.reload()}});else login();setTimeout(()=>{if(document.querySelector('.bootScreen')){localStorage.removeItem('token');login()}},8000);
</script></body></html>
