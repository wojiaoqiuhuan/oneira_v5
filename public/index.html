async function loadOrdering(){if(!state.user)return;const sid=state.user.role==='store'?state.user.storeId:(state.orderStoreId||state.stores[0]?.id);if(!sid)return;state.orderStoreId=Number(sid);state.orderDate=state.orderDate||today();state.ordering=await api(`/ordering/bootstrap?storeId=${encodeURIComponent(sid)}&date=${encodeURIComponent(state.orderDate)}`);}
function orderWeekDates(date){const base=new Date(`${date}T00:00:00`),day=base.getDay()||7;base.setDate(base.getDate()-day+1);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return d.toISOString().slice(0,10)})}
function orderWeekView(){const dates=orderWeekDates(state.orderDate),rows=state.orderHistory||[],amounts=dates.map(d=>rows.filter(x=>String(x.order_date).slice(0,10)===d).reduce((a,x)=>a+Number(x.total_amount||0),0)),total=amounts.reduce((a,x)=>a+x,0),max=Math.max(1,...amounts);return `<section class="card orderWeek"><div class="sectionTitle"><div><h3>本周报货金额</h3><span class="templateHint">按当前门店与日期查看，点击日期可切换报货单</span></div><div class="headActions"><button class="btn light small" onclick="changeOrderWeek(-1)">上一周</button><button class="btn light small" onclick="goCurrentOrderWeek()">本周</button><button class="btn light small" onclick="changeOrderWeek(1)">下一周</button><span class="pill">${dates[0].slice(5)}—${dates[6].slice(5)} · ${money2(total)}</span><button class="btn orange small" onclick="openWeekCopyModal()">选择日期复制</button></div></div><div class="orderWeekGrid">${dates.map((d,i)=>{const amount=amounts[i],dayRows=rows.filter(x=>String(x.order_date).slice(0,10)===d),status=dayRows.length?(dayRows.every(x=>x.status==='submitted')?'已提交':'草稿'):'未报货';return `<button class="orderWeekDay ${d===state.orderDate?'current':''}" onclick="changeOrderDate('${d}')"><small>${['一','二','三','四','五','六','日'][i]} · ${d.slice(5)}</small><b>${amount?money2(amount):'—'}</b><span>${status}</span><i style="width:${Math.max(4,Math.round(amount/max*100))}%"></i></button>`}).join('')}</div></section>`}
function orderHistorySection(){const month=state.orderHistoryMonth||state.orderDate.slice(0,7),rows=(state.orderHistoryArchive||[]).slice().sort((a,b)=>String(b.order_date).localeCompare(String(a.order_date)));return `<section class="card orderHistoryCard"><div class="sectionTitle"><div><h3>历史报货</h3><span class="templateHint">已提交和草稿均可查看、编辑或删除；当前门店筛选生效。</span></div><div class="orderHistoryTools"><input class="input" type="month" value="${month}" onchange="loadOrderHistoryArchive(this.value)"><button class="btn light small" onclick="loadOrderHistoryArchive('${month}',true)">刷新</button></div></div><div id="orderHistoryList" class="orderHistoryList">${rows.length?rows.map(r=>`<article class="orderHistoryRow"><button class="orderHistoryMain" onclick="viewOrderHistory('${String(r.order_date).slice(0,10)}',${r.store_id})"><span class="orderHistoryDate"><b>${String(r.order_date).slice(0,10)}</b><small>${esc(r.store_name||state.ordering?.store?.name||'当前门店')} · ${esc(r.submitted_by_name||'未记录')}</small></span><span class="orderHistoryAmount"><b>${money2(r.total_amount)}</b><small>${Number(r.total_quantity||0)} 个 · ${r.status==='submitted'?'已提交':'草稿'}</small></span><span class="pill ${r.status==='submitted'?'green':'orange'}">${r.status==='submitted'?'已提交':'草稿'}</span></button><div class="orderHistoryActions"><button class="btn light small" onclick="editOrderHistory('${String(r.order_date).slice(0,10)}',${r.store_id})">编辑</button><button class="btn danger small" onclick="deleteOrderHistory('${String(r.order_date).slice(0,10)}',${r.store_id},this)">删除</button></div></article>`).join(''):'<div class="empty">该月份暂无报货记录。可切换月份查看已提交历史。</div>'}</div></section>`}
async function loadOrderHistoryArchive(month=state.orderDate.slice(0,7),force=false){const sid=state.user?.role==='store'?state.user.storeId:state.orderStoreId;if(!sid)return;const key=`${sid}:${month}`;if(!force&&state.orderHistoryArchiveKey===key)return;state.orderHistoryArchiveKey=`loading:${key}`;state.orderHistoryMonth=month;try{state.orderHistoryArchive=await api(`/ordering/orders?storeId=${encodeURIComponent(sid)}&month=${encodeURIComponent(month)}`);state.orderHistoryArchiveKey=key;if(state.tab==='ordering')render()}catch(e){state.orderHistoryArchive=[];state.orderHistoryArchiveKey='';toast('历史报货加载失败：'+e.message)}}
window.viewOrderHistory=async(date,storeId)=>{try{const d=await api(`/ordering/orders/${date}?storeId=${encodeURIComponent(storeId||state.orderStoreId)}`);if(!d.order){toast('报货单不存在');return}const groups={};for(const item of d.items||[])(groups[item.category_name||'其他']??=[]).push(item);const body=Object.entries(groups).map(([cat,items])=>`<section class="orderHistoryDetailGroup"><div class="sectionTitle"><b>${esc(cat)}</b><span>${items.reduce((a,x)=>a+Number(x.quantity||0),0)} 个 · ${money2(items.reduce((a,x)=>a+Number(x.amount||0),0))}</span></div>${items.map(x=>`<div class="orderHistoryDetailItem"><span><b>${esc(x.product_name)}</b><small>${esc(x.sku)} · ${esc(x.unit)}</small></span><strong>${x.quantity} × ${money2(x.unit_price)} = ${money2(x.amount)}</strong></div>`).join('')}</section>`).join('');modal(`<div class="sectionTitle"><div><div class="eyebrow">${esc(String(d.order.order_date).slice(0,10))}</div><h2>报货详情</h2><span class="templateHint">${esc(d.order.store_name||state.ordering?.store?.name||'当前门店')} · ${esc(d.order.submitted_by_name||'未记录')} · ${d.order.status==='submitted'?'已提交':'草稿'}</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="detailGrid"><div class="detailItem"><small>报货总金额</small><b>${money2(d.order.total_amount)}</b></div><div class="detailItem"><small>合计数量</small><b>${d.order.total_quantity||0} 个</b></div><div class="detailItem"><small>实收目标</small><b>${money2(d.order.target_value)}</b></div></div><div class="orderHistoryDetail">${body||'<div class="empty">当天没有产品数量</div>'}</div><div class="headActions" style="margin-top:14px"><button class="btn light" onclick="editOrderHistory('${String(date).slice(0,10)}',${storeId||state.orderStoreId})">编辑这张报货单</button><button class="btn danger" onclick="deleteOrderHistory('${String(date).slice(0,10)}',${storeId||state.orderStoreId},this)">删除这张报货单</button></div>`)}catch(e){toast('详情加载失败：'+e.message)}};
window.editOrderHistory=async(date,storeId)=>{closeModal();state.orderStoreId=Number(storeId||state.orderStoreId);state.orderDate=String(date).slice(0,10);try{await loadOrdering();await loadOrderWeekHistory(state.orderDate,state.orderStoreId);render();setTimeout(()=>document.querySelector('.orderHero')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}catch(e){toast('编辑报货加载失败：'+e.message)}};
window.deleteOrderHistory=async(date,storeId,button)=>{if(!confirm(`确定删除 ${String(date).slice(0,10)} 的报货单吗？删除后不可恢复。`))return;const restore=busy(button,'删除中…');try{await api(`/ordering/orders/${String(date).slice(0,10)}`,{method:'DELETE',body:JSON.stringify({storeId:Number(storeId||state.orderStoreId)})});toast('报货历史已删除');state.orderHistoryArchiveKey='';await loadOrdering();await loadOrderWeekHistory(state.orderDate,state.orderStoreId);closeModal();render();await loadOrderHistoryArchive(state.orderDate.slice(0,7),true)}catch(e){toast('删除失败：'+e.message)}finally{restore()}};
function orderGroups(){const d=state.ordering||{};const items=new Map((d.items||[]).map(x=>[Number(x.product_id),Number(x.quantity||0)]));const cats=new Map((d.categories||[]).map(c=>[Number(c.id),c]));const groups={};for(const p of d.products||[]){const key=p.category_id||'other';(groups[key]??={category:cats.get(Number(p.category_id))||{id:'other',name:'其他',sort_order:999},products:[]}).products.push({...p,quantity:items.get(Number(p.id))||0});}return Object.values(groups).sort((a,b)=>(a.category.sort_order||999)-(b.category.sort_order||999));}
function orderTotals(){let qty=0,amount=0;for(const p of state.ordering.products||[]){const el=document.querySelector(`[data-order-product="${p.id}"]`);const q=Number(el?.value||0);qty+=q;amount+=q*Number(p.unit_price||0)}const target=Number($('#orderTarget')?.value||state.ordering.target?.target_value||0);return {qty,amount,target,ratio:target?amount/target*100:null};}
function updateOrderTotals(){const t=orderTotals();const diff=t.amount-t.target;const q=$('#orderTotalQty'),a=$('#orderTotalAmount'),r=$('#orderRatio'),d=$('#orderDiff'),s=$('#orderDiffSub');if(q)q.textContent=num(t.qty);if(a)a.textContent=money2(t.amount);if(r)r.textContent=t.ratio===null?'—':t.ratio.toFixed(1)+'%';if(d){d.textContent=(diff>=0?'+':'')+money2(diff);d.parentElement.classList.toggle('good',Math.abs(diff)<0.01);d.parentElement.classList.toggle('warn',Math.abs(diff)>=0.01)}if(s)s.textContent=diff>=0?'高于目标':'低于目标';document.querySelectorAll('[data-order-group]').forEach(group=>{let gq=0,ga=0;group.querySelectorAll('[data-order-product]').forEach(el=>{const p=state.ordering.products.find(x=>String(x.id)===el.dataset.orderProduct);const v=Number(el.value||0);gq+=v;ga+=v*Number(p?.unit_price||0);const amt=group.querySelector(`[data-order-amount="${el.dataset.orderProduct}"]`);if(amt)amt.textContent=money2(v*Number(p?.unit_price||0))});const qv=group.querySelector('[data-group-qty]'),av=group.querySelector('[data-group-amount]');if(qv)qv.textContent=num(gq);if(av)av.textContent=money2(ga)})}
window.orderQtyChanged=(id,value)=>{if(Number(value)<0){const el=document.querySelector(`[data-order-product="${id}"]`);if(el)el.value=0}updateOrderTotals()};window.toggleOrderGroup=key=>{state.orderOpen[key]=!state.orderOpen[key];document.querySelector(`[data-order-group="${key}"]`)?.classList.toggle('open',!!state.orderOpen[key])};window.changeOrderDate=async value=>{const previous=state.orderDate;state.orderDate=value;try{await loadOrdering();await loadOrderWeekHistory(state.orderDate,state.orderStoreId);render()}catch(e){state.orderDate=previous;toast('报货数据暂时加载失败，已自动重试，请稍后再试');console.error('order date load failed',e)}};window.changeOrderWeek=async offset=>{const d=new Date(`${state.orderDate}T00:00:00`);d.setDate(d.getDate()+Number(offset||0)*7);await window.changeOrderDate(d.toISOString().slice(0,10))};window.goCurrentOrderWeek=async()=>window.changeOrderDate(today());window.changeOrderStore=async value=>{state.orderStoreId=Number(value);state.orderHistoryArchiveKey='';state.orderHistoryMonth='';await loadOrdering();await loadOrderWeekHistory(state.orderDate,state.orderStoreId);render()};window.openCopyOrderModal=()=>{const month=state.orderDate.slice(0,7);modal(`<div class="sectionTitle"><div><h2>快捷复制历史报货</h2><span class="templateHint">可切换月份，比较销售营业额与报货金额后选择来源日期。</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="orderConfigToolbar"><label class="templateHint">查询月份</label><input class="input" id="copyOrderMonth" type="month" value="${month}" onchange="loadCopyOrderMonth(this.value)"></div><div id="copyOrderList" class="orderConfigList"><div class="empty">正在加载 ${month}…</div></div>`) ;loadCopyOrderMonth(month)};
window.loadCopyOrderMonth=async month=>{if(!month)return;const list=$('#copyOrderList');if(!list)return;list.innerHTML='<div class="empty">加载中…</div>';try{const [orders,reports]=await Promise.all([api(`/ordering/orders?storeId=${state.orderStoreId}&month=${encodeURIComponent(month)}`),api(`/reports?storeId=${state.orderStoreId}&month=${encodeURIComponent(month)}`)]);const dates=[...new Set([...orders.map(x=>String(x.order_date).slice(0,10)),...reports.map(x=>String(x.report_date).slice(0,10))])].sort().reverse();list.innerHTML=dates.map(d=>{const sale=reports.filter(x=>String(x.report_date).slice(0,10)===d).reduce((a,x)=>a+Number((x.payload?.totalRevenue??x.payload?.revenue)||0),0);const amount=orders.filter(x=>String(x.order_date).slice(0,10)===d).reduce((a,x)=>a+Number(x.total_amount||0),0);return `<button class="orderCompareRow" onclick="copyOrderFromDate('${d}')"><span><b>${d}</b><small>营业额 ${money2(sale)} · 报货 ${money2(amount)}</small></span><span class="pill">复制</span></button>`}).join('')||'<div class="empty">该月份暂无日报或报货记录，可用日期输入框切换其他月份。</div>'}catch(e){list.innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`}};

window.copyOrderFromDate=async source=>{if(!source||source===state.orderDate)return;try{const d=await api(`/ordering/orders/${source}?storeId=${state.orderStoreId}`);if(!d.order){toast('这一天没有可复制的报货单');return}closeModal();state.ordering.order=null;state.ordering.items=d.items||[];toast(`已复制 ${source} 的 ${d.items?.length||0} 项报货，请确认后保存`);render()}catch(e){toast('复制失败：'+e.message)}};
window.openWeekCopyModal=()=>{const dates=orderWeekDates(state.orderDate);modal(`<div class="sectionTitle"><div><h2>选择复制日期</h2><span class="templateHint">勾选要生成报货草稿的日期，未勾选的日期不会改变。</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="headActions" style="margin:12px 0"><button class="btn light small" onclick="document.querySelectorAll('[data-week-copy]').forEach(x=>x.checked=true)">全选本周</button><button class="btn light small" onclick="document.querySelectorAll('[data-week-copy]').forEach(x=>x.checked=false)">清空选择</button></div><div id="weekCopyOptions" class="weekCopyList"><div class="empty">正在读取各日营业额和报货金额…</div></div><button class="btn orange" style="width:100%;margin-top:14px" onclick="copyOrderToWeek(this)">复制到所选日期</button>`);loadWeekCopyOptions(dates)};
window.loadWeekCopyOptions=async dates=>{const el=$('#weekCopyOptions');if(!el)return;try{const months=[...new Set(dates.map(d=>d.slice(0,7)))];const [orders,reportParts]=await Promise.all([Promise.all(months.map(m=>api(`/ordering/orders?storeId=${state.orderStoreId}&month=${encodeURIComponent(m)}`))).then(x=>x.flat()),Promise.all(months.map(m=>api(`/reports?storeId=${state.orderStoreId}&month=${encodeURIComponent(m)}`))).then(x=>x.flat())]);const weekday=['周一','周二','周三','周四','周五','周六','周日'];el.innerHTML=dates.map((d,i)=>{const sales=reportParts.filter(r=>String(r.report_date).slice(0,10)===d).reduce((a,r)=>a+Number((r.payload?.totalRevenue??r.payload?.revenue)||0),0);const orderAmount=orders.filter(o=>String(o.order_date).slice(0,10)===d).reduce((a,o)=>a+Number(o.total_amount||0),0);const orderStatus=orders.find(o=>String(o.order_date).slice(0,10)===d)?.status;return `<label class="weekCopyItem weekCopyRich"><input type="checkbox" data-week-copy value="${d}"><span class="weekCopyDate"><b>${weekday[i]}</b><small>${d}${d===state.orderDate?' · 当前编辑日':''}</small></span><span class="weekCopyMetrics"><b>营业额 ${money2(sales)}</b><b>报货 ${money2(orderAmount)}</b><small>${orderStatus==='submitted'?'已提交':orderAmount>0?'草稿':'未报货'}</small></span></label>`}).join('')}catch(e){el.innerHTML=`<div class="empty">金额读取失败：${esc(e.message)}</div>`}};

window.copyOrderToWeek=async button=>{const dates=[...document.querySelectorAll('[data-week-copy]:checked')].map(x=>x.value);if(!dates.length){toast('请至少选择一个日期');return}const items=[...document.querySelectorAll('[data-order-product]')].map(el=>({productId:Number(el.dataset.orderProduct),quantity:Number(el.value||0)}));const restore=busy(button,'复制中…');try{for(const date of dates){const d=await api(`/ordering/bootstrap?storeId=${state.orderStoreId}&date=${date}`);await api(`/ordering/orders/${date}`,{method:'PUT',body:JSON.stringify({storeId:state.orderStoreId,targetValue:Number(d.target?.target_value||0),status:'draft',items})})}closeModal();toast(`已生成 ${dates.length} 天报货草稿，可逐日调整`);await loadOrderWeekHistory(state.orderDate,state.orderStoreId);render()}catch(e){toast('复制失败：'+e.message)}finally{restore()}};

window.saveOrder=async(status,button)=>{const restore=busy(button,status==='submitted'?'提交中…':'保存中…');try{const t=orderTotals();const items=[...document.querySelectorAll('[data-order-product]')].map(el=>({productId:Number(el.dataset.orderProduct),quantity:Number(el.value||0)}));await api(`/ordering/orders/${state.orderDate}`,{method:'PUT',body:JSON.stringify({storeId:state.orderStoreId,targetValue:t.target,status,items})});toast(status==='submitted'?'报货已提交给后厨':'报货草稿已保存');await loadOrdering();await loadOrderWeekHistory(state.orderDate,state.orderStoreId);render()}catch(e){toast('报货保存失败：'+e.message)}finally{restore()}};
window.printOrder=()=>{const dates=orderWeekDates(state.orderDate);modal(`<div class="sectionTitle"><div><h2>选择打印日期</h2><span class="templateHint">可打印后厨连续多天的报货单，未勾选日期不会出现在打印页。</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="orderConfigToolbar"><input class="input" id="printExtraDate" type="date"><button class="btn light small" onclick="addPrintDate()">加入日期</button><button class="btn light small" onclick="document.querySelectorAll('[data-print-date]').forEach(x=>x.checked=true)">全选本周</button></div><div class="weekCopyList">${dates.map(d=>`<label class="weekCopyItem"><input type="checkbox" data-print-date value="${d}"><span><b>${d}</b><small>${d===state.orderDate?'当前编辑日':''}</small></span></label>`).join('')}</div><button class="btn orange" style="width:100%;margin-top:14px" onclick="confirmPrintOrders(this)">打印所选日期</button>`)};
window.addPrintDate=()=>{const d=$('#printExtraDate')?.value;if(!d)return toast('请选择要加入的日期');if(document.querySelector(`[data-print-date][value="${d}"]`))return document.querySelector(`[data-print-date][value="${d}"]`).checked=true;const wrap=document.querySelector('.weekCopyList');if(wrap)wrap.insertAdjacentHTML('beforeend',`<label class="weekCopyItem"><input type="checkbox" data-print-date value="${d}" checked><span><b>${d}</b><small>自选日期</small></span></label>`)};
window.confirmPrintOrders=button=>{const dates=[...document.querySelectorAll('[data-print-date]:checked')].map(x=>x.value);if(!dates.length)return toast('请至少选择一个日期');const qs=`?storeId=${state.orderStoreId}&dates=${encodeURIComponent(dates.join(','))}&token=${encodeURIComponent(localStorage.token||'')}`;window.open(`/api/ordering/print${qs}`,'_blank','noopener');closeModal()};
window.exportOrderCsv=()=>{const token=encodeURIComponent(localStorage.token||'');location.href=`/api/export/ordering.csv?token=${token}&month=${encodeURIComponent(state.month)}&storeId=${encodeURIComponent(state.orderStoreId)}`};
window.cloneOrderCatalog=async button=>{const sourceId=Number($('#cloneOrderSource')?.value);if(!sourceId)return;const sourceName=$('#cloneOrderSource').selectedOptions[0]?.textContent||'';if(!confirm(`将 ${sourceName} 的产品名称、价格、分类和 SKU 复制到当前门店？当前同 SKU 配置会被更新。`))return;const restore=busy(button,'复制中…');try{const r=await api('/ordering/products/clone',{method:'POST',body:JSON.stringify({sourceStoreId:sourceId,targetStoreId:state.orderStoreId})});toast(`已复制 ${r.count} 个产品`);await loadOrdering();openOrderingConfig()}catch(e){toast('复制失败：'+e.message)}finally{restore()}};
window.openOrderingConfig=()=>{const d=state.ordering||{},cats=d.categories||[],products=d.products||[];const catOptions=(selected)=>cats.map(c=>`<option value="${c.id}" ${Number(c.id)===Number(selected)?'selected':''}>${esc(c.name)}</option>`).join('');modal(`<div class="sectionTitle"><div><h2>产品与分类</h2><span class="templateHint">${esc(d.store?.name||'当前门店')} · 分类和产品都是门店级配置</span></div><div class="headActions">${state.user.role!=='store'&&state.stores.length>1?`<select class="input" id="cloneOrderSource">${state.stores.filter(x=>x.status==='active'&&Number(x.id)!==Number(state.orderStoreId)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn orange small" onclick="cloneOrderCatalog(this)">复制门店配置</button>`:''}<button class="btn light small" onclick="closeModal()">关闭</button></div></div><div class="orderConfigGrid"><section><div class="sectionTitle"><h3>分类</h3><button class="btn orange small" onclick="addOrderCategory(this)">新增分类</button></div><div class="orderConfigList">${cats.map(c=>`<div class="orderConfigRow"><div><input class="input" id="oc_name${c.id}" value="${esc(c.name)}"><small>${esc(c.category_code)} · ${c.enabled?'启用':'已停用'}</small></div><div class="headActions"><button class="btn light small" onclick="saveOrderCategory(${c.id},this)">保存</button><button class="btn danger small" onclick="deleteOrderCategory(${c.id},this)">停用</button></div></div>`).join('')||'<div class="empty">暂无分类</div>'}</div></section><section><div class="sectionTitle"><h3>产品</h3><button class="btn orange small" onclick="addOrderProduct(this)">新增产品</button></div><div class="orderConfigList">${products.map(p=>`<div class="orderConfigRow"><div><div class="headActions"><input class="input" id="op_sku${p.id}" value="${esc(p.sku)}" placeholder="SKU"><input class="input" id="op_name${p.id}" value="${esc(p.name)}" placeholder="产品名称"></div><div class="headActions"><select class="input" id="op_cat${p.id}">${catOptions(p.category_id)}</select><input class="input" id="op_unit${p.id}" value="${esc(p.unit)}" placeholder="单位"><input class="input" id="op_price${p.id}" type="number" step="0.01" value="${p.unit_price}" placeholder="单价"></div></div><div class="headActions"><button class="btn light small" onclick="saveOrderProduct(${p.id},this)">保存</button><button class="btn danger small" onclick="deleteOrderProduct(${p.id},this)">停用</button></div></div>`).join('')||'<div class="empty">暂无产品</div>'}</div></section></div><section class="card" style="margin-top:12px"><div class="sectionTitle"><div><h3>批量导入</h3><span class="templateHint">粘贴 JSON 数组：[{"sku":"YL-001","name":"原味可颂","categoryCode":"DM","unit":"个","unitPrice":12}]</span></div></div><textarea class="input" id="orderImportJson" rows="3" placeholder="粘贴产品 JSON"></textarea><button class="btn blue small" onclick="importOrderProducts(this)">导入产品</button></section>`)};

async function load(){try{state.user=(await api('/me')).user;const calendarScope=state.user.role!=='store'&&state.calendarStore!=='all'?`&storeId=${encodeURIComponent(state.calendarStore)}`:'';const adminCalls=state.user.role==='admin'?[api('/users'),api('/audit'),api('/reports'),api('/admin/accounts'),api('/ai/settings')]:[Promise.resolve([]),Promise.resolve([]),Promise.resolve([]),Promise.resolve([]),Promise.resolve(null)];const [fields,stores,reports,tasks,issues,goals,reviews,annotations,users,audit,adminReports,accounts,aiSettings]=await Promise.all([api('/report-fields'),state.user.role==='store'?Promise.resolve([]):api('/stores'),api('/reports?month='+state.month+calendarScope),api('/tasks?month='+state.month+calendarScope),api('/issues'),api('/goals?month='+state.month+calendarScope),api('/reviews'),api('/annotations?month='+state.month+calendarScope),...adminCalls]);state.fields=fields;state.stores=stores;state.reports=reports;state.tasks=tasks;state.issues=issues;state.goals=goals;state.reviews=reviews;state.annotations=annotations;state.users=users;state.audit=audit;state.adminReports=adminReports;state.accounts=accounts;state.aiSettings=aiSettings;state.rankingMetrics=await api('/ranking-metrics');try{await loadOrdering();await loadOrderHistory()}catch(e){console.error('ordering load failed',e);state.ordering={store:null,categories:[],products:[],target:null,order:null,items:[]};state.orderHistory=[]}render();if(true){loadAnalytics().then(()=>state.user&&render()).catch(e=>toast('经营分析后台加载失败：'+e.message))}}catch(e){localStorage.removeItem('token');login();toast(e.message)}}

window.doLogin=async role=>{const notice=$('#loginNotice'),button=$('#loginBtn');if(button?.disabled)return;if(notice){notice.className='loginNotice';notice.textContent='正在验证登录信息…'}if(button){button.disabled=true;button.style.opacity='.65'}try{const body=role==='store'?{storeName:$('#store').value,name:$('#name').value,code:$('#code').value}:{name:$('#name').value,password:$('#password').value,role};const d=await api('/auth/'+(role==='store'?'store-login':'staff-login'),{method:'POST',body:JSON.stringify(body)});if(notice){notice.className='loginNotice success';notice.textContent='登录成功，正在进入工作台…'}localStorage.token=d.token;await new Promise(r=>setTimeout(r,350));await load()}catch(e){if(notice){notice.className='loginNotice error';notice.textContent='登录失败：'+(e.message||'账号或密码错误')}if(button){button.disabled=false;button.style.opacity='1'}}};

n></div>`:`<section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('report')} 近期日报</h2><span class="muted">${state.month}</span></div><div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>提交时间</th><th>提交人</th><th>营业额</th><th>客单量</th><th>状态</th></tr></thead><tbody>${state.reports.slice(0,12).map(r=>`<tr><td>${r.report_date}</td><td>${esc(String(r.updated_at||r.created_at||'').slice(0,19))}</td><td>${esc(r.submitter_name||r.submitted_by_name||'未记录')}</td><td>${money(r.payload?.totalRevenue??r.payload?.revenue)}</td><td>${num(r.payload?.orders)} 单</td><td><span class="pill">已提交</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">本月还没有日报</td></tr>'}</tbody></table></div></section>`}`}
function metricValue(row,metric){if(row.metricValues&&row.metricValues[metric]!==undefined)return Number(row.metricValues[metric]||0);return metric==='orders'?Number(row.orders||0):metric==='wasteRate'?Number(row.wasteRate||0):metric==='members'?Number(row.members||0):metric==='avgOrderValue'?Number(row.avgOrderValue||0):Number(row.revenue||0)}function metricLabel(metric){return metric==='orders'?'订单量':metric==='wasteRate'?'损耗率':metric==='members'?'会员新增':metric==='avgOrderValue'?'平均客单价':'营业额'}function metricDisplay(v,metric){return metric==='revenue'||metric==='avgOrderValue'?money(v):metric==='wasteRate'?num(v)+'%':num(v)+(metric==='orders'?' 单':' 人')}
function ranking(rows,metric){if(!rows?.length)return '<div class="empty">当前筛选范围暂无数据</div>';const max=Math.max(...rows.map(x=>metricValue(x,metric)),1);return `<div class="ranking">${rows.slice(0,8).map((r,i)=>{const v=metricValue(r,metric);return `<div class="rankRow"><span class="rankNo">${i+1}</span><span class="rankName">${esc(r.storeName)}</span><span class="rankTrack"><i style="width:${Math.round(v/max*100)}%"></i></span><span class="rankValue">${metricDisplay(v,metric)}</span></div>`}).join('')}</div>`}
function bars(rows,metric){if(!rows?.length)return '<div class="empty">当前时段暂无日报数据</div>';const max=Math.max(...rows.map(x=>metricValue(x,metric)),1);const short=rows.length>14?rows.filter((_,i)=>i%Math.ceil(rows.length/14)===0):rows;return `<div class="bars">${short.map(r=>{const v=metricValue(r,metric);return `<div class="barItem"><em>${r.day.slice(5)}</em><div class="barTrack"><i class="barFill" style="height:${Math.max(3,Math.round(v/max*100))}%"></i></div><small>${metricDisplay(v,metric)}</small></div>`}).join('')}</div>`}
const reportColumnDefs=[['date','日期'],['time','提交时间'],['store','门店'],['submitter','提交人'],['revenue','营业额'],['received','实收'],['orders','订单量'],['trialRatio','试吃占比'],['wasteRatio','报损占比']];window.toggleReportColumn=(key,on)=>{state.reportColumns[key]=on;document.querySelectorAll('[data-report-col=\"'+key+'\"]')?.forEach(el=>el.classList.toggle('colHidden',!on))};function toggleColumnPicker(){document.querySelector('.columnPicker')?.classList.toggle('open')}function reportColumnPicker(){const selected=reportColumnDefs.filter(([k])=>state.reportColumns[k]).length;return '<div class="columnPicker"><button type="button" class="columnPickerToggle" onclick="toggleColumnPicker()"><span>显示字段</span><small>'+selected+'/'+reportColumnDefs.length+' 已选</small><b>⌄</b></button><div class="columnPickerBody">'+reportColumnDefs.map(([k,l])=>`<label><input type="checkbox" ${state.reportColumns[k]?'checked':''} onchange="toggleReportColumn(\'${k}\',this.checked)">${l}</label>`).join('')+'</div></div>'}
function analytics(c){const a=state.analytics||{totals:{},byStore:[],byDay:[],details:[]};const metrics=state.rankingMetrics||[];const baseMetrics=[['revenue','营业额'],['orders','订单量'],['wasteRate','损耗率'],['members','会员新增'],['avgOrderValue','平均客单价']];const metricOptions=baseMetrics.map(([k,l])=>`<option value="${k}" ${state.metric===k?'selected':''}>${l}趋势/排行</option>`).join('')+(metrics||[]).filter(m=>!baseMetrics.some(x=>x[0]===m.metric_key)).map(m=>`<option value="${esc(m.metric_key)}" ${state.metric===m.metric_key?'selected':''}>${esc(m.label)}排行</option>`).join('');c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">数据驾驶舱 · 权限范围内</div><h1>经营分析</h1><p>按门店和时段查看数据，提交时间与提交人直接可追溯。</p></div><div class="headActions"><button class="btn light" onclick="openAIAnalysis()">${icon('trend')} AI 分析</button><button class="btn light" onclick="exportCsv()">导出 CSV</button>${state.user.role==='admin'?`<button class="btn light" onclick="adminPanel('ranking')">编辑排行</button>`:''}</div></section>${state.aiAnalysis?.status==='running'?`<section class="card aiBackground"><div class="sectionTitle"><h2>${icon('trend')} AI 正在后台分析</h2><span class="muted">可继续使用其他功能，完成后自动显示</span></div></section>`:state.aiAnalysis?.status==='done'?`<section class="card aiBackground"><div class="sectionTitle"><h2>${icon('trend')} AI 分析结果</h2><div><button class="btn light small" onclick="copyAIResult()">一键复制</button><button class="btn light small" onclick="openAIAnalysis()">查看详情</button></div></div><div class="aiAnswer">${esc(state.aiAnalysis.content).replaceAll('\n','<br>')}</div></section>`:state.aiAnalysis?.status==='error'?`<section class="card aiBackground"><div class="aiError">AI 分析失败：${esc(state.aiAnalysis.error)}</div></section>`:''}<section class="filters"><input class="input" type="date" id="afrom2" value="${a.from}" onchange="applyAnalytics()"><input class="input" type="date" id="ato" value="${a.to}" onchange="applyAnalytics()"><select class="input" id="astore" onchange="applyAnalytics()"><option value="all" ${state.analyticsStore==='all'?'selected':''}>全部门店</option>${state.stores.map(s=>`<option value="${s.id}" ${String(state.analyticsStore)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select class="input" id="ametric" onchange="applyAnalytics()">${metricOptions}</select></section><section class="grid">${stat('营业额',money(a.totals.revenue),'筛选期合计','money')}${stat('订单量',num(a.totals.orders),'订单总量','orders','blue')}${stat('平均客单价',money(a.totals.avgOrderValue),'营业额 ÷ 订单量','chart','green')}${stat('会员新增',num(a.totals.members),'筛选期合计','member','orange')}</section><div class="split"><section class="card chart"><div class="sectionTitle"><h2>${icon('trend')} ${metricLabel(state.metric)}趋势</h2><span class="muted">按日汇总</span></div>${bars(a.byDay,state.metric)}</section><section class="card"><div class="sectionTitle"><h2>${icon('store')} 各店${metricLabel(state.metric)}排行</h2><span class="muted">Top 8</span></div>${ranking(a.byStore,state.metric)}</section></div><section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('chart')} 门店汇总明细</h2><span class="muted">${a.from} 至 ${a.to}</span></div><div class="tableWrap">${reportColumnPicker()}<table class="table"><thead><tr><th data-report-col="date">提交日期</th><th data-report-col="time">提交时间</th><th data-report-col="store">门店</th><th data-report-col="submitter">提交人</th><th data-report-col="revenue">营业额</th><th data-report-col="received">实收</th><th data-report-col="orders">订单量</th><th data-report-col="trialRatio">试吃占比</th><th data-report-col="wasteRatio">报损占比</th></tr></thead><tbody>${(a.details||[]).map(r=>{const p=r.payload||{};return `<tr><td data-report-col="date">${esc(r.report_date)}</td><td data-report-col="time">${esc(String(r.updated_at||r.created_at||'').slice(0,19))}</td><td data-report-col="store"><b>${esc(r.store_name)}</b></td><td data-report-col="submitter">${esc(r.submitted_by_name||'未记录')}</td><td data-report-col="revenue">${money(p.totalRevenue??p.revenue)}</td><td data-report-col="received">${money(p.received)}</td><td data-report-col="orders">${num(p.orders)}</td><td data-report-col="trialRatio">${num(p.trialRatio)}%</td><td data-report-col="wasteRatio">${num(p.wasteRatio)}%</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">当前筛选范围暂无数据</td></tr>'}</tbody></table></div></section>`}
window.applyAnalytics=async()=>{const from=$('#afrom2').value,to=$('#ato').value;if(!from||!to)return toast('请选择完整日期范围');state.analyticsFrom=from;state.analyticsTo=to;state.analyticsStore=$('#astore').value;state.metric=$('#ametric').value;try{await loadAnalytics();render()}catch(e){toast(e.message)}};
function round2(v){return Math.round(Number(v||0)*100)/100}
function nval(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(/[￥¥,%，\s]/g,''));return Number.isFinite(n)?n:null}
function calcReport(p={}){const total=nval(p.totalRevenue??p.revenue),discount=nval(p.discounts);if(total!==null){p.totalRevenue=round2(total);p.revenue=round2(total)}if(total!==null&&discount!==null){p.received=round2(total-discount)}const platformKeys=['onlineMeituanGroup','onlineMeituanDelivery','onlineDouyinGroup','onlineTaobaoFlash'];if(platformKeys.some(k=>nval(p[k])!==null))p.platformTotal=round2(platformKeys.reduce((sum,k)=>sum+(nval(p[k])||0),0));if(nval(p.trialAmount)!==null&&total>0)p.trialRatio=round2(nval(p.trialAmount)/(nval(p.trialAmount)+(nval(p.wasteAmount)||0)+total)*100);if(nval(p.wasteAmount)!==null&&total>0)p.wasteRatio=round2(nval(p.wasteAmount)/((nval(p.trialAmount)||0)+(nval(p.wasteAmount)||0)+total)*100);p.wasteRate=p.wasteRatio??p.wasteRate??0;return p}
function extractNumber(text,label){const r=new RegExp(label+'[^\\d-]*(-?[\\d,]+(?:\\.\\d+)?)','i').exec(text);return r?nval(r[1]):null}
function parseDailyTemplate(text){const raw=String(text||'').replace(/\r/g,'');const dateMatch=raw.match(/(\d{1,2})月(\d{1,2})日/);const date=dateMatch?`${new Date().getFullYear()}-${String(Number(dateMatch[1])).padStart(2,'0')}-${String(Number(dateMatch[2])).padStart(2,'0')}`:today();const p={totalRevenue:extractNumber(raw,'总营业额'),discounts:extractNumber(raw,'优惠\\s*[\\/]?\\s*折扣券合计'),received:extractNumber(raw,'实收金额(?:（实际到账）)?'),onlineMeituanGroup:extractNumber(raw,'美团团购'),onlineMeituanDelivery:extractNumber(raw,'美团外卖'),onlineDouyinGroup:extractNumber(raw,'抖音团购'),onlineTaobaoFlash:extractNumber(raw,'淘宝闪购'),memberCardConsumption:extractNumber(raw,'会员卡消费'),memberCardRecharge:extractNumber(raw,'会员卡充值'),cash:extractNumber(raw,'现金'),onsiteDigital:extractNumber(raw,'微信\\/支付宝\\/云闪付到店'),trialCount:extractNumber(raw,'试吃数量'),wasteCount:extractNumber(raw,'报损数量'),trialAmount:extractNumber(raw,'试吃金额'),wasteAmount:extractNumber(raw,'报损金额'),physicalCardBalance:extractNumber(raw,'会员实体卡余量'),orders:extractNumber(raw,'订单量'),members:extractNumber(raw,'会员新增')};const egg=/蛋挞抖音赠送[^\n]*?[:：]\s*([\d,]+)[^\n]*?金额[:：]\s*([\d,.]+)/i.exec(raw);if(egg){p.eggTartGiftCount=nval(egg[1]);p.eggTartGiftAmount=nval(egg[2])}return {date,payload:calcReport(p)}}
function reportTemplate(p={},date=today()){const d=new Date(date+'T00:00:00');const day=`${d.getMonth()+1}月${d.getDate()}日`;const v=k=>p[k]??'';return `【${state.user?.storeName||'门店'} ${day}营业日报】\n\n1.整体营收\n总营业额：${v('totalRevenue')}\n优惠/折扣券合计：${v('discounts')}\n实收金额（实际到账）：${v('received')}\n\n2.收入途径明细\n\n①线上渠道\n美团团购：${v('onlineMeituanGroup')}\n美团外卖：${v('onlineMeituanDelivery')}\n抖音团购：${v('onlineDouyinGroup')}\n淘宝闪购：${v('onlineTaobaoFlash')}\n合计平台收入：${v('platformTotal')}\n\n②储值&会员卡\n会员卡消费：${v('memberCardConsumption')}\n会员卡充值：${v('memberCardRecharge')}\n\n③线下收款\n现金：${v('cash')}\n微信/支付宝/云闪付到店：${v('onsiteDigital')}\n\n④试吃与报损\n试吃数量：${v('trialCount')}\n报损数量：${v('wasteCount')}\n试吃金额：${v('trialAmount')}\n试吃占比：${v('trialRatio')}%\n报损金额：${v('wasteAmount')}\n报损占比：${v('wasteRatio')}%\n\n会员实体卡余量：${v('physicalCardBalance')}\n蛋挞抖音赠送：${v('eggTartGiftCount')} 金额：${v('eggTartGiftAmount')}\n（附报损、试吃、结班单）`}

function report(c){const adminMode=state.user.role==='admin';if(adminMode&&!state.reportStoreId&&state.stores[0])state.reportStoreId=state.stores[0].id;const date=state.reportDraftDate||today();const selectedStore=adminMode?Number(state.reportStoreId):null;const old=state.reports.find(r=>r.report_date===date&&(!adminMode||Number(r.store_id)===selectedStore));const p=calcReport({...old?.payload,...(state.reportDraft||{})});const baseLabels=['试吃数量','报损数量','试吃金额','试吃占比','报损金额','报损占比','试吃率','报损率'];const standardKeys=new Set(standardFields.map(x=>x[0]));const extras=state.fields.filter(f=>!standardKeys.has(f.key)&&!['revenue','orders','wasteRate','members'].includes(f.key)&&!baseLabels.includes(f.label));c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${date}</div><h1>营业日报</h1><p>${adminMode?'选择门店和日期后，可编辑或覆盖已有营业日报。':'支持整段粘贴导入；所有派生金额和占比会自动计算。'}</p></div><div class="headActions"><button class="btn light small" onclick="openImport()">${icon('report')} 粘贴导入</button><button class="btn light small" onclick="copyReportTemplate()">复制模板</button></div></section><section class="card reportDateSection"><div class="sectionTitle"><h2>日报日期</h2><div class="headActions">${adminMode?`<select class="input" id="reportStore" onchange="changeReportStore(this.value)">${state.stores.map(st=>`<option value="${st.id}" ${Number(st.id)===selectedStore?'selected':''}>${esc(st.name)}</option>`).join('')}</select>`:''}<input class="input" id="reportDate" type="date" value="${date}" onchange="changeReportDate(this.value)"></div></div><div class="heroNote">自动公式：实收金额 = 总营业额 − 优惠折扣；平台收入 = 四个线上渠道之和；试吃占比 = 试吃金额 ÷（试吃金额 + 报损金额 + 营业额）；报损占比同理。</div></section><section class="reportQuickAction"><div><b>${old?'覆盖并提交这张日报':'提交这张营业日报'}</b><small>${old?'已有同日记录，提交后会更新原日报':'填写下方数据后，随时可从这里提交'}</small></div><button class="btn orange" onclick="submitReport(this)">${icon('report')} ${old?'覆盖并提交':'提交营业日报'}</button></section><section class="card reportSection"><div class="sectionTitle"><h2>整体营收</h2><span clas function readReportForm(){const v=id=>nval($('#r_'+id)?.value);const p={totalRevenue:v('totalRevenue'),discounts:v('discounts'),received:v('received'),onlineMeituanGroup:v('onlineMeituanGroup'),onlineMeituanDelivery:v('onlineMeituanDelivery'),onlineDouyinGroup:v('onlineDouyinGroup'),onlineTaobaoFlash:v('onlineTaobaoFlash'),memberCardConsumption:v('memberCardConsumption'),memberCardRecharge:v('memberCardRecharge'),cash:v('cash'),onsiteDigital:v('onsiteDigital'),trialCount:v('trialCount'),wasteCount:v('wasteCount'),trialAmount:v('trialAmount'),trialRatio:v('trialRatio'),wasteAmount:v('wasteAmount'),wasteRatio:v('wasteRatio'),physicalCardBalance:v('physicalCardBalance'),eggTartGiftCount:v('eggTartGiftCount'),eggTartGiftAmount:v('eggTartGiftAmount'),orders:v('orders'),members:v('members'),note:$('#r_note')?.value||''};for(const f of state.fields.filter(f=>!['revenue','orders','wasteRate','members'].includes(f.key))){const el=$('#r_'+f.key);if(el)p[f.key]=f.field_type==='number'?nval(el.value):el.value}return calcReport(p)}

function dayStats(date){const rows=state.reports.filter(r=>r.report_date===date);const total=rows.reduce((s,r)=>s+Number(r.payload?.totalRevenue??r.payload?.revenue??0),0);const received=rows.reduce((s,r)=>s+Number(r.payload?.received||0),0);const tasks=state.tasks.filter(t=>t.task_date===date);const annotations=state.annotations.filter(a=>String(a.annotation_date).slice(0,10)===date);const ordering=state.orderHistory.find(o=>String(o.order_date).slice(0,10)===date);return {submitted:rows.length,total,received,orderingAmount:Number(ordering?.total_amount||0),target:tasks.reduce((s,t)=>s+Number(t.target_value||0),0),actual:tasks.reduce((s,t)=>s+Number(t.actual_value||0),0),annotations,ordering}}

window.applyCalendarStore=async store=>{state.calendarStore=store;await load()};
window.changeMonth=async d=>{let [y,m]=state.month.split('-').map(Number);m+=d;if(m===0){y--;m=12}if(m===13){y++;m=1}state.month=`${y}-${String(m).padStart(2,'0')}`;await load()};
function reviewKey(type){const d=new Date();if(type==='month')return today().slice(0,7);const first=new Date(d.getFullYear(),0,1);const week=Math.ceil((((d-first)/86400000)+first.getDay()+1)/7);return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`}
function collapseCard(card,title,hint){if(!card||card.dataset.collapsedReady)return;card.dataset.collapsedReady='1';const originalTitle=card.querySelector(':scope > .sectionTitle');const body=document.createElement('div');body.className='collapseBody';const summary=document.createElement('button');summary.type='button';summary.className='collapseSummary';summary.innerHTML=`<span><h2>${title}</h2><small class="collapseHint">${hint}</small></span><span class="collapseChevron">⌄</span>`;[...card.children].forEach(child=>{if(child!==originalTitle)body.appendChild(child)});if(originalTitle)originalTitle.remove();card.prepend(summary);card.appendChild(body);card.classList.add('collapseCard','is-collapsed');summary.addEventListener('click',()=>card.classList.toggle('is-collapsed'))}
function collapseReportSections(root){root.querySelectorAll('.reportSection').forEach((card,i)=>{const heading=card.querySelector(':scope > .sectionTitle h2');const title=heading?.textContent?.trim()||(['提交与附件说明','日报字段','补充指标'][i]||'日报填写');const hint=i===0?'点击展开填写本日经营数据':'点击展开填写或查看字段';collapseCard(card,title,hint)})}
function collapseReviewEditor(root){const card=root.querySelector('.reviewEditor');if(card)collapseCard(card,'填写本期复盘与总结','点击展开编辑，保存后可在历史沉淀中查看')}
function reviews(c){const ops=state.user.role!=='store',type=window.reviewType||'week',key=window.reviewPeriodKey||reviewKey(type),selected=state.reviews.find(r=>r.period_type===type&&r.period_key===key&&(!ops||!state.reviewStoreId||Number(r.store_id)===Number(state.reviewStoreId)))||{};c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${type==='week'?'周复盘':'月总结'} · ${key}</div><h1>复盘与总结</h1><p>把经营结果、现场问题和下一步动作沉淀下来，店长与运营共享同一条业务链路。</p></div><div class="headActions"><button class="btn light small" onclick="switchReviewType('week')">周复盘</button><button class="btn light small" onclick="switchReviewType('month')">月总结</button></div></section><section class="card reviewEditor"><div class="sectionTitle"><div><h2>${icon('report')} ${type==='week'?'本周复盘':'本月总结'}</h2><span class="muted">${ops?'运营可选择门店填写或复盘。':'店长填写后，运营可查看。'}</span></div>${ops?`<select class="input" id="reviewStore" onchange="reviewStoreChange(this.value)">${state.stores.filter(x=>x.status==='active').map(x=>`<option value="${x.id}" ${Number(state.reviewStoreId||state.stores[0]?.id)===Number(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div><div class="reportGrid two"><select class="input" id="reviewType" onchange="switchReviewType(this.value)"><option value="week" ${type==='week'?'selected':''}>周复盘</option><option value="month" ${type==='month'?'selected':''}>月总结</option></select><input class="input" id="reviewKey" value="${esc(key)}" placeholder="周期，例如 2026-W41 或 2026-10"></div><input class="input" id="reviewTitle" value="${esc(selected.title||'')}" placeholder="标题，例如：第41周经营复盘"><textarea class="input" id="reviewContent" rows="5" placeholder="整体经营结果、关键判断和本周期结论">${esc(selected.content||'')}</textarea><div class="reportGrid"><textarea class="input" id="reviewHighlights" rows="4" placeholder="做得好的地方 / 亮点">${esc(selected.highlights||'')}</textarea><textarea class="input" id="reviewBlockers" rows="4" placeholder="问题、阻塞和需要协同的事项">${esc(selected.blockers||'')}</textarea><textarea class="input" id="reviewNextActions" rows="4" placeholder="下一周期行动项、负责人和截止时间">${esc(selected.next_actions||'')}</textarea></div><div class="headActions"><button class="btn orange" onclick="saveReview(this)">保存${type==='week'?'周复盘':'月总结'}</button>${selected.id?`<button class="btn light" onclick="deleteReview(${selected.id})">删除这条</button>`:''}</div></section><section class="card reviewHistory"><div class="sectionTitle"><h2>${icon('trend')} 历史沉淀</h2><span class="muted">${state.reviews.length} 条</span></div>${state.reviews.map(r=>`<article class="reviewRow"><div><span class="pill ${r.period_type==='month'?'orange':''}">${r.period_type==='week'?'周复盘':'月总结'}</span><b>${esc(r.period_key)} · ${esc(r.store_name||'本店')}</b><small>${esc(r.author_user_name||r.author_role||'')} · ${String(r.updated_at||'').slice(0,16)}</small></div><p>${esc(r.title||r.content).slice(0,120)}</p><button class="btn light small" onclick="loadReview(${r.id})">查看</button></article>`).join('')||'<div class="empty">还没有复盘记录</div>'}</section>`;collapseReviewEditor(c)}
window.switchReviewType=type=>{window.reviewType=type;window.reviewPeriodKey=reviewKey(type);render()};window.reviewStoreChange=id=>{state.reviewStoreId=Number(id);render()};window.loadReview=id=>{const r=state.reviews.find(x=>x.id===id);if(!r)return;window.reviewType=r.period_type;window.reviewPeriodKey=r.period_key;state.reviewStoreId=Number(r.store_id);render()};window.saveReview=async button=>{const content=$('#reviewContent').value.trim();if(!content)return toast('请填写复盘内容');const restore=busy(button,'保存中…');try{await api('/reviews',{method:'POST',body:JSON.stringify({storeId:state.user.role==='store'?undefined:Number($('#reviewStore')?.value||state.reviewStoreId||state.stores[0]?.id),periodType:$('#reviewType').value,periodKey:$('#reviewKey').value.trim(),title:$('#reviewTitle').value,content,highlights:$('#reviewHighlights').value,blockers:$('#reviewBlockers').value,nextActions:$('#reviewNextActions').value})});toast('复盘已保存，运营与店长端已同步');await load()}catch(e){toast('复盘保存失败：'+e.message)}finally{restore()}};window.deleteReview=async id=>{if(!confirm('确定删除这条复盘？'))return;try{await api('/reviews/'+id,{method:'DELETE'});toast('复盘已删除');await load()}catch(e){toast(e.message)}};
window.saveAnnotation=async(date,button)=>{const content=$('#annContent').value.trim();if(!content)return toast('请填写标注内容');const restore=busy(button,'保存中…');try{await api('/annotations',{method:'POST',body:JSON.stringify({storeId:state.user.role==='store'?undefined:Number($('#annStore')?.value||state.calendarStore),date,type:$('#annType').value,title:$('#annTitle').value,content,reminderAt:$('#annReminder').value||null})});closeModal();toast('日期标注已保存');await load()}catch(e){toast('标注保存失败：'+e.message)}finally{restore()}};window.deleteAnnotation=async(id,date)=>{if(!confirm('删除这条日期标注？'))return;try{await api('/annotations/'+id,{method:'DELETE'});toast('标注已删除');await load();dayDetail(date)}catch(e){toast(e.message)}};
function issues(c){const store=state.user.role==='store',ops=!store;const rows=state.issues.map(i=>`<tr><td>${esc(i.store_name||'本店')}</td><td>${esc(i.type)}</td><td class="issueText">${esc(i.content)}</td><td>${esc(i.submitter_name||'未记录')}<small class="muted" style="display:block">${String(i.created_at||'').slice(0,16)}</small></td><td><span class="pill ${i.status==='pending'?'red':i.status==='processing'?'orange':''}">${({pending:'待处理',processing:'处理中',resolved:'已解决',closed:'已关闭'})[i.status]||i.status}</span></td><td>${esc(i.handling_note||'-')}</td><td><div class="headActions">${ops?`<button class="btn orange small" onclick="processIssue(${i.id})">处理</button>`:''}<button class="btn light small" onclick="issueModal(${i.id})">编辑</button><button class="btn danger small" onclick="deleteIssue(${i.id},this)">删除</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无反馈</td></tr>';c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${store?'门店协同':'运营协同'}</div><h1>反馈中心</h1><p>所有角色都可以创建、查看、编辑和删除反馈；运营与管理员还可以更新处理状态。</p></div><button class="btn orange" onclick="issueModal()">${icon('issue')} 新建反馈</button></section><section class="grid3">${stat('反馈总数',state.issues.length,'当前可见范围','issue')}${stat('待处理',state.issues.filter(x=>x.status==='pending').length,'需要跟进','trend','red')}${stat('已解决',state.issues.filter(x=>['resolved','closed'].includes(x.status)).length,'已完成闭环','chart','green')}</section><section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('issue')} 反馈记录</h2><button class="btn light small" onclick="load()">刷新列表</button></div><div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>类型</th><th>内容</th><th>提交人 / 时间</th><th>状态</th><th>处理结果</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
window.issueModal=id=>{const x=id?state.issues.find(i=>i.id===id):{};const ops=state.user.role!=='store';modal(`<div class="sectionTitle"><div><div class="eyebrow">${id?'编辑反馈':'新建反馈'}</div><h2>${id?'更新协同记录':'提交一条反馈'}</h2></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form">${ops?`<select class="input" id="issueStore">${state.stores.filter(s=>s.status==='active').map(s=>`<option value="${s.id}" ${String(s.id)===String(x.store_id||state.stores[0]?.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}<select class="input" id="issueType"><option ${x.type==='设备问题'?'selected':''}>设备问题</option><option ${x.type==='人员排班'?'selected':''}>人员排班</option><option ${x.type==='原料库存'?'selected':''}>原料库存</option><option ${x.type==='其他建议'?'selected':''}>其他建议</option></select><textarea class="input" id="issueContent" rows="5" required placeholder="描述问题、影响和需要协同的动作">${esc(x.content||'')}</textarea>${ops?`<select class="input" id="issueStatus"><option value="pending" ${x.status==='pending'||!id?'selected':''}>待处理</option><option value="processing" ${x.status==='processing'?'selected':''}>处理中</option><option value="resolved" ${x.status==='resolved'?'selected':''}>已解决</option><option value="closed" ${x.status==='closed'?'selected':''}>已关闭</option><option value="">不变更状态</option></select><textarea class="input" id="issueNote" rows="3" placeholder="处理结果或跟进备注">${esc(x.handling_note||'')}</textarea>`:''}<button class="btn orange" onclick="saveIssue(${id||'null'},this)">保存反馈</button></div>`)}
window.processIssue=id=>{window.issueModal(id);const status=$('#issueStatus');if(status)status.value='processing';const note=$('#issueNote');if(note&&!note.value)note.focus()};window.saveIssue=async(id,button)=>{const content=$('#issueContent').value.trim();if(!content){toast('请填写反馈内容');$('#issueContent')?.focus();return}const restore=busy(button,'保存中…');try{const body={type:$('#issueType').value,content};if(state.user.role!=='store'){body.storeId=Number($('#issueStore').value);body.status=$('#issueStatus').value||undefined;body.note=$('#issueNote').value}await api(id?'/issues/'+id:'/issues',{method:id?'PATCH':'POST',body:JSON.stringify(body)});closeModal();toast(id?'反馈已更新':'反馈已提交');await load()}catch(e){toast('保存失败：'+e.message)}finally{restore()}};window.deleteIssue=async(id,button)=>{if(!confirm('确定删除这条反馈？'))return;const restore=busy(button,'删除中…');try{await api('/issues/'+id,{method:'DELETE'});toast('反馈已删除');await load()}catch(e){toast('删除失败：'+e.message)}finally{restore()}};
function admin(c){c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">ADMIN CONTROL CENTER</div><h1>系统管理</h1><p>把高频管理动作拆成清晰模块，点击进入弹窗处理，避免长页面来回滚动。</p></div><button class="btn light" onclick="load()">刷新数据</button></section><section class="adminCommandGrid"><button class="adminCommand card" onclick="adminPanel('template')"><span class="commandIcon">${icon('report')}</span><span><b>日报模板</b><small>字段、单位、必填规则与下发</small></span><i>${state.fields.length} 个字段</i></button><button class="adminCommand card" onclick="adminPanel('stores')"><span class="commandIcon">${icon('store')}</span><span><b>门店与店长</b><small>门店口令、店长和启用状态</small></span><i>${state.stores.length} 家门店</i></button><button class="adminCommand card" onclick="adminPanel('accounts')"><span class="commandIcon">${icon('settings')}</span><span><b>运营与管理员账号</b><small>编辑登录账号与口令</small></span><i>${state.accounts.length} 个账号</i></button><button class="adminCommand card" onclick="adminPanel('reports')"><span class="commandIcon">${icon('report')}</span><span><b>已提交日报</b><small>全量检索、编辑和删除</small></span><i>${state.adminReports.length} 条记录</i></button><button class="adminCommand card" onclick="adminPanel('ai')"><span class="commandIcon">${icon('trend')}</span><span><b>AI 分析配置</b><small>接口地址、模型和启用状态</small></span><i>${state.aiSettings?.enabled?'已启用':'未启用'}</i></button><button class="adminCommand card" onclick="adminPanel('audit')"><span class="commandIcon">${icon('chart')}</span><span><b>审计日志</b><small>查看关键管理操作</small></span><i>${state.audit.length} 条日志</i></button></section>`}
function auditActionLabel(action){return ({create:'新建',update:'更新',delete:'删除',login:'登录',logout:'退出',process:'处理',submit:'提交'})[action]||action||'系统操作'}
function auditEntityLabel(entity){return ({daily_reports:'营业日报',daily_orders:'报货单',issues:'反馈',stores:'门店',users:'账号',report_fields:'日报模板',goals:'实收目标',annotations:'日期标注',reviews:'周月复盘',ranking_metrics:'排行配置',ai_settings:'AI 配置'}[entity]||entity||'系统对象')}
function auditDetailText(detail){try{const x=typeof detail==='string'?JSON.parse(detail):detail||{};return Object.entries(x).slice(0,5).map(([k,v])=>`${k}：${typeof v==='object'?JSON.stringify(v):String(v)}`).join(' · ')||'无附加说明'}catch{return String(detail||'无附加说明')}}
function auditRows(){const q=($('#auditSearch')?.value||'').trim().toLowerCase();const action=$('#auditAction')?.value||'all';return (state.audit||[]).filter(a=>(action==='all'||a.action===action)&&(!q||`${a.user_name||''} ${a.action||''} ${a.entity||''} ${a.entity_id||''} ${auditDetailText(a.detail)}`.toLowerCase().includes(q))).map(a=>`<label class="auditRow"><input class="auditCheck" type="checkbox" value="${a.id}"><span class="auditTime">${String(a.created_at||'').slice(0,16)}</span><span class="auditMain"><b>${esc(auditActionLabel(a.action))} · ${esc(auditEntityLabel(a.entity))}${a.entity_id?` #${esc(a.entity_id)}`:''}</b><small>${esc(auditDetailText(a.detail))}</small></span><span class="auditUser">${esc(a.user_name||'系统')}</span></label>`).join('')||'<div class="empty">没有匹配的日志</div>'}
window.auditFilter=()=>{const el=$('#auditRows');if(el)el.innerHTML=auditRows()};window.auditToggleAll=checked=>document.querySelectorAll('#auditRows .auditCheck').forEach(x=>x.checked=checked);window.auditDeleteSelected=async button=>{const ids=[...document.querySelectorAll('#auditRows .auditCheck:checked')].map(x=>Number(x.value));if(!ids.length)return toast('请先勾选要删除的日志');if(!confirm(`确定删除选中的 ${ids.length} 条审计日志？`))return;const restore=busy(button,'删除中…');try{const out=await api('/audit/bulk-delete',{method:'POST',body:JSON.stringify({ids})});state.audit=await api('/audit?limit=5000');adminPanel('audit');toast(`已删除 ${out.deleted||ids.length} 条日志`)}catch(e){toast('批量删除失败：'+e.message)}finally{restore()}};window.auditDeleteBefore=async button=>{const before=$('#auditBefore')?.value;if(!before)return toast('请选择清理日期');if(!confirm(`确定删除 ${before} 之前的全部审计日志？此操作不可恢复。`))return;const restore=busy(button,'清理中…');try{const out=await api('/audit/cleanup',{method:'POST',body:JSON.stringify({before})});state.audit=await api('/audit?limit=5000');adminPanel('audit');toast(`已清理 ${out.deleted||0} 条历史日志`)}catch(e){toast('历史清理失败：'+e.message)}finally{restore()}};
window.adminPanel=async type=>{if(type==='ranking'){const ms=state.rankingMetrics||[];modal(`<div class="sectionTitle"><div><h2>排行指标配置</h2><span class="templateHint">管理员可决定哪些日报指标进入排行榜</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="adminModalBody">${ms.map((m,i)=>`<div class="fieldRow"><input class="input" data-r-label="${i}" value="${esc(m.label)}"><input class="input" data-r-unit="${i}" value="${esc(m.unit||'')}" placeholder="单位"><select class="input" data-r-agg="${i}"><option value="sum" ${m.aggregation==='sum'?'selected':''}>合计</option><option value="avg" ${m.aggregation==='avg'?'selected':''}>平均</option></select><label><input type="checkbox" data-r-enabled="${i}" checked> 启用</label></div>`).join('')}</div><button class="btn blue" onclick="saveRanking(this)">保存排行配置</button>`);return}if(type==='ai'){const a=state.aiSettings||{};modal(`<div class="sectionTitle"><div><h2>AI 接口配置</h2><span class="templateHint">兼容 OpenAI Chat Completions 的接口</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><select class="input" id="aiProvider" onchange="applyAIProvider(this.value)"><option value="custom">自定义 OpenAI 兼容接口</option><option value="deepseek">DeepSeek</option><option value="doubao">豆包 / 火山方舟</option></select><input class="input" id="aiEndpoint" value="${esc(a.endpoint||'')}" placeholder="https://api.example.com/v1"><input class="input" id="aiModel" value="${esc(a.model||'')}" placeholder="模型名称，如 deepseek-chat 或方舟模型 ID"><input class="input" id="aiKey" type="password" placeholder="${a.has_key?'已配置，留空保持不变':'API Key'}"><div class="templateHint" id="aiProviderHint">DeepSeek：Endpoint 可填 https://api.deepseek.com；模型可填 deepseek-chat 或 deepseek-flash。</div><label><input type="checkbox" id="aiEnabled" ${a.enabled?'checked':''}> 启用 AI 分析</label><button class="btn orange" onclick="saveAISettings(this)">保存配置</button></div>`);return}if(type==='reports'){modal(`<div class="sectionTitle"><h2>已提交日报管理</h2><button class="btn light small" onclick="closeModal()">关闭</button></div>${adminReportHistory()}`);return}if(type==='audit'){const actions=[...new Set((state.audit||[]).map(x=>x.action).filter(Boolean))];modal(`<div class="sectionTitle"><div><h2>${icon('chart')} 审计日志</h2><span class="templateHint">记录谁在什么时间对什么数据做了什么操作；自动保留最近 5000 条，接口不使用浏览器缓存。</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="auditSummary"><b>${state.audit.length}</b><span>当前已加载</span><i>数据库最多自动保留 5000 条</i></div><div class="auditTools"><input class="input" id="auditSearch" placeholder="搜索用户、对象、编号或说明" oninput="auditFilter()"><select class="input" id="auditAction" onchange="auditFilter()"><option value="all">全部动作</option>${actions.map(a=>`<option value="${esc(a)}">${esc(auditActionLabel(a))}</option>`).join('')}</select></div><div class="auditBulk"><label><input type="checkbox" onchange="auditToggleAll(this.checked)"> 全选当前结果</label><button class="btn danger small" onclick="auditDeleteSelected(this)">删除选中</button><input class="input" id="auditBefore" type="date" title="删除该日期之前的日志"><button class="btn light small" onclick="auditDeleteBefore(this)">清理更早日志</button></div><div class="auditList"><div class="auditHead"><span>选择</span><span>时间</span><span>事件与说明</span><span>操作者</span></div><div id="auditRows">${auditRows()}</div></div>`);return}if(type==='template'){const fields=templateFields();modal(`<div class="sectionTitle"><div><h2>日报模板</h2><span class="templateHint">保存后同步至店长端</span></div><div class="headActions"><button class="btn orange small" onclick="addField()">新增字段</button><button class="btn light small" onclick="closeModal()">关闭</button></div></div><div class="adminModalBody">${fields.map((f,i)=>`<div class="fieldRow"><input class="input" data-label="${i}" value="${esc(f.label)}"><input class="input" data-unit="${i}" value="${esc(f.unit)}" placeholder="单位"><select class="input" data-type="${i}"><option value="number" ${f.field_type==='number'?'selected':''}>数字</option><option value="text" ${f.field_type==='text'?'selected':''}>文字</option></select><label><input type="checkbox" data-req="${i}" ${f.required?'checked':''}> 必填</label><button class="btn light small" onclick="removeField('${esc(f.key)}')">删除</button></div>`).join('')}</div><button class="btn blue" onclick="saveFields(this)">保存并下发</button>`);return}if(type==='stores'){modal(`<div class="sectionTitle"><div><h2>门店与店长</h2><span class="templateHint">门店登录口令也在这里维护</span></div><div class="headActions"><button class="btn orange small" onclick="addStore()">新增门店</button><button class="btn light small" onclick="closeModal()">关闭</button></div></div>${storeTable()}`);return}if(type==='accounts'){modal(`<div class="sectionTitle"><div><h2>运营与管理员账号</h2><span class="templateHint">口令修改后立即生效，至少 6 位</span></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="accountList">${state.accounts.map(a=>`<article class="accountRow"><div><b>${esc(a.name)}</b><span class="pill">${a.role==='ops'?'运营':'管理员'}</span><small>${String(a.created_at||'').slice(0,10)}</small></div><div class="accountEdit"><input class="input" id="accountName${a.id}" value="${esc(a.name)}"><input class="input" id="accountPassword${a.id}" type="password" placeholder="输入新口令（不改则留空）"><button class="btn orange small" onclick="saveAccount(${a.id},this)">保存</button></div></article>`).join('')||'<div class="empty">暂无可管理账号</div>'}</div>`)}}
function storeTable(){return `<div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>地址</th><th>店长</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.stores.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.address)}</td><td>${esc(s.manager_name)}</td><td>${esc(s.status)}</td><td><button class="btn light small" onclick="editStore(${s.id})">编辑</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">暂无门店</td></tr>'}</tbody></table></div>`}
window.saveAccount=async(id,button)=>{const name=$('#accountName'+id).value.trim(),password=$('#accountPassword'+id).value;if(!name)return toast('账号名称不能为空');if(password&&password.length<6)return toast('口令至少需要6位');const restore=busy(button,'保存中…');try{await api('/admin/accounts/'+id,{method:'PATCH',body:JSON.stringify({name,password:password||undefined})});toast('账号与口令已更新');await load();adminPanel('accounts')}catch(e){toast('保存失败：'+e.message)}finally{restore()}};
window.saveRanking=async button=>{const restore=busy(button,'保存中…');try{const metrics=(state.rankingMetrics||[]).map((m,i)=>({...m,label:document.querySelector(`[data-r-label=\"${i}\"]`).value,unit:document.querySelector(`[data-r-unit=\"${i}\"]`).value,aggregation:document.querySelector(`[data-r-agg=\"${i}\"]`).value,enabled:document.querySelector(`[data-r-enabled=\"${i}\"]`).checked}));state.rankingMetrics=await api('/ranking-metrics',{method:'PUT',body:JSON.stringify({metrics})});toast('排行配置已保存');closeModal();render()}catch(e){toast('保存失败：'+e.message)}finally{restore()}};window.applyAIProvider=provider=>{const e=$('#aiEndpoint'),m=$('#aiModel'),h=$('#aiProviderHint');if(!e||!m)return;if(provider==='deepseek'){e.value='https://api.deepseek.com';if(!m.value||m.value==='gpt-4o-mini')m.value='deepseek-chat';if(h)h.textContent='DeepSeek 官方兼容接口：https://api.deepseek.com；请在 DeepSeek 控制台创建 API Key。'}else if(provider==='doubao'){e.value='https://ark.cn-beijing.volces.com/api/v3';if(!m.value||m.value==='gpt-4o-mini')m.value='请填写方舟模型 ID';if(h)h.textContent='豆包/火山方舟官方兼容接口：https://ark.cn-beijing.volces.com/api/v3；模型填写方舟控制台中的模型 ID。'}else if(h)h.textContent='填写任意兼容 OpenAI Chat Completions 的服务根地址。'};
window.saveAISettings=async button=>{const restore=busy(button,'保存中…');try{state.aiSettings=await api('/ai/settings',{method:'PUT',body:JSON.stringify({endpoint:$('#aiEndpoint').value.trim(),model:$('#aiModel').value.trim(),apiKey:$('#aiKey').value||undefined,enabled:$('#aiEnabled').checked})});toast('AI 配置已保存');closeModal();render()}catch(e){toast('保存失败：'+e.message)}finally{restore()}};
window.addField=()=>{state.fields.push({label:'新字段',key:'field_'+Date.now(),field_type:'number',unit:'',required:false});render()};window.removeField=key=>{if(!confirm('确定删除字段“'+key+'”？保存并下发后，店长端将不再显示该字段。'))return;state.fields=state.fields.filter(f=>f.key!==key);render()};window.saveFields=async button=>{const restore=busy(button,'正在保存并下发…');try{const fields=templateFields().map((f,i)=>({...f,label:document.querySelector(`[data-label="${i}"]`).value,unit:document.querySelector(`[data-unit="${i}"]`).value,field_type:document.querySelector(`[data-type="${i}"]`).value,required:document.querySelector(`[data-req="${i}"]`).checked}));await api('/report-fields',{method:'PUT',body:JSON.stringify({fields})});toast('日报模板已保存并下发到店长端');await load()}catch(e){toast('模板保存失败：'+e.message)}finally{restore()}};
window.addStore=()=>modal(`<div class="sectionTitle"><h2>新增门店</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="s_name" placeholder="门店名称"><input class="input" id="s_addr" placeholder="地址"><input class="input" id="s_manager" placeholder="负责人（可选）"><input class="input" id="s_code" placeholder="门店口令"><button class="btn orange" onclick="createStore(this)">创建</button></div>`);window.createStore=async button=>{const restore=busy(button,'正在创建…');try{await api('/stores',{method:'POST',body:JSON.stringify({name:$('#s_name').value,address:$('#s_addr').value,managerName:$('#s_manager').value,code:$('#s_code').value})});closeModal();toast('门店已创建');await load()}catch(e){toast('门店创建失败：'+e.message)}finally{restore()}};window.editStore=id=>{const s=state.stores.find(x=>x.id===id);modal(`<div class="sectionTitle"><h2>编辑 ${esc(s.name)}</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="e_name" value="${esc(s.name)}"><input class="input" id="e_addr" value="${esc(s.address)}"><input class="input" id="e_manager" value="${esc(s.manager_name)}"><input class="input" id="e_code" placeholder="输入新口令则修改"><button class="btn orange" onclick="updateStore(${id},this)">保存</button></div>`)};window.updateStore=async(id,button)=>{const restore=busy(button,'正在保存…');const body={name:$('#e_name').value,address:$('#e_addr').value,managerName:$('#e_manager').value};if($('#e_code').value)body.code=$('#e_code').value;try{await api('/stores/'+id,{method:'PATCH',body:JSON.stringify(body)});closeModal();toast('门店已更新');await load()}catch(e){toast('门店保存失败：'+e.message)}finally{restore()}};
function goalModal(){const stores=state.stores.filter(s=>s.status==='active');modal(`<div class="sectionTitle"><h2>下发月实收目标</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><select class="input" id="g_store">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input class="input" id="g_month" value="${state.month}"><input class="input" id="g_value" type="number" value="300000" placeholder="月实收金额目标"><span class="templateHint">目标口径：日报“实收金额（实际到账）”，不是总营业额</span><select class="input" id="g_rule"><option value="average">按天平均</option><option value="weekendWeight">周末权重</option></select><button class="btn orange" onclick="saveGoal()">保存并下发</button></div>`)}window.goalModal=goalModal;window.saveGoal=async()=>{try{await api('/goals',{method:'POST',body:JSON.stringify({storeId:Number($('#g_store').value),month:$('#g_month').value,goalValue:Number($('#g_value').value),rule:$('#g_rule').value})});closeModal();toast('月目标已下发');await load()}catch(e){toast(e.message)}};
function exportCsv(){location.href='/api/export/reports.csv?month='+state.month+'&token='+encodeURIComponent(localStorage.token)}
const socket=io();let syncReloadTimer=0;socket.on('data:changed',()=>{if(!localStorage.token)return;clearTimeout(syncReloadTimer);syncReloadTimer=setTimeout(()=>load().catch(()=>{}),180)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if(localStorage.token)load().catch(e=>{localStorage.removeItem('token');try{login();toast(e.message||'登录已失效，请重新登录')}catch(_){location.reload()}});else login();setTimeout(()=>{if(document.querySelector('.bootScreen')){localStorage.removeItem('token');login()}},8000);
</script></body></html>
