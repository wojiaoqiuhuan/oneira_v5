.sidebar .nav{background:var(--paper);border:1px solid rgba(255,255,255,.52);box-shadow:var(--shadow);border-radius:24px}.sidebar .nav button{color:var(--muted)}.sidebar .nav button.on{background:var(--orange);color:#fff;box-shadow:inset 2px 2px 5px rgba(255,255,255,.2),6px 7px 14px rgba(145,121,203,.45)}.sidebar .nav button.on .icon{color:#fff}.mobileNav{background:rgba(235,234,244,.92);border-color:rgba(255,255,255,.76);box-shadow:8px 10px 24px rgba(171,169,193,.60),-7px -7px 18px rgba(255,255,255,.84)}.mobileNav button.on{background:var(--orange);box-shadow:inset 2px 2px 4px rgba(255,255,255,.2),4px 5px 10px rgba(145,121,203,.42)}.mobileNav button.on .icon{color:#fff}

.barTrack,.rankTrack,.barLine{background:#dcdbe7;box-shadow:inset 2px 2px 4px rgba(168,166,188,.45),inset -2px -2px 4px rgba(255,255,255,.66)}.barFill,.rankTrack i,.barLine i{background:linear-gradient(180deg,#856be5,#6747c4)}.rankNo{background:#deddea;color:var(--muted);box-shadow:inset 2px 2px 4px rgba(170,168,190,.45),inset -2px -2px 4px rgba(255,255,255,.7)}.rankRow:first-child .rankNo{background:var(--orange);color:#fff}.day{background:var(--paper);border-color:transparent;box-shadow:5px 5px 12px rgba(171,169,193,.34),-4px -4px 10px rgba(255,255,255,.72)}.day:hover{background:var(--paper-2);border-color:transparent;box-shadow:8px 9px 18px rgba(171,169,193,.48),-6px -6px 14px rgba(255,255,255,.9)}.day.today{background:var(--orange-soft);box-shadow:inset 2px 2px 5px rgba(164,142,213,.23),inset -2px -2px 5px rgba(255,255,255,.82)}.heroNote{background:var(--orange-soft);border-color:transparent;color:var(--blue);box-shadow:inset 3px 3px 7px rgba(164,142,213,.25),inset -3px -3px 7px rgba(255,255,255,.8)}.detailItem,.computed{background:#e3e2ed;border-color:transparent;box-shadow:inset 2px 2px 5px rgba(170,168,190,.42),inset -2px -2px 5px rgba(255,255,255,.68)}.modal{background:rgba(52,44,82,.34)}.modalbox{background:var(--paper);border-color:rgba(255,255,255,.72);box-shadow:18px 18px 48px rgba(82,72,119,.38),-12px -12px 32px rgba(255,255,255,.76)}.toast{background:var(--ink);box-shadow:8px 8px 18px rgba(105,93,145,.38),-5px -5px 12px rgba(255,255,255,.45)}

<body><div id="app"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);const icon=(name)=>{const p={store:'<path d="M3 10h18l-2-6H5z"/><path d="M4 10v10h16V10M9 20v-6h6v6"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18"/>',report:'<path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 8h10M7 12h10M7 16h6"/>',issue:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.2 9.2 0 0 1-3.7-.8L3 21l1.9-4A8.2 8.2 0 0 1 3 11.5a8.5 8.5 0 0 1 18 0Z"/><path d="M12 8v4M12 15h.01"/>',settings:'<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1-1.7 3-2-.8a8 8 0 0 1-1.5.9l-.3 2.1h-3.5l-.3-2.1a8 8 0 0 1-1.5-.9l-2 .8-1.7-3 .1-.1 1.7-1.3a8 8 0 0 1 0-1.8L5 10.6l1.7-3 2 .8a8 8 0 0 1 1.5-.9l.3-2.1H14l.3 2.1a8 8 0 0 1 1.5.9l2-.8 1.7 3-1.7 1.3a8 8 0 0 1 0 1.8Z"/>',money:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M17 15h.01M12 9v6M9.5 11h5"/>',orders:'<path d="M5 4h14l1 16H4L5 4Z"/><path d="M9 8a3 3 0 0 0 6 0"/>',waste:'<path d="M4 7h16M10 11v5M14 11v5M6 7l1 14h10l1-14M9 7V4h6v3"/>',member:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M16 14a5 5 0 0 1 5 5"/>',trend:'<path d="M4 17 9 12l4 3 7-8"/><path d="M16 7h4v4"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',filter:'<path d="M4 5h16M7 12h10M10 19h4"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};return '<span class="icon"><svg viewBox="0 0 24 24">'+(p[name]||p.chart)+'</svg></span>'};
const api=async(u,o={})=>{const r=await fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.token||''),...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'请求失败');return d};
let state={user:null,tab:'home',month:new Date().toISOString().slice(0,7),stores:[],fields:[],reports:[],tasks:[],issues:[],goals:[],users:[],audit:[],analytics:null,analyticsFrom:'',analyticsTo:'',analyticsStore:'all',metric:'revenue',calendarStore:'all',reportDraftDate:'',reportDraft:null,reportStoreId:null,adminReports:[]};
const standardFields=[['totalRevenue','总营业额','元',true],['discounts','优惠/折扣券合计','元',false],['received','实收金额（实际到账）','元',false],['onlineMeituanGroup','美团团购','元',false],['onlineMeituanDelivery','美团外卖','元',false],['onlineDouyinGroup','抖音团购','元',false],['onlineTaobaoFlash','淘宝闪购','元',false],['platformTotal','合计平台收入','元',false],['memberCardConsumption','会员卡消费','元',false],['memberCardRecharge','会员卡充值','元',false],['cash','现金','元',false],['onsiteDigital','微信/支付宝/云闪付到店','元',false],['trialCount','试吃数量','个',false],['wasteCount','报损数量','个',false],['trialAmount','试吃金额','元',false],['trialRatio','试吃占比','%',false],['wasteAmount','报损金额','元',false],['wasteRatio','报损占比','%',false],['physicalCardBalance','会员实体卡余量','张',false],['eggTartGiftCount','蛋挞抖音赠送','个',false],['eggTartGiftAmount','蛋挞赠送金额','元',false],['orders','订单量','单',false],['members','会员新增','人',false]];
function templateFields(){const map=new Map(state.fields.map(f=>[f.key,f]));const canonical=state.fields.some(f=>standardFields.some(x=>x[0]===f.key));const standard=standardFields.filter(([key])=>!canonical||map.has(key)).map(([key,label,unit,required],i)=>{const f=map.get(key)||map.get(key==='totalRevenue'?'revenue':key==='wasteRatio'?'wasteRate':'');return {...(f||{}),key,label:f?.label||label,unit:f?.unit||unit,field_type:f?.field_type||'number',required:f?.required??required,sort_order:i+1}});return standard.concat(state.fields.filter(f=>!standardFields.some(x=>x[0]===f.key)&&!['revenue','wasteRate'].includes(f.key)))}
function fieldMeta(key,label,unit){const canonical=state.fields.some(f=>standardFields.some(x=>x[0]===f.key));if(canonical&&!state.fields.some(f=>f.key===key))return {disabled:true,label,unit};const f=state.fields.find(x=>x.key===key)||state.fields.find(x=>key==='totalRevenue'&&x.key==='revenue')||state.fields.find(x=>key==='wasteRatio'&&x.key==='wasteRate');return {disabled:false,label:f?.label||label,unit:f?.unit||unit}}
const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const money=x=>'¥'+Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:0});const num=x=>Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:1});const today=()=>new Date().toISOString().slice(0,10);const monthStart=()=>today().slice(0,7)+'-01';
function busy(button,label){if(!button)return ()=>{};const old=button.innerHTML;button.disabled=true;button.dataset.busyOld=old;button.textContent=label;button.style.opacity='.7';return ()=>{button.disabled=false;button.innerHTML=button.dataset.busyOld||old;button.style.opacity='1'}}function toast(text){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=text;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2200)}function closeModal(){$('#modal')?.classList.remove('show')}function modal(html){$('#modalbox').innerHTML=html;$('#modal').classList.add('show')}
async function load(){try{state.user=(await api('/me')).user;const calendarScope=state.user.role!=='store'&&state.calendarStore!=='all'?`&storeId=${encodeURIComponent(state.calendarStore)}`:'';const adminCalls=state.user.role==='admin'?[api('/users'),api('/audit'),api('/reports')]:[Promise.resolve([]),Promise.resolve([]),Promise.resolve([])];const [fields,stores,reports,tasks,issues,goals,users,audit,adminReports]=await Promise.all([api('/report-fields'),state.user.role==='store'?Promise.resolve([]):api('/stores'),api('/reports?month='+state.month+calendarScope),api('/tasks?month='+state.month+calendarScope),api('/issues'),api('/goals?month='+state.month+calendarScope),...adminCalls]);state.fields=fields;state.stores=stores;state.reports=reports;state.tasks=tasks;state.issues=issues;state.goals=goals;state.users=users;state.audit=audit;state.adminReports=adminReports;render();if(state.user.role!=='store'){loadAnalytics().then(()=>state.user&&render()).catch(e=>toast('经营分析后台加载失败：'+e.message))}}catch(e){localStorage.removeItem('token');login();toast(e.message)}}
async function loadAnalytics(){const from=state.analyticsFrom||monthStart(),to=state.analyticsTo||today();state.analytics=await api(`/analytics?from=${from}&to=${to}&storeId=${encodeURIComponent(state.analyticsStore)}&metric=${state.metric}`);state.analyticsFrom=from;state.analyticsTo=to}
function login(){document.body.innerHTML=`<main class="login"><section class="loginbox"><div class="logoMark"><span class="logoIcon">${icon('store')}</span>ONEIRA</div><div class="eyebrow" style="margin-top:12px">OPERATIONS OS · V5.2</div><h1>让每一家门店<br><span style="color:var(--orange)">经营得更清楚。</span></h1><div class="tabs"><button class="on" id="ts">店长</button><button id="to">运营</button><button id="ta">管理员</button></div><div id="lf" class="form"></div><div id="loginNotice" class="loginNotice" role="status" aria-live="polite"></div></section></main>`;let mode='store';const draw=()=>{$('#lf').innerHTML=mode==='store'?`<select class="input" id="store"><option value="">正在加载门店…</option></select><input class="input" id="name" placeholder="本次提交姓名（可任意填写）"><input class="input" id="code" placeholder="门店口令"><button id="loginBtn" class="btn orange" onclick="doLogin('store')">进入工作台 ${icon('arrow')}</button>`:`<input class="input" id="name" placeholder="账号"><input class="input" id="password" type="password" placeholder="密码"><button id="loginBtn" class="btn orange" onclick="doLogin('${mode}')">登录 ${icon('arrow')}</button>`};api('/public/stores').then(stores=>{const select=$('#store');if(select)select.innerHTML='<option value="">请选择门店</option>'+stores.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}).catch(()=>{const select=$('#store');if(select)select.innerHTML='<option value="">门店列表加载失败，请刷新</option>'});[['ts','store'],['to','ops'],['ta','admin']].forEach(([id,m])=>{$('#'+id).onclick=()=>{mode=m;['ts','to','ta'].forEach(x=>$('#'+x).classList.remove('on'));$('#'+id).classList.add('on');draw()}});draw()}
window.doLogin=async role=>{const notice=$('#loginNotice'),button=$('#loginBtn');if(button?.disabled)return;if(notice){notice.className='loginNotice';notice.textContent='正在验证登录信息…'}if(button){button.disabled=true;button.style.opacity='.65'}try{const body=role==='store'?{storeName:$('#store').value,name:$('#name').value,code:$('#code').value}:{name:$('#name').value,password:$('#password').value,role};const d=await api('/auth/'+(role==='store'?'store-login':'staff-login'),{method:'POST',body:JSON.stringify(body)});if(notice){notice.className='loginNotice success';notice.textContent='登录成功，正在进入工作台…'}localStorage.token=d.token;await new Promise(r=>setTimeout(r,350));await load()}catch(e){if(notice){notice.className='loginNotice error';notice.textContent='登录失败：'+(e.message||'账号或密码错误')}if(button){button.disabled=false;button.style.opacity='1'}}};
function navItem(key,label,ico,show=true){return show?`<button class="${state.tab===key?'on':''}" onclick="tab('${key}')">${icon(ico)}${label}</button>`:''}
function render(){const u=state.user;const links=`${navItem('home','总览','chart')}${u.role==='store'?navItem('report','今日日报','report'):u.role==='admin'?navItem('report','日报编辑','report'):navItem('analytics','经营分析','trend')}${navItem('calendar','目标月历','calendar')}${navItem('issues','反馈中心','issue')}${u.role==='admin'?navItem('admin','系统管理','settings'):''}`;document.body.innerHTML=`<div class="shell"><header class="top"><div class="brandline"><span class="logoIcon">${icon('store')}</span><div><strong>ONEIRA</strong><small>OPERATIONS OS · 连锁经营控制室</small></div></div><div class="topright"><span class="chip"><i class="syncDot"></i>数据已同步</span><span class="chip roleChip">${esc(u.name)} · ${u.role==='store'?'店长':u.role==='ops'?'运营':'管理员'}</span><button class="chip refreshChip" onclick="refreshData(this)"><span aria-hidden="true">↻</span> 刷新数据</button><button class="chip" onclick="logout()">${icon('logout')}退出</button></div></header><aside class="sidebar"><div class="sideCaption">工作台</div><nav class="nav">${links}</nav><div class="sideMeta"><span class="syncDot"></span><span>实时数据同步</span><small>ONEIRA · 运营控制室</small></div></aside><nav class="mobileNav">${links}</nav><main class="content" id="content"></main></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>`;view()}
function view(){const c=$('#content');if(state.tab==='home')home(c);else if(state.tab==='report'&&['store','admin'].includes(state.user.role))report(c);else if(state.tab==='analytics'&&state.user.role!=='store')analytics(c);else if(state.tab==='calendar')calendar(c);else if(state.tab==='issues')issues(c);else if(state.tab==='admin'&&state.user.role==='admin')admin(c);else{state.tab='home';home(c)}}
function tab(x){state.tab=x;render()}window.refreshData=async button=>{const restore=busy(button,'刷新中…');try{await load();toast('数据已刷新')}catch(e){toast('刷新失败：'+e.message)}finally{restore()}};function logout(){localStorage.removeItem('token');location.reload()}
function stat(label,value,sub,ico,theme=''){return `<div class="card stat"><span class="statIcon ${theme}">${icon(ico)}</span><div><label>${label}</label><b>${value}</b><small>${sub||''}</small></div></div>`}
function home(c){const rev=state.reports.reduce((s,r)=>s+Number(r.payload?.totalRevenue??r.payload?.revenue??0),0),done=state.tasks.filter(x=>x.status==='done').length,pending=state.issues.filter(x=>x.status==='pending').length;const ops=state.user.role!=='store';const a=state.analytics||{totals:{revenue:0,orders:0,wasteRate:0,members:0},byStore:[],byDay:[],from:'',to:''};const top=a.byStore[0];c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}</div><h1>${ops?'今天，先看变化。':'今天，先把日报填好。'}</h1><p>${ops?'看哪家门店需要支援，再把目标落到每天。':'日报、目标和反馈，在一个工作台里保持一致。'}</p></div><div class="headActions"><button class="btn orange" onclick="tab('${ops?'analytics':'report'}')">${icon(ops?'trend':'report')}${ops?'查看经营分析':'填写今日日报'}</button></div></section><section class="grid">${ops&&a?stat('分析期营业额',money(a.totals.revenue),`${a.from} 至 ${a.to}`,'money'):stat(state.month+' 营业额',money(rev),'来自已提交日报','money')}${ops&&a?stat('订单数',num(a.totals.orders),'全部门店合计','orders','blue'):stat('任务完成',`${done}/${state.tasks.length}`,'日报自动回填','trend','blue')}${ops&&a?stat('平均损耗率',num(a.totals.wasteRate)+'%','按门店平均','waste','red'):stat('待处理反馈',pending,'运营处理中心','issue','red')}${ops&&a?stat('会员新增',num(a.totals.members),'分析期合计','member','green'):stat('覆盖门店','1','当前门店数据','store','green')}</section>${ops?`<div class="split"><section class="card"><div class="sectionTitle"><h2>${icon('trend')} 门店营业额排行</h2><button class="btn light small" onclick="tab('analytics')">查看明细 ${icon('arrow')}</button></div>${ranking(a.byStore,'revenue')}</section><section class="card"><div class="sectionTitle"><h2>${icon('issue')} 待处理反馈</h2></div>${state.issues.filter(x=>x.status==='pending').slice(0,4).map(i=>`<div class="rankRow"><span class="rankNo">!</span><span class="rankName">${esc(i.store_name)}</span><span class="rankName">${esc(i.content)}</span><span class="pill red">待处理</span></div>`).join('')||'<div class="empty">当前没有待处理反馈</div>'}</section></div>`:`<section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('report')} 近期日报</h2><span class="muted">${state.month}</span></div><div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>营业额</th><th>客单量</th><th>状态</th></tr></thead><tbody>${state.reports.slice(0,12).map(r=>`<tr><td>${r.report_date}</td><td>${money(r.payload?.totalRevenue??r.payload?.revenue)}</td><td>${num(r.payload?.orders)} 单</td><td><span class="pill">已提交</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">本月还没有日报</td></tr>'}</tbody></table></div></section>`}`}
function metricValue(row,metric){return metric==='orders'?Number(row.orders||0):metric==='wasteRate'?Number(row.wasteRate||0):metric==='members'?Number(row.members||0):Number(row.revenue||0)}function metricLabel(metric){return metric==='orders'?'客单量':metric==='wasteRate'?'损耗率':metric==='members'?'会员新增':'营业额'}function metricDisplay(v,metric){return metric==='revenue'?money(v):metric==='wasteRate'?num(v)+'%':num(v)+(metric==='orders'?' 单':' 人')}
function ranking(rows,metric){if(!rows?.length)return '<div class="empty">当前筛选范围暂无数据</div>';const max=Math.max(...rows.map(x=>metricValue(x,metric)),1);return `<div class="ranking">${rows.slice(0,8).map((r,i)=>{const v=metricValue(r,metric);return `<div class="rankRow"><span class="rankNo">${i+1}</span><span class="rankName">${esc(r.storeName)}</span><span class="rankTrack"><i style="width:${Math.round(v/max*100)}%"></i></span><span class="rankValue">${metricDisplay(v,metric)}</span></div>`}).join('')}</div>`}
function bars(rows,metric){if(!rows?.length)return '<div class="empty">当前时段暂无日报数据</div>';const max=Math.max(...rows.map(x=>Number(x[metric==='wasteRate'?'wasteRate':metric]||0)),1);const short=rows.length>14?rows.filter((_,i)=>i%Math.ceil(rows.length/14)===0):rows;return `<div class="bars">${short.map(r=>{const v=Number(r[metric==='wasteRate'?'wasteRate':metric]||0);return `<div class="barItem"><em>${r.day.slice(5)}</em><div class="barTrack"><i class="barFill" style="height:${Math.max(3,Math.round(v/max*100))}%"></i></div><small>${metricDisplay(v,metric)}</small></div>`}).join('')}</div>`}
function analytics(c){const a=state.analytics||{totals:{},byStore:[],byDay:[]};c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">运营中心 · 数据驾驶舱</div><h1>经营分析</h1><p>按门店、按时段看清收入、订单、损耗和会员变化。</p></div><div class="headActions"><button class="btn light" onclick="exportCsv()">导出 CSV</button></div></section><section class="filters"><input class="input" type="date" id="afrom2" value="${a.from}" onchange="applyAnalytics()"><input class="input" type="date" id="ato" value="${a.to}" onchange="applyAnalytics()"><select class="input" id="astore" onchange="applyAnalytics()"><option value="all" ${state.analyticsStore==='all'?'selected':''}>全部门店</option>${state.stores.map(s=>`<option value="${s.id}" ${String(state.analyticsStore)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select class="input" id="ametric" onchange="applyAnalytics()"><option value="revenue" ${state.metric==='revenue'?'selected':''}>营业额排行</option><option value="orders" ${state.metric==='orders'?'selected':''}>客单量排行</option><option value="wasteRate" ${state.metric==='wasteRate'?'selected':''}>损耗率排行</option><option value="members" ${state.metric==='members'?'selected':''}>会员新增排行</option></select></section><section class="grid">${stat('营业额',money(a.totals.revenue),'筛选期合计','money')}${stat('客单量',num(a.totals.orders),'订单总量','orders','blue')}${stat('平均客单价',money(a.totals.avgOrderValue),'营业额 ÷ 客单量','chart','green')}${stat('会员新增',num(a.totals.members),'筛选期合计','member','orange')}</section><div class="split"><section class="card chart"><div class="sectionTitle"><h2>${icon('trend')} ${metricLabel(state.metric)}趋势</h2><span class="muted">按日汇总</span></div>${bars(a.byDay,state.metric)}</section><section class="card"><div class="sectionTitle"><h2>${icon('store')} 各店${metricLabel(state.metric)}排行</h2><span class="muted">Top 8</span></div>${ranking(a.byStore,state.metric)}</section></div><section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('chart')} 门店汇总明细</h2><span class="muted">${a.from} 至 ${a.to}</span></div><div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>营业额</th><th>客单量</th><th>客单价</th><th>损耗率</th><th>会员新增</th><th>日报天数</th></tr></thead><tbody>${a.byStore.map(r=>`<tr><td><b>${esc(r.storeName)}</b></td><td>${money(r.revenue)}</td><td>${num(r.orders)}</td><td>${money(r.avgOrderValue)}</td><td><span class="pill ${r.wasteRate>5?'red':'orange'}">${num(r.wasteRate)}%</span></td><td>${num(r.members)}</td><td>${r.reportDays}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">当前筛选范围暂无数据</td></tr>'}</tbody></table></div></section>`}
window.applyAnalytics=async()=>{const from=$('#afrom2').value,to=$('#ato').value;if(!from||!to)return toast('请选择完整日期范围');state.analyticsFrom=from;state.analyticsTo=to;state.analyticsStore=$('#astore').value;state.metric=$('#ametric').value;try{await loadAnalytics();render()}catch(e){toast(e.message)}};
function round2(v){return Math.round(Number(v||0)*100)/100}
function nval(v){if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(/[￥¥,%，\s]/g,''));return Number.isFinite(n)?n:null}
function calcReport(p={}){const total=nval(p.totalRevenue??p.revenue),discount=nval(p.discounts);if(total!==null){p.totalRevenue=round2(total);p.revenue=round2(total)}if(total!==null&&discount!==null){p.received=round2(total-discount)}const platformKeys=['onlineMeituanGroup','onlineMeituanDelivery','onlineDouyinGroup','onlineTaobaoFlash'];if(platformKeys.some(k=>nval(p[k])!==null))p.platformTotal=round2(platformKeys.reduce((sum,k)=>sum+(nval(p[k])||0),0));if(nval(p.trialAmount)!==null&&total>0)p.trialRatio=round2(nval(p.trialAmount)/(nval(p.trialAmount)+(nval(p.wasteAmount)||0)+total)*100);if(nval(p.wasteAmount)!==null&&total>0)p.wasteRatio=round2(nval(p.wasteAmount)/((nval(p.trialAmount)||0)+(nval(p.wasteAmount)||0)+total)*100);p.wasteRate=p.wasteRatio??p.wasteRate??0;return p}
function extractNumber(text,label){const r=new RegExp(label+'[^\\d-]*(-?[\\d,]+(?:\\.\\d+)?)','i').exec(text);return r?nval(r[1]):null}
function parseDailyTemplate(text){const raw=String(text||'').replace(/\r/g,'');const dateMatch=raw.match(/(\d{1,2})月(\d{1,2})日/);const date=dateMatch?`${new Date().getFullYear()}-${String(Number(dateMatch[1])).padStart(2,'0')}-${String(Number(dateMatch[2])).padStart(2,'0')}`:today();const p={totalRevenue:extractNumber(raw,'总营业额'),discounts:extractNumber(raw,'优惠\\s*[\\/]?\\s*折扣券合计'),received:extractNumber(raw,'实收金额(?:（实际到账）)?'),onlineMeituanGroup:extractNumber(raw,'美团团购'),onlineMeituanDelivery:extractNumber(raw,'美团外卖'),onlineDouyinGroup:extractNumber(raw,'抖音团购'),onlineTaobaoFlash:extractNumber(raw,'淘宝闪购'),memberCardConsumption:extractNumber(raw,'会员卡消费'),memberCardRecharge:extractNumber(raw,'会员卡充值'),cash:extractNumber(raw,'现金'),onsiteDigital:extractNumber(raw,'微信\\/支付宝\\/云闪付到店'),trialCount:extractNumber(raw,'试吃数量'),wasteCount:extractNumber(raw,'报损数量'),trialAmount:extractNumber(raw,'试吃金额'),wasteAmount:extractNumber(raw,'报损金额'),physicalCardBalance:extractNumber(raw,'会员实体卡余量'),orders:extractNumber(raw,'订单量'),members:extractNumber(raw,'会员新增')};const egg=/蛋挞抖音赠送[^\n]*?[:：]\s*([\d,]+)[^\n]*?金额[:：]\s*([\d,.]+)/i.exec(raw);if(egg){p.eggTartGiftCount=nval(egg[1]);p.eggTartGiftAmount=nval(egg[2])}return {date,payload:calcReport(p)}}
function reportTemplate(p={},date=today()){const d=new Date(date+'T00:00:00');const day=`${d.getMonth()+1}月${d.getDate()}日`;const v=k=>p[k]??'';return `【${state.user?.storeName||'门店'} ${day}营业日报】\n\n1.整体营收\n总营业额：${v('totalRevenue')}\n优惠/折扣券合计：${v('discounts')}\n实收金额（实际到账）：${v('received')}\n\n2.收入途径明细\n\n①线上渠道\n美团团购：${v('onlineMeituanGroup')}\n美团外卖：${v('onlineMeituanDelivery')}\n抖音团购：${v('onlineDouyinGroup')}\n淘宝闪购：${v('onlineTaobaoFlash')}\n合计平台收入：${v('platformTotal')}\n\n②储值&会员卡\n会员卡消费：${v('memberCardConsumption')}\n会员卡充值：${v('memberCardRecharge')}\n\n③线下收款\n现金：${v('cash')}\n微信/支付宝/云闪付到店：${v('onsiteDigital')}\n\n④试吃与报损\n试吃数量：${v('trialCount')}\n报损数量：${v('wasteCount')}\n试吃金额：${v('trialAmount')}\n试吃占比：${v('trialRatio')}%\n报损金额：${v('wasteAmount')}\n报损占比：${v('wasteRatio')}%\n\n会员实体卡余量：${v('physicalCardBalance')}\n蛋挞抖音赠送：${v('eggTartGiftCount')} 金额：${v('eggTartGiftAmount')}\n（附报损、试吃、结班单）`}

function fieldMetaInput(key,label,value,unit='',computed=false,type='number'){const m=fieldMeta(key,label,unit);return m.disabled?'':fieldInput('r_'+key,m.label,value,m.unit,computed,type)}
function fieldInput(id,label,value,unit='',computed=false,type='number'){return `<label class="label"><span>${label}${unit?` <small class="muted">${unit}</small>`:''}</span><input class="input ${computed?'computed':''}" id="${id}" type="${type}" value="${esc(value??'')}" ${computed?'readonly':''} oninput="recalcReportForm()"></label>`}
function adminReportRows(){const q=($('#adminReportSearch')?.value||'').trim().toLowerCase();const store=$('#adminReportStore')?.value||'all';return (state.adminReports||[]).filter(r=>(store==='all'||String(r.store_id)===store)&&(!q||`${r.store_name} ${r.report_date} ${r.submitter_name||''}`.toLowerCase().includes(q))).map(r=>{const p=r.payload||{};return `<tr><td>${esc(r.report_date)}</td><td><b>${esc(r.store_name)}</b></td><td>${money(p.totalRevenue??p.revenue)}</td><td>${money(p.received)}</td><td>${esc(r.submitter_name||'未记录')}</td><td><div class="headActions"><button class="btn light small" onclick="editAdminReport(${r.id})">编辑</button><button class="btn danger small" onclick="deleteAdminReport(${r.id},this)">删除</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">暂无符合条件的已提交日报</td></tr>'}function adminReportHistory(){return `<section class="card reportSection" style="margin-top:12px"><div class="sectionTitle"><div><h2>${icon('report')} 已提交日报管理</h2><div class="templateHint">管理员可查看全部门店日报，并进行编辑、覆盖或删除。</div></div><button class="btn light small" onclick="load()">刷新列表</button></div><div class="filters"><input class="input wide" id="adminReportSearch" placeholder="搜索门店、日期或提交人" oninput="adminReportFilter()"><select class="input" id="adminReportStore" onchange="adminReportFilter()"><option value="all">全部门店</option>${state.stores.map(st=>`<option value="${st.id}">${esc(st.name)}</option>`).join('')}</select></div><div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>门店</th><th>营业额</th><th>实收</th><th>提交人</th><th>操作</th></tr></thead><tbody id="adminReportRows">${adminReportRows()}</tbody></table></div></section>`}window.adminReportFilter=()=>{const el=$('#adminReportRows');if(el)el.innerHTML=adminReportRows()};window.editAdminReport=id=>{const r=(state.adminReports||[]).find(x=>x.id===id);if(!r)return;state.reportStoreId=Number(r.store_id);state.reportDraftDate=r.report_date;state.reportDraft=null;state.tab='report';render()};window.deleteAdminReport=async(id,button)=>{if(!confirm('确定删除这条日报？删除后对应日期的完成数据也会清零。'))return;const restore=busy(button,'删除中…');try{await api('/reports/'+id,{method:'DELETE'});toast('日报已删除');await load()}catch(e){toast('日报删除失败：'+e.message)}finally{restore()}};
function report(c){const adminMode=state.user.role==='admin';if(adminMode&&!state.reportStoreId&&state.stores[0])state.reportStoreId=state.stores[0].id;const date=state.reportDraftDate||today();const selectedStore=adminMode?Number(state.reportStoreId):null;const old=state.reports.find(r=>r.report_date===date&&(!adminMode||Number(r.store_id)===selectedStore));const p=calcReport({...old?.payload,...(state.reportDraft||{})});const baseLabels=['试吃数量','报损数量','试吃金额','试吃占比','报损金额','报损占比','试吃率','报损率'];const standardKeys=new Set(standardFields.map(x=>x[0]));const extras=state.fields.filter(f=>!standardKeys.has(f.key)&&!['revenue','orders','wasteRate','members'].includes(f.key)&&!baseLabels.includes(f.label));c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${date}</div><h1>营业日报</h1><p>${adminMode?'选择门店和日期后，可编辑或覆盖已有营业日报。':'支持整段粘贴导入；所有派生金额和占比会自动计算。'}</p></div><div class="headActions"><button class="btn light small" onclick="openImport()">${icon('report')} 粘贴导入</button><button class="btn light small" onclick="copyReportTemplate()">复制模板</button></div></section><section class="card reportSection"><div class="sectionTitle"><h2>日报日期</h2><div class="headActions">${adminMode?`<select class="input" id="reportStore" onchange="changeReportStore(this.value)">${state.stores.map(st=>`<option value="${st.id}" ${Number(st.id)===selectedStore?'selected':''}>${esc(st.name)}</option>`).join('')}</select>`:''}<input class="input" id="reportDate" type="date" value="${date}" onchange="changeReportDate(this.value)"></div></div><div class="heroNote">自动公式：实收金额 = 总营业额 − 优惠折扣；平台收入 = 四个线上渠道之和；试吃占比 = 试吃金额 ÷（试吃金额 + 报损金额 + 营业额）；报损占比同理。</div></section><section class="card reportSection"><div class="sectionTitle"><h2>整体营收</h2><span class="pill orange">必填总营业额</span></div><div class="reportGrid">${fieldMetaInput('totalRevenue','总营业额',p.totalRevenue,'元')}${fieldMetaInput('discounts','优惠/折扣券合计',p.discounts,'元')}${fieldMetaInput('received','实收金额（实际到账）',p.received,'元',true)}</div></section><section class="card reportSection"><div class="sectionTitle"><h2>收入途径明细</h2><span class="muted">金额单位：元</span></div><div class="reportGrid">${fieldMetaInput('onlineMeituanGroup','美团团购',p.onlineMeituanGroup)}${fieldMetaInput('onlineMeituanDelivery','美团外卖',p.onlineMeituanDelivery)}${fieldMetaInput('onlineDouyinGroup','抖音团购',p.onlineDouyinGroup)}${fieldMetaInput('onlineTaobaoFlash','淘宝闪购',p.onlineTaobaoFlash)}${fieldMetaInput('platformTotal','合计平台收入',p.platformTotal,'元',true)}${fieldMetaInput('memberCardConsumption','会员卡消费',p.memberCardConsumption)}${fieldMetaInput('memberCardRecharge','会员卡充值',p.memberCardRecharge)}${fieldMetaInput('cash','现金',p.cash)}${fieldMetaInput('onsiteDigital','微信/支付宝/云闪付到店',p.onsiteDigital)}</div></section><section class="card reportSection"><div class="sectionTitle"><h2>试吃与报损</h2><span class="muted">数量、金额和占比</span></div><div class="reportGrid">${fieldMetaInput('trialCount','试吃数量',p.trialCount,'个')}${fieldMetaInput('wasteCount','报损数量',p.wasteCount,'个')}${fieldMetaInput('trialAmount','试吃金额',p.trialAmount,'元')}${fieldMetaInput('trialRatio','试吃占比',p.trialRatio,'%',true)}${fieldMetaInput('wasteAmount','报损金额',p.wasteAmount,'元')}${fieldMetaInput('wasteRatio','报损占比',p.wasteRatio,'%',true)}</div></section><section class="card reportSection"><div class="sectionTitle"><h2>会员与补充指标</h2><span class="muted">可选</span></div><div class="reportGrid">${fieldMetaInput('physicalCardBalance','会员实体卡余量',p.physicalCardBalance,'张')}${fieldMetaInput('eggTartGiftCount','蛋挞抖音赠送',p.eggTartGiftCount,'个')}${fieldMetaInput('eggTartGiftAmount','蛋挞赠送金额',p.eggTartGiftAmount,'元')}${fieldMetaInput('orders','订单量',p.orders,'单')}${fieldMetaInput('members','会员新增',p.members,'人')}</div>${extras.length?`<div class="reportGrid" style="margin-top:10px">${extras.map(f=>fieldInput('r_'+f.key,f.label,p[f.key],f.unit,false,f.field_type==='number'?'number':'text')).join('')}</div>`:''}</section><section class="card reportSection"><label class="label"><span>备注 / 附件说明</span><textarea class="input" id="r_note" rows="3" placeholder="例如：已附报损、试吃、结班单">${esc(p.note||'')}</textarea></label><div class="headActions" style="margin-top:14px"><button class="btn orange" onclick="submitReport(this)">${old?'覆盖并提交日报':'提交营业日报'}</button><button class="btn light" onclick="copyReportTemplate()">复制导出模板</button></div></section>${adminMode?adminReportHistory():''}`}
function readReportForm(){const v=id=>nval($('#r_'+id)?.value);const p={totalRevenue:v('totalRevenue'),discounts:v('discounts'),received:v('received'),onlineMeituanGroup:v('onlineMeituanGroup'),onlineMeituanDelivery:v('onlineMeituanDelivery'),onlineDouyinGroup:v('onlineDouyinGroup'),onlineTaobaoFlash:v('onlineTaobaoFlash'),memberCardConsumption:v('memberCardConsumption'),memberCardRecharge:v('memberCardRecharge'),cash:v('cash'),onsiteDigital:v('onsiteDigital'),trialCount:v('trialCount'),wasteCount:v('wasteCount'),trialAmount:v('trialAmount'),trialRatio:v('trialRatio'),wasteAmount:v('wasteAmount'),wasteRatio:v('wasteRatio'),physicalCardBalance:v('physicalCardBalance'),eggTartGiftCount:v('eggTartGiftCount'),eggTartGiftAmount:v('eggTartGiftAmount'),orders:v('orders'),members:v('members'),note:$('#r_note')?.value||''};for(const f of state.fields.filter(f=>!['revenue','orders','wasteRate','members'].includes(f.key))){const el=$('#r_'+f.key);if(el)p[f.key]=f.field_type==='number'?nval(el.value):el.value}return calcReport(p)}
function collectReportForm(show=true){const p=readReportForm();if(show&&p.totalRevenue===null)return toast('请填写总营业额');return p}
window.recalcReportForm=()=>{const p=readReportForm();const set=(id,v)=>{const e=$('#r_'+id);if(e)e.value=v??''};set('received',p.received);set('platformTotal',p.platformTotal);set('trialRatio',p.trialRatio);set('wasteRatio',p.wasteRatio)};
window.changeReportDate=date=>{state.reportDraftDate=date;state.reportDraft=null;render()};window.changeReportStore=storeId=>{state.reportStoreId=Number(storeId);state.reportDraft=null;render()};
window.submitReport=async button=>{const date=$('#reportDate')?.value||today();const adminMode=state.user.role==='admin';const storeId=adminMode?Number($('#reportStore')?.value||state.reportStoreId):null;const old=state.reports.find(r=>r.report_date===date&&(!adminMode||Number(r.store_id)===storeId));if(old&&!confirm('该日期已有日报，是否覆盖？'))return;const payload=collectReportForm(true);if(!payload)return;const restore=busy(button,'正在提交…');try{const body={date,payload};if(adminMode)body.storeId=storeId;await api('/reports',{method:'POST',body:JSON.stringify(body)});toast('营业日报已提交，日历和运营看板已同步');state.reportDraft=null;state.reportDraftDate='';state.tab=adminMode?'report':'home';await load()}catch(e){toast('日报提交失败：'+e.message)}finally{restore()}};
function dayStats(date){const rows=state.reports.filter(r=>r.report_date===date);const total=rows.reduce((s,r)=>s+Number(r.payload?.totalRevenue??r.payload?.revenue??0),0);const received=rows.reduce((s,r)=>s+Number(r.payload?.received||0),0);const tasks=state.tasks.filter(t=>t.task_date===date);return {submitted:rows.length,total,received,target:tasks.reduce((s,t)=>s+Number(t.target_value||0),0),actual:tasks.reduce((s,t)=>s+Number(t.actual_value||0),0)}}
function money2(x){return '¥'+Number(x||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2})}
window.dayDetail=date=>{const rows=state.reports.filter(r=>r.report_date===date),x=dayStats(date);if(!rows.length)return modal(`<div class="sectionTitle"><h2>${date} 营业数据</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="empty">当天还没有提交日报${x.target?`<br><span class="muted">目标 ${money2(x.target)}</span>`:''}</div>`);const sum=k=>rows.reduce((a,r)=>a+Number(r.payload?.[k]||0),0);const first=rows[0].payload||{};const item=(label,value,unit='')=>`<div class="detailItem"><small>${label}</small><b>${value===null||value===undefined||value===''?'-':value}${unit}</b></div>`;modal(`<div class="sectionTitle"><div><div class="eyebrow">${date}</div><h2>当日营业数据</h2></div><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="detailGrid">${item('总营业额',money2(x.total))}${item('实收金额',money2(x.received))}${item('平台收入',money2(sum('platformTotal')))}${item('会员卡消费',money2(sum('memberCardConsumption')))}${item('会员卡充值',money2(sum('memberCardRecharge')))}${item('现金',money2(sum('cash')))}${item('到店微信/支付宝/云闪付',money2(sum('onsiteDigital')))}${item('试吃金额',money2(sum('trialAmount')))}${item('试吃占比',Number(sum('trialRatio')).toFixed(2),'%')}${item('报损金额',money2(sum('wasteAmount')))}${item('报损占比',Number(sum('wasteRatio')).toFixed(2),'%')}${item('会员实体卡余量',sum('physicalCardBalance'),' 张')}</div><div class="detailStore"><b>渠道明细</b><div class="templateHint">美团团购 ${money2(sum('onlineMeituanGroup'))} · 美团外卖 ${money2(sum('onlineMeituanDelivery'))} · 抖音团购 ${money2(sum('onlineDouyinGroup'))} · 淘宝闪购 ${money2(sum('onlineTaobaoFlash'))}</div></div>${rows.map(r=>`<div class="detailStore"><b>${esc(r.store_name||state.user.storeName||'本店')}</b><div class="templateHint">试吃 ${num(r.payload?.trialCount)} 个 · 报损 ${num(r.payload?.wasteCount)} 个 · 蛋挞抖音赠送 ${num(r.payload?.eggTartGiftCount)} 个 / ${money2(r.payload?.eggTartGiftAmount)}</div></div>`).join('')}`)}
function calendar(c){const [y,m]=state.month.split('-').map(Number),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),goal=state.goals.reduce((s,g)=>s+Number(g.goal_value||0),0),actual=state.tasks.reduce((s,t)=>s+Number(t.actual_value||0),0),target=goal||state.tasks.reduce((s,t)=>s+Number(t.target_value||0),0),pct=target?Math.round(actual/target*100):0;const isOps=state.user.role!=='store';c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${state.month}</div><h1>目标日历</h1><p>每天提交后，这里直接显示营业额和实收金额。</p></div>${isOps?'<button class="btn orange" onclick="goalModal()">下发 / 编辑月目标</button>':''}</section>${isOps?`<section class="filters"><select class="input" onchange="applyCalendarStore(this.value)"><option value="all" ${state.calendarStore==='all'?'selected':''}>全部门店合计</option>${state.stores.map(s=>`<option value="${s.id}" ${String(state.calendarStore)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select><span class="templateHint">日历会按选择的门店显示每日营收</span></section>`:''}<section class="grid3">${stat('月目标',money(target),'当前范围','money')}${stat('已完成',money(actual),'日报营业额回填','trend','green')}${stat('完成率',pct+'%','目标完成进度','chart','blue')}</section><section class="card" style="margin-top:12px"><div class="sectionTitle"><button class="btn light small" onclick="changeMonth(-1)">‹</button><b style="font-size:20px">${y}年${m}月</b><button class="btn light small" onclick="changeMonth(1)">›</button></div><div class="calendar">${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{const d=`${state.month}-${String(i+1).padStart(2,'0')}`,x=dayStats(d),p=x.target?Math.min(100,Math.round(x.actual/x.target*100)):0;return `<div class="day ${d===today()?'today':''}" onclick="dayDetail('${d}')"><div class="num">${i+1}</div><div class="goal ${x.submitted?'':'muted'}">${x.submitted?'营业额 '+money(x.total):'未提交'}</div>${x.submitted?`<div class="goal">实收 ${money(x.received)}</div>`:''}<div class="goal">${x.target?`目标 ${money(x.target)}`:''}</div>${x.target?`<div class="barLine"><i style="width:${p}%"></i></div>`:''}</div>`}).join('')}</div></section>`}
window.applyCalendarStore=async store=>{state.calendarStore=store;await load()};
window.changeMonth=async d=>{let [y,m]=state.month.split('-').map(Number);m+=d;if(m===0){y--;m=12}if(m===13){y++;m=1}state.month=`${y}-${String(m).padStart(2,'0')}`;await load()};
function issues(c){const store=state.user.role==='store';c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">${store?'门店反馈':'运营中心'}</div><h1>反馈中心</h1><p>${store?'问题提交后，运营会在这里回复处理结果。':'处理门店问题，结果会自动回到店长端。'}</p></div></section>${store?`<section class="card"><div class="form"><select class="input" id="issueType"><option>设备问题</option><option>人员排班</option><option>原料库存</option><option>其他建议</option></select><textarea class="input" id="issueContent" rows="4" placeholder="描述需要协同的问题"></textarea><button class="btn orange" onclick="submitIssue()">提交反馈</button></div></section>`:''}<section class="card" style="margin-top:12px"><div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>类型</th><th>内容</th><th>状态</th><th>处理结果</th><th></th></tr></thead><tbody>${state.issues.map(i=>`<tr><td>${esc(i.store_name||'本店')}</td><td>${esc(i.type)}</td><td>${esc(i.content)}</td><td><span class="pill ${i.status==='pending'?'red':''}">${i.status==='pending'?'待处理':'已解决'}</span></td><td>${esc(i.handling_note||'-')}</td><td>${!store&&i.status==='pending'?`<button class="btn blue small" onclick="resolveIssue(${i.id})">处理</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无反馈</td></tr>'}</tbody></table></div></section>`}
window.submitIssue=async()=>{const content=$('#issueContent').value.trim();if(!content)return toast('请先描述问题');try{await api('/issues',{method:'POST',body:JSON.stringify({type:$('#issueType').value,content})});toast('反馈已提交');await load()}catch(e){toast(e.message)}};window.resolveIssue=async id=>{const note=prompt('处理备注','已处理，请门店关注后续执行。');if(note===null)return;try{await api('/issues/'+id,{method:'PATCH',body:JSON.stringify({note})});toast('反馈已解决');await load()}catch(e){toast(e.message)}};
function admin(c){const fields=templateFields();c.innerHTML=`<section class="pageHead"><div><div class="eyebrow">管理员 · 模板中心</div><h1>日报模板</h1><p>编辑字段名称、单位和必填规则，保存后立即下发到所有店长端。</p></div></section><section class="card"><div class="sectionTitle"><div><h2>${icon('report')} 标准营业日报</h2><div class="templateHint">店长端的粘贴导入、自动计算和复制模板都会使用这里的字段配置。</div></div><button class="btn orange small" onclick="addField()">新增字段</button></div>${fields.map((f,i)=>`<div class="fieldRow"><input class="input" data-label="${i}" value="${esc(f.label)}"><input class="input" data-unit="${i}" value="${esc(f.unit)}" placeholder="单位"><select class="input" data-type="${i}"><option value="number" ${f.field_type==='number'?'selected':''}>数字</option><option value="text" ${f.field_type==='text'?'selected':''}>文字</option></select><label><input type="checkbox" data-req="${i}" ${f.required?'checked':''}> 必填</label><button class="btn light small" onclick="removeField('${esc(f.key)}')">删除</button></div>`).join('')}<button class="btn blue" style="margin-top:14px" onclick="saveFields(this)">保存并下发到店长端</button></section><section class="card" style="margin-top:12px"><div class="sectionTitle"><h2>${icon('store')} 门店与人员</h2><button class="btn orange small" onclick="addStore()">新增门店</button></div><div class="tableWrap"><table class="table"><thead><tr><th>门店</th><th>地址</th><th>店长</th><th>状态</th><th></th></tr></thead><tbody>${state.stores.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.address)}</td><td>${esc(s.manager_name)}</td><td>${s.status}</td><td><button class="btn light small" onclick="editStore(${s.id})">编辑</button></td></tr>`).join('')}</tbody></table></div></section>`}window.addField=()=>{state.fields.push({label:'新字段',key:'field_'+Date.now(),field_type:'number',unit:'',required:false});render()};window.removeField=key=>{if(!confirm('确定删除字段“'+key+'”？保存并下发后，店长端将不再显示该字段。'))return;state.fields=state.fields.filter(f=>f.key!==key);render()};window.saveFields=async button=>{const restore=busy(button,'正在保存并下发…');try{const fields=templateFields().map((f,i)=>({...f,label:document.querySelector(`[data-label="${i}"]`).value,unit:document.querySelector(`[data-unit="${i}"]`).value,field_type:document.querySelector(`[data-type="${i}"]`).value,required:document.querySelector(`[data-req="${i}"]`).checked}));await api('/report-fields',{method:'PUT',body:JSON.stringify({fields})});toast('日报模板已保存并下发到店长端');await load()}catch(e){toast('模板保存失败：'+e.message)}finally{restore()}};
window.addStore=()=>modal(`<div class="sectionTitle"><h2>新增门店</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="s_name" placeholder="门店名称"><input class="input" id="s_addr" placeholder="地址"><input class="input" id="s_manager" placeholder="负责人（可选）"><input class="input" id="s_code" placeholder="门店口令"><button class="btn orange" onclick="createStore(this)">创建</button></div>`);window.createStore=async button=>{const restore=busy(button,'正在创建…');try{await api('/stores',{method:'POST',body:JSON.stringify({name:$('#s_name').value,address:$('#s_addr').value,managerName:$('#s_manager').value,code:$('#s_code').value})});closeModal();toast('门店已创建');await load()}catch(e){toast('门店创建失败：'+e.message)}finally{restore()}};window.editStore=id=>{const s=state.stores.find(x=>x.id===id);modal(`<div class="sectionTitle"><h2>编辑 ${esc(s.name)}</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="e_name" value="${esc(s.name)}"><input class="input" id="e_addr" value="${esc(s.address)}"><input class="input" id="e_manager" value="${esc(s.manager_name)}"><input class="input" id="e_code" placeholder="输入新口令则修改"><button class="btn orange" onclick="updateStore(${id},this)">保存</button></div>`)};window.updateStore=async(id,button)=>{const restore=busy(button,'正在保存…');const body={name:$('#e_name').value,address:$('#e_addr').value,managerName:$('#e_manager').value};if($('#e_code').value)body.code=$('#e_code').value;try{await api('/stores/'+id,{method:'PATCH',body:JSON.stringify(body)});closeModal();toast('门店已更新');await load()}catch(e){toast('门店保存失败：'+e.message)}finally{restore()}};
function goalModal(){const stores=state.stores.filter(s=>s.status==='active');modal(`<div class="sectionTitle"><h2>下发月目标</h2><button class="btn light small" onclick="closeModal()">关闭</button></div><div class="form"><select class="input" id="g_store">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input class="input" id="g_month" value="${state.month}"><input class="input" id="g_value" type="number" value="300000" placeholder="月目标营业额"><select class="input" id="g_rule"><option value="average">按天平均</option><option value="weekendWeight">周末权重</option></select><button class="btn orange" onclick="saveGoal()">保存并下发</button></div>`)}window.goalModal=goalModal;window.saveGoal=async()=>{try{await api('/goals',{method:'POST',body:JSON.stringify({storeId:Number($('#g_store').value),month:$('#g_month').value,goalValue:Number($('#g_value').value),rule:$('#g_rule').value})});closeModal();toast('月目标已下发');await load()}catch(e){toast(e.message)}};
function exportCsv(){location.href='/api/export/reports.csv?month='+state.month+'&token='+encodeURIComponent(localStorage.token)}
const socket=io();socket.on('data:changed',()=>{if(localStorage.token)load().catch(()=>{})});if(localStorage.token)load().catch(()=>{localStorage.removeItem('token');login()});else login();
</script></body></html>
