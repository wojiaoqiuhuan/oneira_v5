<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ONEIRA · V5</title><script src="/socket.io/socket.io.js"></script><style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.82);--text:#1d1d1f;--muted:#86868b;--line:#d2d2d7;--blue:#0071e3;--green:#34c759;--red:#ff3b30;--shadow:0 20px 60px rgba(0,0,0,.07)}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fbfbfd 0,#f5f5f7 55%,#f2f2f4 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:18px 24px 50px}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:22px;letter-spacing:-.8px}.sub{font-size:12px;color:var(--muted)}.topright,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chip{border:1px solid rgba(0,0,0,.07);background:rgba(255,255,255,.7);backdrop-filter:blur(18px);padding:9px 13px;border-radius:999px;font-size:13px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px}.nav{display:flex;gap:5px;padding:8px;background:rgba(255,255,255,.58);border:1px solid rgba(0,0,0,.05);border-radius:18px;backdrop-filter:blur(20px);position:sticky;top:10px;z-index:5}.nav button{border:0;background:transparent;padding:10px 14px;border-radius:12px;color:#444}.nav button.on{background:#1d1d1f;color:white}.hero{padding:55px 5px 35px;display:flex;justify-content:space-between;align-items:end;gap:24px}.eyebrow{color:var(--muted);font-size:14px}.hero h1{font-size:58px;line-height:1.02;letter-spacing:-3px;margin:8px 0}.hero p{font-size:18px;color:var(--muted);margin:0}.btn{border:0;border-radius:999px;padding:12px 18px;background:#1d1d1f;color:#fff}.btn.blue{background:var(--blue)}.btn.light{background:#fff;color:#1d1d1f;border:1px solid var(--line)}.btn.red{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:28px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.kpi b{display:block;font-size:34px;letter-spacing:-1.5px;margin:14px 0 5px}.muted{color:var(--muted)}.section{margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 8px;border-bottom:1px solid #eee;text-align:left}.input{width:100%;border:1px solid var(--line);background:#fff;padding:12px 14px;border-radius:14px;outline:0}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.1)}.form{display:grid;gap:14px}.label{display:grid;gap:7px;font-size:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:125px;background:#f7f7f8;border:1px solid transparent;border-radius:18px;padding:12px;transition:.2s}.day:hover{transform:translateY(-2px);background:#fff;box-shadow:0 8px 25px rgba(0,0,0,.05)}.day.today{border-color:var(--blue);background:#eef6ff}.day .num{font-weight:700}.day .goal{font-size:11px;color:var(--muted);margin-top:16px}.bar{height:6px;background:#e5e5ea;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.monthTitle{font-size:28px;font-weight:700;letter-spacing:-1px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:28px;padding:26px;box-shadow:0 30px 100px rgba(0,0,0,.22)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 18px;border-radius:999px;display:none;z-index:50}.empty{padding:45px;text-align:center;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(460px,100%);background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.06);border-radius:32px;padding:34px;box-shadow:0 30px 100px rgba(0,0,0,.1);backdrop-filter:blur(25px)}.tabs{display:flex;background:#f0f0f2;padding:4px;border-radius:14px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px}.tabs .on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07)}.fieldRow{display:grid;grid-template-columns:1.4fr .8fr .7fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.dangerText{color:var(--red)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:44px}.calendar{gap:5px}.day{min-height:105px;padding:9px}}@media(max-width:600px){.shell{padding:10px 12px 90px}.top{height:auto;padding:8px 0 14px}.topright .chip:nth-child(2){display:none}.nav{overflow:auto;position:static}.nav button{white-space:nowrap}.hero{padding:34px 3px 22px;display:block}.hero h1{font-size:38px}.hero p{font-size:15px;margin-bottom:18px}.grid{grid-template-columns:1fr 1fr}.card{padding:17px;border-radius:21px}.kpi b{font-size:26px}.calendar{grid-template-columns:repeat(7,1fr)}.day{min-height:82px;border-radius:12px;padding:7px}.day .goal{margin-top:8px;font-size:9px}.table{font-size:12px}.table th,.table td{padding:10px 5px}.fieldRow{grid-template-columns:1fr 1fr}.hideMobile{display:none}}
</style></head><body><div id="app"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s),api=async(u,o={})=>{const r=await fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.token||''),...(o.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d};let state={user:null,tab:'home',month:new Date().toISOString().slice(0,7),stores:[],fields:[],reports:[],tasks:[],issues:[],goals:[],users:[],audit:[]};
const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const money=x=>'¥'+Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:0});function toast(x){const e=$('#toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function closeModal(){$('#modal').classList.remove('show')}function modal(html){$('#modalbox').innerHTML=html;$('#modal').classList.add('show')}
async function load(){state.user=(await api('/me')).user;state.fields=await api('/report-fields');state.stores=state.user.role==='store'?[]:await api('/stores');state.reports=await api('/reports?month='+state.month);state.tasks=await api('/tasks?month='+state.month);state.issues=await api('/issues');state.goals=await api('/goals?month='+state.month);if(state.user.role==='admin'){state.users=await api('/users');state.audit=await api('/audit')}render()}
function login(){document.body.innerHTML=`<main class="login"><section class="loginbox"><div class="brand">ONEIRA</div><div class="eyebrow" style="margin-top:8px">连锁烘焙运营 OS · V5</div><h1 style="font-size:40px;letter-spacing:-2px;margin:8px 0">让每一家门店<br>经营得更清楚。</h1><div class="tabs"><button class="on" id="ts">店长</button><button id="to">运营</button><button id="ta">管理员</button></div><div id="lf" class="form"></div></section></main>`;let mode='store';const draw=()=>{$('#lf').innerHTML=mode==='store'?`<input class="input" id="store" placeholder="门店，例如：咸阳店"><input class="input" id="name" placeholder="姓名"><input class="input" id="code" placeholder="门店口令"><button class="btn blue" onclick="doLogin('store')">进入工作台</button>`:`<input class="input" id="name" placeholder="账号"><input class="input" id="password" type="password" placeholder="密码"><button class="btn blue" onclick="doLogin('${mode}')">登录</button>`};$('#ts').onclick=()=>{mode='store';['ts','to','ta'].forEach(x=>$('#'+x).classList.remove('on'));$('#ts').classList.add('on');draw()};$('#to').onclick=()=>{mode='ops';['ts','to','ta'].forEach(x=>$('#'+x).classList.remove('on'));$('#to').classList.add('on');draw()};$('#ta').onclick=()=>{mode='admin';['ts','to','ta'].forEach(x=>$('#'+x).classList.remove('on'));$('#ta').classList.add('on');draw()};draw()}
window.doLogin=async role=>{try{const body=role==='store'?{storeName:$('#store').value,name:$('#name').value,code:$('#code').value}:{name:$('#name').value,password:$('#password').value,role};const d=await api('/auth/'+(role==='store'?'store-login':'staff-login'),{method:'POST',body:JSON.stringify(body)});localStorage.token=d.token;await load()}catch(e){toast(e.message)}};
function render(){const u=state.user;document.body.innerHTML=`<div class="shell"><header class="top"><div><div class="brand">ONEIRA</div><div class="sub">连锁烘焙运营 OS</div></div><div class="topright"><span class="chip"><i class="dot"></i>实时同步</span><span class="chip">${esc(u.name)} · ${u.role==='store'?'店长':u.role==='ops'?'运营':'管理员'}</span><button class="chip" onclick="logout()">退出</button></div></header><nav class="nav"><button class="${state.tab==='home'?'on':''}" onclick="tab('home')">概览</button>${u.role==='store'?'<button class="'+(state.tab==='report'?'on':'')+'" onclick="tab(\'report\')">日报</button>':''}<button class="${state.tab==='calendar'?'on':''}" onclick="tab('calendar')">目标月历</button>${u.role!=='store'?'<button class="'+(state.tab==='issues'?'on':'')+'" onclick="tab(\'issues\')">反馈</button>':''}${u.role==='admin'?'<button class="'+(state.tab==='admin'?'on':'')+'" onclick="tab(\'admin\')">管理</button>':''}</nav><div id="content"></div></div>`;view()}
function tab(x){state.tab=x;render()}function logout(){localStorage.removeItem('token');location.reload()}
function home(c){const rev=state.reports.reduce((s,r)=>s+Number(r.payload?.revenue||0),0),done=state.tasks.filter(x=>x.status==='done').length,pending=state.issues.filter(x=>x.status==='pending').length;c.innerHTML=`<section class="hero"><div><div class="eyebrow">${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}</div><h1>${state.user.role==='store'?'今天，先把日报填好。':'今天，经营得怎么样？'}</h1><p>所有关键数据，在一个工作台里保持一致。</p></div><button class="btn blue" onclick="tab('${state.user.role==='store'?'report':'calendar'}')">${state.user.role==='store'?'填写今日日报':'查看目标月历'}</button></section><section class="grid"><div class="card kpi"><span class="muted">${state.month} 营业额</span><b>${money(rev)}</b><small class="muted">来自已提交日报</small></div><div class="card kpi"><span class="muted">任务完成</span><b>${done}/${state.tasks.length}</b><small class="muted">日报自动回填</small></div><div class="card kpi"><span class="muted">待处理反馈</span><b>${pending}</b><small class="muted">运营处理中心</small></div><div class="card kpi"><span class="muted">覆盖门店</span><b>${state.user.role==='store'?'1':state.stores.length}</b><small class="muted">实时数据</small></div></section><section class="card section"><div class="toolbar"><div><b style="font-size:20px">近期日报</b><div class="muted">${state.month}</div></div>${state.user.role!=='store'?'<button class="btn light" onclick="exportCsv()">导出 CSV</button>':''}</div><div style="overflow:auto"><table class="table"><thead><tr><th>日期</th><th>门店</th><th>营业额</th><th>会员新增</th><th>提交人</th></tr></thead><tbody>${state.reports.slice(0,12).map(r=>`<tr><td>${r.report_date}</td><td>${esc(r.store_name||'本店')}</td><td>${money(r.payload?.revenue)}</td><td>${r.payload?.members||0}</td><td>${esc(r.submitter_name||'-')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">本月还没有日报</td></tr>'}</tbody></table></div></section>`}
function report(c){const today=new Date().toISOString().slice(0,10),old=state.reports.find(r=>r.report_date===today);c.innerHTML=`<section class="hero"><div><div class="eyebrow">${today}</div><h1>今日日报</h1><p>直接填写，不再上传文件。提交后自动进入经营看板与目标月历。</p></div></section><section class="card"><div class="form">${state.fields.map(f=>`<label class="label"><span>${esc(f.label)} ${f.required?'<b class="dangerText">*</b>':''}<small class="muted"> ${esc(f.unit)}</small></span><input class="input" id="f_${esc(f.key)}" type="${f.field_type==='number'?'number':'text'}" value="${esc(old?.payload?.[f.key]??'')}" placeholder="请输入${esc(f.label)}"></label>`).join('')}<label class="label"><span>备注</span><textarea class="input" id="f_note" rows="4">${esc(old?.payload?.note||'')}</textarea></label><button class="btn blue" onclick="submitReport()">${old?'覆盖并提交今日数据':'提交今日日报'}</button></div></section>${old?'<div class="section muted">今天已经提交过日报。再次提交会保留版本号并覆盖当前数据。</div>':''}`}
window.submitReport=async()=>{const date=new Date().toISOString().slice(0,10),old=state.reports.find(r=>r.report_date===date);if(old&&!confirm('今日已有日报，是否覆盖？'))return;const payload={};for(const f of state.fields){const el=$('#f_'+f.key);if(f.required&&!el.value.trim())return toast('请填写：'+f.label);payload[f.key]=f.field_type==='number'?(el.value===''?'':Number(el.value)):el.value}payload.note=$('#f_note').value;try{await api('/reports',{method:'POST',body:JSON.stringify({date,payload})});toast('日报已提交，数据已同步');state.tab='home';await load()}catch(e){toast(e.message)}};
function calendar(c){const [y,m]=state.month.split('-').map(Number),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),goal=state.goals[0],tasks=state.tasks;const actual=tasks.reduce((s,t)=>s+Number(t.actual_value||0),0),target=Number(goal?.goal_value||0),pct=target?Math.round(actual/target*100):0;c.innerHTML=`<section class="hero"><div><div class="eyebrow">${state.month}</div><h1>目标月历</h1><p>每一天都有目标，每一次日报都会回到这里。</p></div>${state.user.role!=='store'?'<button class="btn blue" onclick="goalModal()">下发 / 编辑月目标</button>':''}</section><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card"><span class="muted">月目标</span><b style="font-size:30px;display:block;margin-top:10px">${money(target)}</b></div><div class="card"><span class="muted">已完成</span><b style="font-size:30px;display:block;margin-top:10px">${money(actual)}</b></div><div class="card"><span class="muted">完成率</span><b style="font-size:30px;display:block;margin-top:10px">${pct}%</b></div></div><section class="card section"><div class="toolbar"><button class="btn light" onclick="changeMonth(-1)">‹</button><div class="monthTitle">${y}年${m}月</div><button class="btn light" onclick="changeMonth(1)">›</button></div><div class="calendar">${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{const d=`${state.month}-${String(i+1).padStart(2,'0')}`,t=tasks.find(x=>x.task_date===d),p=t?Math.min(100,Math.round(Number(t.actual_value||0)/Math.max(1,Number(t.target_value))*100)):0;return `<div class="day ${d===new Date().toISOString().slice(0,10)?'today':''}"><div class="num">${i+1}</div><div class="goal">${t?`目标 ${money(t.target_value)}`:'无任务'}</div><div class="goal">${t?`实际 ${money(t.actual_value)}`:''}</div>${t?`<div class="bar"><i style="width:${p}%"></i></div>`:''}</div>`}).join('')}</div></section>`}
window.changeMonth=async delta=>{let [y,m]=state.month.split('-').map(Number);m+=delta;if(m===0){y--;m=12}if(m===13){y++;m=1}state.month=`${y}-${String(m).padStart(2,'0')}`;await load()};
window.goalModal=()=>{const stores=state.stores.filter(s=>s.status==='active');modal(`<div class="toolbar"><h2 style="margin:0">月目标</h2><button class="btn light" onclick="closeModal()">关闭</button></div><div class="form"><label class="label">门店<select class="input" id="g_store">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="label">月份<input class="input" id="g_month" value="${state.month}"></label><label class="label">月目标（营业额）<input class="input" id="g_value" type="number" value="300000"></label><label class="label">分解方式<select class="input" id="g_rule"><option value="average">按天平均</option><option value="weekendWeight">周末权重</option><option value="custom">自定义每日目标</option></select></label><div id="customHint" class="muted">选择自定义后，会生成每日目标输入框，并校验每日合计必须等于月目标。</div><button class="btn blue" onclick="saveGoal()">保存并下发</button></div>`);$('#g_rule').onchange=()=>{if($('#g_rule').value==='custom'){const [y,m]=($('#g_month').value||state.month).split('-').map(Number),n=new Date(y,m,0).getDate();$('#customHint').innerHTML='<div class="form">'+Array.from({length:n},(_,i)=>`<input class="input ctarget" type="number" placeholder="${i+1}日目标">`).join('')+'</div>'}else $('#customHint').textContent='系统将自动生成每日目标。'}};
window.saveGoal=async()=>{const month=$('#g_month').value,rule=$('#g_rule').value,body={storeId:Number($('#g_store').value),month,goalValue:Number($('#g_value').value),rule};if(rule==='custom')body.customTargets=[...document.querySelectorAll('.ctarget')].map(x=>Number(x.value||0));try{await api('/goals',{method:'POST',body:JSON.stringify(body)});closeModal();toast('月目标已下发');await load()}catch(e){toast(e.message)}};
function issues(c){c.innerHTML=`<section class="hero"><div><div class="eyebrow">运营中心</div><h1>问题反馈</h1><p>处理门店问题，结果会自动回到店长端。</p></div></section><section class="card"><div style="overflow:auto"><table class="table"><thead><tr><th>门店</th><th>类型</th><th>内容</th><th>提交人</th><th>状态</th><th></th></tr></thead><tbody>${state.issues.map(i=>`<tr><td>${esc(i.store_name)}</td><td>${esc(i.type)}</td><td>${esc(i.content)}</td><td>${esc(i.submitter_name)}</td><td>${i.status==='pending'?'待处理':'已解决'}</td><td>${i.status==='pending'?`<button class="btn blue" onclick="resolveIssue(${i.id})">处理</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无反馈</td></tr>'}</tbody></table></div></section>`}window.resolveIssue=async id=>{const note=prompt('处理备注','已处理，请门店关注后续执行。');if(note===null)return;await api('/issues/'+id,{method:'PATCH',body:JSON.stringify({note})});toast('反馈已解决');await load()};
function admin(c){c.innerHTML=`<section class="hero"><div><div class="eyebrow">管理员</div><h1>系统管理</h1><p>定义日报、管理门店和人员，并保留完整操作记录。</p></div></section><section class="card"><div class="toolbar"><div><b style="font-size:20px">日报模板</b><div class="muted">店长端实时跟随这里的字段</div></div><button class="btn blue" onclick="addField()">新增字段</button></div><div>${state.fields.map((f,i)=>`<div class="fieldRow"><input class="input" data-label="${i}" value="${esc(f.label)}"><input class="input" data-unit="${i}" value="${esc(f.unit)}" placeholder="单位"><select class="input" data-type="${i}"><option value="number" ${f.field_type==='number'?'selected':''}>数字</option><option value="text" ${f.field_type==='text'?'selected':''}>文字</option></select><label><input type="checkbox" data-req="${i}" ${f.required?'checked':''}> 必填</label></div>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn blue" onclick="saveFields()">保存日报模板</button></div></section><section class="card section"><div class="toolbar"><div><b style="font-size:20px">门店与人员</b><div class="muted">同一门店口令，不同姓名独立记录操作</div></div><div class="row"><button class="btn light" onclick="addUser()">新增员工</button><button class="btn blue" onclick="addStore()">新增门店</button></div></div><div style="overflow:auto"><table class="table"><thead><tr><th>门店</th><th>地址</th><th>店长</th><th>口令</th><th>状态</th><th></th></tr></thead><tbody>${state.stores.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.address)}</td><td>${esc(s.manager_name)}</td><td>••••••</td><td>${s.status}</td><td><button class="btn light" onclick="editStore(${s.id})">编辑</button></td></tr>`).join('')}</tbody></table></div></section><section class="card section"><h2>员工姓名</h2><div style="overflow:auto"><table class="table"><thead><tr><th>姓名</th><th>门店</th><th></th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.store_name)}</td><td><button class="btn light" onclick="removeUser(${u.id})">删除</button></td></tr>`).join('')}</tbody></table></div></section><section class="card section"><div class="toolbar"><h2 style="margin:0">操作日志</h2><span class="muted">最近 300 条</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>时间</th><th>人员</th><th>动作</th><th>对象</th></tr></thead><tbody>${state.audit.slice(0,30).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('zh-CN',{hour12:false})}</td><td>${esc(a.user_name||'-')}</td><td>${esc(a.action)}</td><td>${esc(a.entity)} #${esc(a.entity_id)}</td></tr>`).join('')}</tbody></table></div></section>`}
window.addField=()=>{state.fields.push({label:'新字段',key:'field_'+Date.now(),field_type:'number',unit:'',required:false});render()};window.saveFields=async()=>{const fields=state.fields.map((f,i)=>({...f,label:document.querySelector(`[data-label="${i}"]`).value,unit:document.querySelector(`[data-unit="${i}"]`).value,field_type:document.querySelector(`[data-type="${i}"]`).value,required:document.querySelector(`[data-req="${i}"]`).checked}));try{await api('/report-fields',{method:'PUT',body:JSON.stringify({fields})});toast('日报模板已保存');await load()}catch(e){toast(e.message)}};
window.addStore=()=>modal(`<div class="toolbar"><h2 style="margin:0">新增门店</h2><button class="btn light" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="s_name" placeholder="门店名称"><input class="input" id="s_addr" placeholder="地址"><input class="input" id="s_manager" placeholder="店长姓名"><input class="input" id="s_code" placeholder="门店口令"><button class="btn blue" onclick="createStore()">创建</button></div>`);window.createStore=async()=>{try{await api('/stores',{method:'POST',body:JSON.stringify({name:$('#s_name').value,address:$('#s_addr').value,managerName:$('#s_manager').value,code:$('#s_code').value})});closeModal();toast('门店已创建');await load()}catch(e){toast(e.message)}};
window.editStore=id=>{const s=state.stores.find(x=>x.id===id);modal(`<div class="toolbar"><h2 style="margin:0">编辑 ${esc(s.name)}</h2><button class="btn light" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="e_name" value="${esc(s.name)}"><input class="input" id="e_addr" value="${esc(s.address)}"><input class="input" id="e_manager" value="${esc(s.manager_name)}"><input class="input" id="e_code" placeholder="输入新口令则修改"><select class="input" id="e_status"><option value="active" ${s.status==='active'?'selected':''}>启用</option><option value="archived" ${s.status==='archived'?'selected':''}>归档</option></select><button class="btn blue" onclick="updateStore(${id})">保存</button><button class="btn red" onclick="archiveStore(${id})">归档门店</button></div>`)};window.updateStore=async id=>{const body={name:$('#e_name').value,address:$('#e_addr').value,managerName:$('#e_manager').value,status:$('#e_status').value};if($('#e_code').value)body.code=$('#e_code').value;if(body.code&&!confirm('修改门店口令后，该门店下次登录必须使用新口令。确认修改？'))return;await api('/stores/'+id,{method:'PATCH',body:JSON.stringify(body)});closeModal();toast('门店已更新');await load()};window.archiveStore=async id=>{if(!confirm('确认归档门店？历史数据保留，但门店将无法登录。'))return;await api('/stores/'+id,{method:'DELETE',body:JSON.stringify({confirm:'DELETE'})});closeModal();toast('门店已归档');await load()};
window.addUser=()=>modal(`<div class="toolbar"><h2 style="margin:0">新增员工姓名</h2><button class="btn light" onclick="closeModal()">关闭</button></div><div class="form"><input class="input" id="u_name" placeholder="员工姓名"><select class="input" id="u_store">${state.stores.filter(s=>s.status==='active').map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn blue" onclick="createUser()">创建</button></div>`);window.createUser=async()=>{await api('/users',{method:'POST',body:JSON.stringify({name:$('#u_name').value,storeId:Number($('#u_store').value)})});closeModal();toast('员工已添加');await load()};window.removeUser=async id=>{if(!confirm('确认删除该员工姓名？历史操作记录不会被删除。'))return;await api('/users/'+id,{method:'DELETE',body:JSON.stringify({confirm:'DELETE'})});toast('员工已删除');await load()};
function exportCsv(){location.href='/api/export/reports.csv?month='+state.month+'&token='+encodeURIComponent(localStorage.token)}
const socket=io();socket.on('data:changed',()=>{if(localStorage.token)load().catch(()=>{})});if(localStorage.token)load().catch(()=>{localStorage.removeItem('token');login()});else login();
</script></body></html>
